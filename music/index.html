<style>

  /* ---------- Sonora — vintage warm deck (skeuomorphic, sharp, no pills) ---------- */
  :root{
    --bg:#0b0906;
    --app:#171310;
    --surface:#1e1913;
    --surface2:#272018;
    --surface3:#332a1e;
    --elev:#3b3122;
    --line:#3a3124;
    --line-2:#2b241a;
    --text:#f2e7d2;
    --muted:#b5a488;
    --muted2:#7f7257;
    --accent:#e0a63f;
    --accent-deep:#8a5a1e;
    --accent-ink:#231503;
    --accent-glow:rgba(224,166,63,.28);
    --ok:#8fbf7e;
    --err:#e06c5c;
    --radius:2px;
    --tabbar-h:58px;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --bevel:inset 0 1px 0 rgba(255,240,215,.09), inset 0 -1px 0 rgba(0,0,0,.45);
    --hardshadow:0 4px 0 rgba(0,0,0,.5), 0 12px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* no zooming: no pinch, no double-tap, no focus-zoom */
  html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,.row,.chip,.card,.quick,.genre,.iconbtn{touch-action:manipulation}
  input[type="range"]{touch-action:none}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#050403;
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
  input{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:0;height:0}

  /* ---------- mobile fullscreen shell ---------- */
  /* No install/PWA any more — the page itself fills the phone screen:
     edge to edge, safe-area aware, its own scroll container. Keeps the
     browser's own fullscreen when the browser grants it, and still looks
     like an app when it doesn't (iOS Safari has no Element.fullscreen). */
  body.mobile{
    background:var(--app);
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  body.mobile #app{
    max-width:none;
    height:100dvh;
    height:calc(var(--vh) * 100);
    border-left:0;border-right:0;
  }
  /* while the browser has real fullscreen, drop every bit of chrome */
  #app:fullscreen,
  html:fullscreen #app{
    max-width:none;width:100%;height:100%;
    border:0;box-shadow:none;
  }
  html:fullscreen body,
  html:-webkit-full-screen body{background:var(--app)}

  /* ---------- app frame ---------- */
  :root{ --side:248px; --maxw:460px; --contentw:980px; --vh:1vh }
  #app{
    position:relative;
    width:100%;max-width:var(--maxw);
    height:100dvh;height:100svh;
    margin:0 auto;
    background:
      linear-gradient(180deg, #221b14 0%, var(--app) 18%) ,
      var(--app);
    display:flex;flex-direction:column;
    overflow:hidden;
    isolation:isolate;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    border-left:1px solid #0a0806;
    border-right:1px solid #0a0806;
  }
  /* app shell: sidebar on desktop, bottom tab bar on mobile.
     On phones this MUST stay a column: #content stacked above #sidebar.
     A row here turns the bottom tab bar into a narrow right-hand column
     (the bug where the app was 269px wide with a 119px tab stub). */
  #app{ flex-direction:column; }
  #content{ flex:1 1 auto; min-height:0; min-width:0; display:flex; flex-direction:column; }
  #sidebar{
    display:flex; flex-direction:row; align-items:stretch;
    order:3; margin-top:auto; width:100%;
    background:linear-gradient(180deg, #171310 0%, #100d09 100%);
    border-top:1px solid #060503;box-shadow:0 -1px 0 rgba(255,236,205,.05);
    padding-bottom:var(--safe-b);
    flex:0 0 auto;
  }
  #sbBrand,#sbFoot{display:none}
  #tabbar{flex:1 1 auto; border:0; box-shadow:none; padding:0; border-top:0; background:transparent}
  @media (min-width:600px){
    body{
      display:flex;align-items:center;justify-content:center;padding:24px 0;
      background:
        radial-gradient(1200px 800px at 50% -10%, #2c241a 0%, transparent 55%),
        radial-gradient(900px 700px at 12% 115%, #241c12 0%, transparent 50%),
        #050403;
    }
    #app{
      height:min(920px,calc(100dvh - 48px));
      border:1px solid #050403;
      box-shadow:0 40px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(255,236,205,.06);
    }
  }
  @media (min-width:1024px){
    :root{ --side:248px; }
    body{ display:flex; align-items:stretch; justify-content:center; padding:0; }
    #app{
      max-width:none; height:100dvh; height:100svh;
      border:0; box-shadow:none; border-left:0; border-right:0;
      display:grid; grid-template-columns:var(--side) minmax(0,1fr);
      background:var(--app);
    }
    #sidebar{
      display:flex;flex-direction:column;order:0;margin-top:0;gap:16px;
      padding:22px 14px calc(18px + var(--safe-b));
      background:linear-gradient(180deg, #17120c 0%, #0f0c08 100%);
      border-right:1px solid #060503;box-shadow:inset -1px 0 0 rgba(255,236,205,.04);
      min-height:0;overflow-y:auto;
    }
    #sbBrand{padding:2px 6px 6px;display:flex;flex-direction:column;gap:4px}
    #sbBrand .wordmark{font-family:var(--font);font-size:26px;font-weight:700;letter-spacing:.02em;color:#f6edd9;text-shadow:0 2px 6px rgba(0,0,0,.8)}
    #sbBrand .sub{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted2);text-transform:uppercase}
    #sidebar::after{content:"\25B0\2002";display:none}
    #sidebar #tabbar{
      display:flex;flex-direction:column;gap:4px;flex:1 1 auto;min-height:0;
      border-top:0;border-bottom:0;box-shadow:none;padding:0;background:transparent;
    }
    #sidebar #tabbar button{
      flex-direction:row;gap:12px;align-items:center;justify-content:flex-start;
      padding:13px 14px;border-radius:0;border-right:0;border-left:3px solid transparent;
      font-size:14px;letter-spacing:.04em;text-transform:uppercase;
    }
    #sidebar #tabbar button svg{width:22px;height:22px}
    #sidebar #tabbar button.on{border-left-color:var(--accent);background:linear-gradient(180deg, rgba(224,166,63,.14), rgba(224,166,63,.04));box-shadow:none}
    #sidebar #tabbar button.on:hover{background:linear-gradient(180deg, rgba(224,166,63,.18), rgba(224,166,63,.06))}
    #sbFoot{display:flex;flex-direction:column;gap:8px;padding:10px 8px 0;border-top:1px solid var(--line-2)}
    #sbFoot .foot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted2);line-height:1.7}
    #sbFoot .foot b{color:var(--muted)}
    #content{display:flex;flex-direction:column;min-width:0;min-height:0;order:1}
    #bottom{border-top:1px solid #060503}
    #bottom #mini{margin:6px 16px 10px;border-color:#2c2517}
    #view{max-width:var(--contentw);margin:0 auto;width:100%;}
    #view > .viewfade{max-width:var(--contentw);margin:0 auto}
    main#view{padding-bottom:16px}
    .quickgrid{grid-template-columns:repeat(4,1fr)}
    .cardgrid{grid-template-columns:repeat(4,1fr)}
    .shelf{gap:16px;padding-left:16px;padding-right:16px}
    .card{flex:0 0 auto;width:178px}
    .card .art{width:178px;height:178px}
    .genre{height:104px}
  }
  @media (max-width:1039px) and (min-width:600px){
    #app{ max-width:640px }
    :root{ --maxw:640px }
  }
  @media (max-height:560px) and (orientation:landscape){
    .hero{padding:4px 14px 10px}
    .hero h2{font-size:20px;margin-bottom:10px}
    .quick{height:48px} .quick .art{width:44px;height:44px}
    .sec{padding-top:12px}
    .card{width:112px} .card .art{width:112px;height:112px}
    .row .art{width:44px;height:44px}
    .np-art{width:min(56vw,210px)!important}
    .np-body{padding:16px 18px 0}
    .np-title{font-size:19px}
    .quickgrid{gap:6px}
  }

  @media (max-width:480px){
    #topbar h1{font-size:18px}
    .hero h2{font-size:21px}
    #tabbar button{font-size:9px;gap:3px}
    #tabbar button svg{width:21px;height:21px}
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:relative;z-index:5;flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:calc(var(--safe-t) + 10px) 14px 12px;
    background:linear-gradient(180deg, rgba(16,13,9,.98), rgba(24,19,14,.98));
    border-bottom:1px solid #060503;
    box-shadow:0 1px 0 rgba(255,232,198,.05), 0 2px 8px rgba(0,0,0,.5);
  }
  #topbar h1{
    font-family:var(--font);
    font-size:21px;font-weight:700;letter-spacing:.01em;margin:0;flex:1;min-width:0;
    display:flex;align-items:center;gap:8px;
    text-shadow:0 -1px 0 rgba(0,0,0,.8), 0 1px 0 rgba(255,236,205,.08);
  }
  .statuschip{
    font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;
    padding:4px 6px;border:1px solid #5a4423;
    background:linear-gradient(180deg,#3a2e1c,#2a2214);
    color:#f3c96e;
    box-shadow:var(--bevel);
    flex:0 0 auto;
  }
  .statuschip.off{background:linear-gradient(180deg,#2a241b,#1f1a12);color:var(--muted);border-color:var(--line)}
  .statuschip.err{background:linear-gradient(180deg,#3d1c17,#2a120e);color:#f0917d;border-color:#5c2a20}
  .iconbtn{
    width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;
    color:var(--muted);border:1px solid var(--line);
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    box-shadow:var(--bevel);
  }
  .iconbtn:active{background:var(--surface);box-shadow:inset 0 2px 4px rgba(0,0,0,.55);transform:translateY(1px)}
  .iconbtn svg{width:21px;height:21px;display:block}
  #backBtn{margin-left:-6px}

  /* ---------- scroll area ---------- */
  main#view{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding-bottom:20px;
    width:100%;
  }
  .viewfade{animation:fade .24s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- home ---------- */
  .hero{
    padding:6px 16px 18px;
    background:linear-gradient(180deg, rgba(224,166,63,.22), rgba(224,166,63,0) 94%);
    border-bottom:1px solid var(--line-2);
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .hero h2{
    font-family:var(--font);font-size:25px;font-weight:700;margin:0 0 16px;letter-spacing:.005em;
    text-shadow:0 2px 6px rgba(0,0,0,.75);color:#f6eedd;
  }
  .hero h2::after{content:"";display:block;height:1px;background:linear-gradient(90deg,var(--accent),transparent 80%);margin-top:8px;opacity:.7}
  .quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .quick{
    display:flex;align-items:center;gap:11px;height:58px;text-align:left;
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    border:1px solid var(--line);box-shadow:var(--bevel);
  }
  .quick:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.55);transform:translateY(1px)}
  .quick .art{width:58px;height:58px;flex:0 0 auto}
  .quick span{
    font-size:13px;font-weight:700;padding-right:10px;line-height:1.28;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .sec{padding-top:22px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 12px}
  .sec-head h3{font-family:var(--font);font-size:18px;font-weight:700;margin:0;letter-spacing:.02em;color:#f2e6cd}
  .sec-head .more{font-size:11.5px;font-weight:800;color:var(--muted2);letter-spacing:.14em}

  .shelf{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px}
  .card{flex:0 0 auto;width:148px;text-align:left}
  .card .art{
    width:148px;height:148px;position:relative;overflow:hidden;
    box-shadow:0 10px 22px rgba(0,0,0,.55), var(--bevel);border:1px solid #000;
  }
  .card .t{
    font-family:var(--font);font-size:13.5px;font-weight:700;margin-top:10px;line-height:1.32;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
    text-shadow:0 1px 0 #000;
  }
  .card .s{font-size:11.5px;color:var(--muted);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}

  .art{background:linear-gradient(140deg,#3a3125,#17130d);background-size:cover;background-position:center;display:grid;place-items:center}
  .badge-audio{
    position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;
    background:rgba(10,7,3,.78);color:#f0c569;padding:3px 6px;border:1px solid rgba(224,166,63,.4);
  }

  /* ---------- rows ---------- */
  .rows{padding:0 0 6px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line-2)}
  .row:active{background:linear-gradient(180deg, rgba(224,166,63,.12), rgba(224,166,63,.05))}
  .row .art{width:52px;height:52px;flex:0 0 auto;position:relative;overflow:hidden;border:1px solid #000;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .row .meta{flex:1;min-width:0}
  .row .meta .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f5ead4}
  .row .meta .s{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .tail{display:flex;align-items:center;gap:4px;flex:0 0 auto;color:var(--muted2)}
  .row .tail svg{width:18px;height:18px}
  .row .dur{font-family:var(--mono);font-size:11.5px;color:var(--muted2);font-variant-numeric:tabular-nums}

  /* ---------- chips: beveled rectangles, no pills ---------- */
  .chips{display:flex;gap:8px;padding:2px 16px 4px;overflow-x:auto}
  .chip{
    flex:0 0 auto;font-size:12.5px;font-weight:800;letter-spacing:.04em;padding:9px 15px;
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    color:var(--muted);border:1px solid var(--line);box-shadow:var(--bevel);
  }
  .chip.on{
    color:var(--accent-ink);
    background:linear-gradient(180deg, #f0bc58, #c98a2c);
    border-color:#7a4e16;box-shadow:inset 0 1px 0 rgba(255,240,200,.5), 0 3px 0 rgba(0,0,0,.4);
  }
  .chip:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}

  .note{
    margin:20px 16px 8px;padding:13px 14px;
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    border:1px solid var(--line);box-shadow:var(--bevel);
    font-size:12.5px;line-height:1.55;color:#e2d5b8;
  }
  .note b{color:#f6ebc9}
  .note button{color:var(--accent);font-weight:800;text-decoration:underline;font-size:12.5px}

  /* ---------- search ---------- */
  .searchwrap{padding:2px 16px 6px}
  .searchbox{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg, #0f0c08, #171310);
    border:1px solid var(--line);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.65), 0 1px 0 rgba(255,235,200,.05);
    height:46px;padding:0 12px;
  }
  .searchbox input{
    flex:1;border:0;outline:0;background:transparent;color:#f5ecd6;
    font-size:16px;font-weight:600;appearance:none;-webkit-appearance:none;
  }
  .searchbox input::placeholder{color:var(--muted2)}
  .searchbox input::-webkit-search-cancel-button{display:none}
  .searchbox svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto}
  .genres{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
  .genre{height:86px;padding:12px;font-weight:800;font-size:15px;position:relative;overflow:hidden;text-align:left;border:1px solid rgba(0,0,0,.45);box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .genre::after{content:"";position:absolute;right:-16px;bottom:-16px;width:56px;height:56px;background:rgba(0,0,0,.3);transform:rotate(22deg)}

  /* ---------- library ---------- */
  .libhead{padding:8px 16px 14px;display:flex;align-items:center;justify-content:space-between}
  .libhead .lbl{font-family:var(--font);font-size:22px;font-weight:700;color:#f4ead2;text-shadow:0 2px 5px rgba(0,0,0,.7)}
  .libhead h2{font-family:var(--font);font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;color:#f4ead2}
  .addbtn{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--accent-ink);
    background:linear-gradient(180deg, #f0bc58, #c98a2c);
    border:1px solid #7a4e16;box-shadow:inset 0 1px 0 rgba(255,240,200,.55), 0 3px 0 rgba(0,0,0,.4);
    padding:9px 14px;
  }
  .addbtn svg{width:15px;height:15px}
  .addbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
  .empty{padding:44px 30px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--font);font-size:16px;font-weight:700;color:#e9dcc2;margin-bottom:8px}
  .empty p{font-size:13px;line-height:1.55;margin:0;color:var(--muted)}

  /* ---------- settings ---------- */
  .setsec{margin:0 16px 22px}
  .setsec h3{font-family:var(--font);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:0 0 10px;font-weight:800}
  .card-box{background:linear-gradient(180deg, var(--surface2), var(--surface));border:1px solid var(--line);box-shadow:var(--bevel);overflow:hidden}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px;border-bottom:1px solid var(--line-2)}
  .setrow:last-child{border-bottom:0}
  .setrow > div{min-width:0}
  .setrow > div:first-child{flex:1 1 auto}
  .setrow .lbl{font-size:14px;font-weight:700;color:#efe2c8}
  .setrow .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .setrow.col{display:block}
  .seg{display:flex;background:#100d09;border:1px solid var(--line-2);padding:3px;gap:3px;flex:0 0 auto;white-space:nowrap;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
  .seg button{font-size:11.5px;font-weight:700;padding:7px 9px;color:var(--muted);background:transparent;border:1px solid transparent;letter-spacing:.02em}
  .seg button.on{color:#241503;background:linear-gradient(180deg,#f0bc58,#cf9130);border-color:#7a4e16;box-shadow:inset 0 1px 0 rgba(255,240,200,.5)}
  .setrow.col .seg{margin-top:12px;width:100%}
  .setrow.col .seg button{flex:1 1 0;padding:9px 4px;text-align:center}
  .meter{height:9px;background:#100d09;border:1px solid var(--line-2);overflow:hidden;margin-top:10px;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
  .meter i{display:block;height:100%;background:linear-gradient(180deg,#f0bc58,#b97c24);box-shadow:inset 0 1px 0 rgba(255,240,200,.4);transition:width .3s}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
  .danger{color:#f0917d;font-weight:800}
  .danger-lg{color:#f0917d}

  /* ---------- bottom: mini player ---------- */
  #bottom{flex:0 0 auto;position:relative;z-index:6;background:linear-gradient(180deg, var(--surface), var(--app))}
  #mini[hidden]{display:none}
  #backBtn[hidden]{display:none}
  #mini{
    display:flex;align-items:center;gap:11px;
    margin:0 10px 7px;padding:8px 11px;
    background:linear-gradient(135deg, #3a2d1b 0%, #241c12 78%);
    border:1px solid #4a3a20;box-shadow:var(--bevel), 0 10px 24px rgba(0,0,0,.55);
  }
  #mini .art{width:42px;height:42px;flex:0 0 auto;position:relative;overflow:hidden;border:1px solid rgba(240,197,105,.45);box-shadow:0 3px 8px rgba(0,0,0,.5)}
  #mini .meta{flex:1;min-width:0}
  #mini .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f8eed7}
  #mini .s{font-size:11.5px;color:#cbbc9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mini .prog{height:3px;background:rgba(0,0,0,.5);margin-top:7px;overflow:hidden;border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
  #mini .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a63f,#f5c468)}
  #mini .mbtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;color:#f8eacd;border:1px solid rgba(224,166,63,.4);background:linear-gradient(180deg,#4a3a20,#332a1a);box-shadow:var(--bevel)}
  #mini .mbtn svg{width:20px;height:20px}
  #mini .mskip{width:30px;height:36px;border-color:rgba(224,166,63,.18);background:transparent;box-shadow:none;color:#cbbc9a}
  #mini .mskip svg{width:17px;height:17px}
  #mini .mskip:active{color:var(--accent);transform:translateY(1px)}

  #tabbar{
    flex:1 1 auto;
    /* the design token is 58px but the row only measured 38px, which pushed the
       labels hard against the screen edge on a 390x844 phone */
    min-height:var(--tabbar-h);
    padding-bottom:var(--safe-b);
    display:flex;align-items:stretch;
    background:linear-gradient(180deg, #171310 0%, #100d09 100%);
  }
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted2);font-size:9.5px;font-weight:800;letter-spacing:.08em;border-right:1px solid var(--line-2)}
  #tabbar button:last-child{border-right:0}
  #tabbar button svg{width:23px;height:23px}
  #tabbar button.on{color:#f2d18d;text-shadow:0 -1px 0 #000}
  #tabbar button.on svg{color:var(--accent)}

  /* ---------- now playing sheet ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;background:linear-gradient(180deg, #241e17 0%, var(--app) 40%);
    border-top:1px solid #0a0806;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;will-change:transform;
  }
  .sheet.open{transform:translateY(0)}
  .np-top{display:flex;align-items:center;padding:calc(var(--safe-t) + 10px) 14px 6px;gap:10px;border-bottom:1px solid var(--line-2)}
  .np-top .label{flex:1;text-align:center;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--muted2)}
  .np-art{
    width:min(78vw,300px);aspect-ratio:1;margin:16px auto 0;
    border:1px solid #000;box-shadow:0 24px 50px rgba(0,0,0,.65), 0 0 0 6px rgba(224,166,63,.08);
    position:relative;overflow:hidden;flex:0 0 auto;background-size:cover;background-position:center;background-color:#241c12;
  }
  .np-body{padding:26px 24px 0;flex:1 1 auto;min-height:0;overflow-y:auto}
  .np-title{font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.22;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  .np-artist{font-size:14.5px;color:var(--muted);margin-top:6px}
  .np-qual{
    display:inline-block;margin-top:12px;font-family:var(--mono);font-size:10.5px;font-weight:700;
    letter-spacing:.09em;color:#f3c96e;background:linear-gradient(180deg,#3a2e1c,#2a2214);
    border:1px solid #5a4423;padding:5px 9px;box-shadow:var(--bevel);
  }
  .seek{display:flex;align-items:center;gap:10px;margin-top:22px;font-family:var(--mono);font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
  .seek input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:8px;outline:0;border-radius:0;
    background:linear-gradient(180deg, #0f0c08, #241e16);border:1px solid #060503;box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
  }
  .seek input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:26px;border-radius:2px;border:1px solid #000;
    background:linear-gradient(180deg, #f2c368, #b67d24);box-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .seek input[type=range]::-moz-range-thumb{
    width:16px;height:26px;border-radius:2px;border:1px solid #000;
    background:linear-gradient(180deg, #f2c368, #b67d24);box-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .seek input[type=range]::-moz-range-track{background:#0f0c08;height:8px;border:1px solid #060503}
  .np-controls{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 8px}
  .np-controls button{display:grid;place-items:center;width:56px;height:56px;color:#e9dcc4;border:1px solid transparent;background:transparent}
  .np-controls button svg{width:26px;height:26px}
  .np-controls button.small{width:46px;height:46px;color:var(--muted)}
  .np-controls button.small svg{width:22px;height:22px}
  .np-controls button.small.on{color:var(--accent)}
  .np-controls .main{
    width:72px;height:72px;color:var(--accent-ink);
    background:linear-gradient(180deg, #f0bc58 0%, #c98a2c 100%);
    border:1px solid #6e4712;box-shadow:inset 0 2px 0 rgba(255,236,190,.75), 0 6px 0 rgba(0,0,0,.45), 0 10px 22px rgba(0,0,0,.5);
  }
  .np-controls .main svg{width:30px;height:30px}
  .np-bottom{display:flex;align-items:center;justify-content:space-between;padding:18px 26px calc(var(--safe-b) + 20px);margin-top:auto}

  /* ---------- action sheet + scrim ---------- */
  #scrim{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
  #scrim.on{opacity:1;pointer-events:auto}
  #asheet{
    position:absolute;left:0;right:0;bottom:0;z-index:16;
    background:linear-gradient(180deg, var(--surface2), var(--app));
    border-top:1px solid #0a0806;box-shadow:0 -20px 50px rgba(0,0,0,.6);
    padding-bottom:calc(var(--safe-b) + 10px);
    transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:72%;overflow-y:auto;
  }
  #asheet.open{transform:translateY(0)}
  #asheet .ahead{padding:16px 20px 12px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--muted)}
  #asheet .ahead b{display:block;font-family:var(--font);font-size:15px;color:#f3e7cb;margin-bottom:3px}
  .aitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 20px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line-2)}
  .aitem:active{background:rgba(224,166,63,.1)}
  .aitem svg{width:20px;height:20px;color:var(--muted)}

  #toast{
    position:absolute;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 84px);
    transform:translate(-50%,10px);z-index:30;
    background:linear-gradient(180deg, #241d13, #171310);color:#f5ecdb;
    font-size:12.5px;font-weight:700;padding:13px 18px;border:1px solid #3a3020;
    box-shadow:0 14px 36px rgba(0,0,0,.6);max-width:88%;text-align:center;line-height:1.4;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- lyrics panel + misc ---------- */
  .lyrics{
    margin-top:16px;max-height:34vh;overflow-y:auto;
    border-top:1px solid var(--line-2);padding:12px 4px 8px;
    scroll-behavior:smooth;
  }
  .lyrics-body{min-height:52px}
  .lyrics-status{font-family:var(--mono);font-size:11px;color:var(--muted2);text-align:center;padding:10px 0}
  .lyrics-plain{
    font-family:var(--font);font-size:14.5px;line-height:1.72;color:#e6dcc6;
    padding:0 6px;white-space:normal;text-align:center;
  }
  .lyrics-line{
    font-family:var(--font);font-size:15px;line-height:1.55;color:#8a7d61;
    text-align:center;padding:5px 8px;transition:color .3s,transform .3s;
    transform-origin:center;
  }
  .lyrics-line.cur{color:#f6edd9;transform:scale(1.06);text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .lyrics-plain br{content:none}

  /* ---------- playlist image chips ---------- */
  .art{position:relative}
  .quick .art,.row .art, .card .art, .np-art{position:relative}
  .quick .art{background-size:cover;background-position:center;background-color:#241c12}
  .row .art{background-size:cover;background-position:center;background-color:#241c12}
  .card .art{background-size:cover;background-position:center;background-color:#241c12}
  .setrow .chip,.libhead .chip{display:inline-flex;align-items:center;gap:7px}
  .libhead .addbtn svg,.libhead .chip svg{width:15px;height:15px}

  /* ---------- v1.0 additions ---------- */
  .art-photo{background-size:cover;background-position:center}
  .spinner{
    width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,240,210,.2);
    border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .skeleton{padding:8px 16px}
  .skrow{display:flex;gap:12px;align-items:center;padding:10px 0}
  .sk{background:linear-gradient(90deg,#201a13,#2e2519,#201a13);background-size:200% 100%;animation:shine 1.2s infinite;border:1px solid #140f0a}
  @keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skart{width:52px;height:52px}
  .sklines{flex:1}
  .skl1{height:12px;width:60%;margin-bottom:8px}
  .skl2{height:10px;width:38%}
  .errbox{
    margin:14px 16px;padding:15px 15px 16px;
    background:linear-gradient(180deg, #2f1e18, #241612);
    border:1px solid #5a2a20;box-shadow:var(--bevel);font-size:12.5px;line-height:1.5;color:#f1c4b7
  }
  .errbox b{color:#fbc7b6;display:block;margin-bottom:5px;font-size:13.5px;font-family:var(--font)}
  .errbox code{font-family:var(--mono);font-size:11px;color:#f0917d;word-break:break-word}
  .errbox .retry{margin-top:12px;display:inline-flex;background:linear-gradient(180deg,#f0bc58,#cf9130);color:#241503;font-weight:800;font-size:12px;padding:10px 16px;border:1px solid #7a4e16;box-shadow:var(--bevel)}
  .errbox .retry:active{transform:translateY(1px)}
  .inputrow{padding:13px 15px;border-bottom:1px solid var(--line-2)}
  .inputrow:last-child{border-bottom:0}
  .inputrow label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
  .inputrow input{
    width:100%;background:#100d09;border:1px solid var(--line);
    padding:12px 13px;color:#f5ecd6;font-size:16px;outline:0;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.55);appearance:none;-webkit-appearance:none;border-radius:0;
  }
  .inputrow input:focus{border-color:var(--accent);box-shadow:inset 0 2px 5px rgba(0,0,0,.55), 0 0 0 1px var(--accent)}
  .inputrow .hint{font-size:11px;color:var(--muted2);margin-top:8px;line-height:1.5}
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 16px 10px}
  .cardgrid .card{width:auto}
  .cardgrid .card .art{width:100%;height:auto;aspect-ratio:1}
  .extlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:800;color:var(--accent);text-decoration:none;letter-spacing:.02em}
  .hero-cta{display:flex;align-items:center;gap:14px;margin-top:18px}
  .playbtn{
    display:grid;place-items:center;width:56px;height:56px;color:var(--accent-ink);
    background:linear-gradient(180deg, #f0bc58 0%, #c98a2c 100%);
    border:1px solid #6e4712;box-shadow:inset 0 2px 0 rgba(255,236,190,.75), 0 6px 0 rgba(0,0,0,.4);
  }
  .playbtn svg{width:24px;height:24px}
  .playbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
  .playlist-hero-bg{background:linear-gradient(180deg,rgba(224,166,63,.24),rgba(0,0,0,0)) !important}
  .album-hero-bg{background:linear-gradient(180deg,rgba(74,106,142,.55),rgba(0,0,0,.1)) !important}
  .hero-art{width:120px;height:120px;flex:0 0 auto;border:1px solid #000;box-shadow:0 16px 32px rgba(0,0,0,.55)}
  .hero-eyebrow{font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.22em;color:#f0d091}
  .hero-title{font-family:var(--font);font-size:21px;font-weight:700;letter-spacing:.01em;margin-top:6px;line-height:1.18;color:#f6edd9;text-shadow:0 2px 6px rgba(0,0,0,.7)}
  .hero-sub{font-size:12px;color:var(--muted);margin-top:8px}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono)}
  .import-preview{padding:2px 16px 8px}
  .import-meta{font-size:12px;color:var(--muted);line-height:1.5;padding:6px 2px}
  .import-list{margin:6px 0 0}
  .import-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .import-item .dot{width:14px;height:14px;flex:0 0 auto;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:#1f1608}
  .import-item.ok{color:#cfd9bd}
  .import-item.miss{color:var(--muted2)}
  .import-item.miss .dot{background:linear-gradient(180deg,#4a3a20,#332a1a)}
  .import-item.ok .dot{background:linear-gradient(180deg,#f0bc58,#cf9130)}
  .import-actions{display:flex;gap:10px;padding:12px 16px}
  .import-actions button{flex:1;font-size:13px;font-weight:800;letter-spacing:.04em;padding:12px;border:1px solid var(--line);background:linear-gradient(180deg, var(--surface2), var(--surface));box-shadow:var(--bevel);color:var(--text)}
  .import-actions button.primary{color:var(--accent-ink);background:linear-gradient(180deg,#f0bc58,#cf9130);border-color:#7a4e16}

  /* official-player frame (visible, in the now-playing sheet) */
  .np-video-wrap{width:calc(100% - 28px);max-width:560px;margin-left:auto;margin-right:auto;aspect-ratio:16/9;border-radius:2px;overflow:hidden;border:1px solid var(--line-2);background:#000;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.5);margin:14px auto 4px}
  .np-video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .np-video-wrap.tappable{cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Primary">
    <div id="sbBrand">
      <span class="wordmark">Sonora</span>
      <span class="sub">audio player</span>
    </div>
    <nav id="tabbar">
      <button data-tab="home" aria-label="Home"></button>
      <button data-tab="search" aria-label="Search"></button>
      <button data-tab="library" aria-label="Recently played"></button>
    </nav>
    <div id="sbFoot">
      <div class="foot"><b>PRIVACY</b><br>No account. Nothing leaves this device except playback and search.</div>
    </div>
  </aside>
  <div id="content">
  <header id="topbar">
    <button class="iconbtn" id="backBtn" data-act="back" aria-label="Back" hidden></button>
    <h1 id="pageTitle">Sonora <span id="statusChip" class="statuschip off">…</span></h1>
    <button class="iconbtn" id="gearBtn" data-act="settings" aria-label="Settings"></button>
  </header>

  <main id="view"></main>

  <div id="bottom">
    <div id="mini" hidden>
      <div class="art" id="miniArt"></div>
      <div class="meta">
        <div class="t" id="miniTitle">—</div>
        <div class="s" id="miniArtist">—</div>
        <div class="prog"><i id="miniProg"></i></div>
      </div>
      <button class="mbtn mskip" id="miniPrev" aria-label="Previous song"></button>
      <button class="mbtn" id="miniToggle" aria-label="Play or pause"></button>
      <button class="mbtn mskip" id="miniNext" aria-label="Next song"></button>
    </div>
  </div>
  </div>

  <section class="sheet" id="np" aria-hidden="true">
    <div class="np-top">
      <button class="iconbtn" data-act="close-np" aria-label="Close"></button>
      <div class="label">NOW PLAYING</div>
      <button class="iconbtn" data-act="np-menu" aria-label="More"></button>
    </div>
    <div class="np-video-wrap tappable" id="npVideoWrap"></div>
    <div class="np-body">
      <div class="np-title" id="npTitle">—</div>
      <div class="np-artist" id="npArtist">—</div>
      <div class="np-qual" id="npQual">OFFICIAL PLAYER</div>
      <div class="seek">
        <span id="npCur">0:00</span>
        <input type="range" id="npSeek" min="0" max="100" value="0" step="0.5" aria-label="Seek">
        <span id="npDur">0:00</span>
      </div>
      <div class="np-controls">
        <button class="small" data-act="shuffle" id="shufBtn" aria-label="Shuffle"></button>
        <button data-act="prev" aria-label="Previous"></button>
        <button class="main" data-act="toggle" id="npToggleBtn" aria-label="Play or pause"></button>
        <button data-act="next" aria-label="Next"></button>
        <button class="small" data-act="repeat" id="repBtn" aria-label="Repeat"></button>
      </div>
      <div id="npLyricsWrap" class="lyrics" hidden>
        <div id="npLyricsBody" class="lyrics-body"></div>
      </div>
    </div>
    <div class="np-bottom">
      <button class="iconbtn" data-act="lyrics-toggle" id="npLyricsBtn" aria-label="Lyrics"></button>
    </div>
  </section>

  <div id="scrim"></div>
  <div id="asheet"></div>
  <div id="toast"></div>
</div>

<script>
var ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l-2 0l9 -9l9 9l-2 0" /> <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /> <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>',

/* =====================================================================
   Sonora — YouTube Music client, single file
   ---------------------------------------------------------------------
   Playback : the official YouTube iframe player only — no direct-audio
              providers, no downloads, no offline mode. One player, one
              service worth trusting: YouTube itself.
   Search   : public Invidious instances (no key, no server, no login).
              Used for discovery only — playback never touches a third
              party other than YouTube.
   Storage  : localStorage (play history + settings)
   ===================================================================== */

/* ------------------------------ helpers ------------------------------ */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function fmt(sec){ sec = Math.max(0, Math.floor(sec||0)); var m = Math.floor(sec/60), s = sec%60; return m + ':' + (s<10?'0':'') + s; }
function normTitle(s){
  return String(s || '').toLowerCase()
    .replace(/\((official|lyric|lyrics|audio|visualizer|hd|4k)[^)]*\)/g,' ')
    .replace(/\[[^\]]*\]/g,' ')
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function absUrl(base, u){
  u = String(u || '').trim();
  if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  return String(base || '').replace(/\/+$/, '') + '/' + u.replace(/^\/+/, '');
}
function hostLabel(h){ return String(h || '').replace(/^https?:\/\//, '').replace(/\/+$/, ''); }
function isPlainUrl(u){ return /^https?:\/\//i.test(String(u || '')); }

var LS = (function(){
  var mem = {};
  function get(k, d){
    try {
      var v = localStorage.getItem(k);
      if (v == null) return d;
      return JSON.parse(v);
    } catch (e){ return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : d; }
  }
  function set(k, v){
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e){ mem[k] = v; }
  }
  function del(k){ try { localStorage.removeItem(k); } catch (e){ delete mem[k]; } }
  return { get: get, set: set, del: del };
})();

function toast(msg){
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

/* ------------------------------ config ------------------------------ */
/* Invidious — instances that actually returned search results. */
var DIRECTORY_CACHE = {};
var DIRECTORY_TTL = 15 * 60 * 1000;
var DIRECTORY_TTL_FAIL = 60 * 1000;
var INVIDIOUS_DIRECTORY = 'https://raw.githubusercontent.com/train233kei/invidious-watch/main/instances.json';
var INVIDIOUS_FALLBACK = ['https://iv.catgirl.cloud', 'https://invidious.ritoge.com'];

var VIDEO_RX = [/official\s*(music\s*)?video/i, /\blyrics?\s*video\b/i, /\bvisuali[sz]er\b/i, /\b(official|audio)\s*lyrics?\b/i];
var SOFT_VIDEO_RX = [/\blyric\s+video\b/i, /\bvisuali[sz]er\b/i, /\baudio\s+video\b/i];

async function directoryFetch(urls, timeout){
  var errs = [];
  for (var i = 0; i < urls.length; i++){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, timeout || 5000);
    try {
      var res = await fetch(urls[i], { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok){ errs.push(hostLabel(urls[i]) + ' HTTP ' + res.status); continue; }
      return await res.text();
    } catch (e) {
      clearTimeout(timer);
      errs.push(hostLabel(urls[i]) + ' → ' + (e && e.message ? e.message : 'failed'));
    }
  }
  throw new Error(errs.join(' · ') || 'directory unreachable');
}
function invidiousListFromText(txt){
  var d;
  try { d = JSON.parse(txt); } catch (e) { return []; }
  var urls = [];
  if (d && d.endpoints && d.endpoints.video && Array.isArray(d.endpoints.video.working_instances)){
    urls = d.endpoints.video.working_instances.slice();
  }
  if (!urls.length && d && Array.isArray(d.instances)){
    for (var i = 0; i < d.instances.length; i++){
      var x = d.instances[i] || {};
      if (x.url) urls.push(x.url);
    }
  }
  var out = [];
  for (var j = 0; j < urls.length; j++){
    var u = String(urls[j] || '').trim();
    if (!isPlainUrl(u)) continue;
    u = u.replace(/\/+$/, '');
    if (out.indexOf(u) < 0) out.push(u);
  }
  return out;
}
async function providerList(kind, urls, fallback, parse){
  var now = Date.now();
  var cached = DIRECTORY_CACHE[kind];
  if (cached && now - cached.at < (cached.short ? DIRECTORY_TTL_FAIL : DIRECTORY_TTL)) return cached.data;
  var list = null;
  try {
    var txt = await directoryFetch(urls, 5000);
    list = parse(txt);
  } catch (e) { list = null; }
  if (list && list.length){
    DIRECTORY_CACHE[kind] = { at: now, data: list, short: false };
    return list;
  }
  var fb = fallback.slice();
  DIRECTORY_CACHE[kind] = { at: now, data: fb, short: true };
  return fb;
}
function invidiousLiveList(){ return providerList('invidious', [INVIDIOUS_DIRECTORY], INVIDIOUS_FALLBACK, invidiousListFromText); }

/* ------------------------------ state ------------------------------ */
var state = {
  view:'home', tab:'home',
  query:'', searchMode:'songs',
  results:[], albumResults:[], hidden:[], searching:false, searchError:null,
  settings:{ strictness:'balanced', instance:'' },
  queue:[], idx:-1, playing:false, progress:0, shuffle:false, repeat:false,
  net:'unknown', recent:[], activeAlbumObj:null,
  ready:false
};

var TRACK_MAP = {};
var ticker = null;
var searchSeq = 0, searchTimer = null, searchDirty = false;
var artistSongCache = {};     // artist-lower -> { songs: [...], at }
var ARTIST_CACHE_TTL = 10 * 60 * 1000;

function artStyle(t){
  var grad = 'linear-gradient(140deg,' + ((t && t.c && t.c[0]) || '#333') + ',' + ((t && t.c && t.c[1]) || '#111') + ')';
  if (t && t.thumb) return 'background-image:url(\'' + t.thumb + '\'),' + grad;
  return 'background-image:' + grad;
}

/* ------------------------------ backend (search only) ------------------------------ */
var Backend = {
  working: null,
  lastError: '',
  probeDone: false,
  _deadHosts: {},

  _listHosts: async function(){
    var custom = String(state.settings.instance || '').trim().replace(/\/+$/, '');
    if (custom && !/^https?:\/\//i.test(custom)) custom = 'https://' + custom;
    var live = [];
    try { live = await invidiousLiveList(); } catch (e) {}
    if (!live || !live.length) live = INVIDIOUS_FALLBACK.slice();
    var out = [];
    if (custom) out.push(custom);
    live.forEach(function(h){ if (out.indexOf(h) < 0 && !Backend._deadHosts[h]) out.push(h); });
    INVIDIOUS_FALLBACK.forEach(function(h){ if (out.indexOf(h) < 0 && !Backend._deadHosts[h]) out.push(h); });
    if (out.length > 8) out = out.slice(0, 8);
    return out;
  },

  _fetchRetry: async function(url, ms, tries){
    var last, i;
    tries = tries || 2;
    for (i = 0; i < tries; i++){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort('timeout'); }, ms);
      try {
        var res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        return res;
      } catch(e){
        clearTimeout(timer);
        last = e;
        if (i < tries - 1) await new Promise(function(r){ setTimeout(r, 400); });
      }
    }
    throw last;
  },

  get: async function(path, timeout, hostsOverride){
    var hosts = hostsOverride || await this._listHosts();
    if (!hosts || !hosts.length) throw new Error('no Invidious instances available');
    if (this.working && !this._deadHosts[this.working]){
      hosts = [this.working].concat(hosts.filter(function(h){ return h !== Backend.working; }));
    }
    var errs = [];
    for (var i = 0; i < hosts.length; i++){
      var host = hosts[i];
      try {
        var res = await this._fetchRetry(host + path, timeout || 9000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        this.working = host;
        this.lastError = '';
        return json;
      } catch(e){
        errs.push(host.replace(/^https?:\/\//,'') + ' → ' + (e && e.message ? e.message : 'failed'));
      }
    }
    this.working = null;
    this.lastError = errs.join(' · ');
    throw new Error(this.lastError || 'all instances failed');
  },

  _thumb: function(host, thumbs){
    var pick = null;
    if (thumbs && thumbs.length){
      var rank = { 'maxresdefault': 7, 'standard': 6, 'sddefault': 5, 'default': 4, 'medium': 3, 'small': 2, 'tiny': 1 };
      var best = -1;
      for (var i = 0; i < thumbs.length; i++){
        var t = thumbs[i] || {};
        var r = rank[t.quality] || 0;
        if (r > best){ best = r; pick = t; }
      }
      if (!pick) pick = thumbs[0];
    }
    var url = (pick && pick.url) || (thumbs && thumbs[0] && thumbs[0].url) || '';
    url = String(url).trim();
    if (!url) return '';
    return absUrl(host, url);
  },

  toTrack: function(it, host){
    if (!it || it.type !== 'video') return null;
    var vid = String(it.videoId || '').trim();
    if (!vid) return null;
    return {
      id: vid,
      title: String(it.title || '').trim(),
      artist: String(it.author || '').trim() || 'Unknown artist',
      album: '',
      dur: Number(it.lengthSeconds) || 0,
      thumb: this._thumb(host, it.videoThumbnails) || ('https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg'),
      source: 'invidious'
    };
  },

  _playlistVideo: function(host, it){
    var vid = String((it && it.videoId) || '').trim();
    if (!vid) return null;
    return {
      id: vid,
      title: String((it && it.title) || '').trim(),
      artist: String((it && it.author) || '').trim() || 'Unknown artist',
      album: '',
      dur: Number((it && it.lengthSeconds) || 0) || 0,
      thumb: this._thumb(host, (it && it.videoThumbnails) || []) || ('https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg'),
      source: 'invidious'
    };
  },

  filter: function(items){
    var strict = state.settings.strictness === 'strict';
    var hidden = [], kept = [], seen = {};
    items.forEach(function(it){
      if (!it) return;
      var title = it.title || '';
      var reason = null;
      for (var i = 0; i < VIDEO_RX.length; i++){ if (VIDEO_RX[i].test(title)){ reason = 'title matches “' + title.match(VIDEO_RX[i])[0] + '”'; break; } }
      if (!reason && strict){
        for (var j = 0; j < SOFT_VIDEO_RX.length; j++){ if (SOFT_VIDEO_RX[j].test(title)){ reason = 'Strict mode drops “' + title.match(SOFT_VIDEO_RX[j])[0] + '”'; break; } }
      }
      if (!reason && it.dur > 900) reason = 'over 15 minutes — mix, concert or DJ set';
      if (reason){ hidden.push({ title: title, artist: it.artist, reason: reason }); return; }
      var key = normTitle(title) + '|' + normTitle(it.artist);
      if (seen[key]){ hidden.push({ title: title, artist: it.artist, reason: 'duplicate release — kept the first audio version' }); return; }
      seen[key] = 1;
      kept.push(it);
    });
    return { tracks: kept, hidden: hidden };
  },

  searchSongs: async function(q){
    var d = await this.get('/api/v1/search?q=' + encodeURIComponent(q) + '&type=video&page=1');
    var host = this.working || '';
    var list = (Array.isArray(d) ? d : (d && d.content) || []).filter(function(i){ return i && i.type === 'video'; });
    var mapped = list.map(function(it){ return this.toTrack(it, host); }.bind(this)).filter(Boolean);
    var out = this.filter(mapped);
    out.tracks.forEach(function(t){ TRACK_MAP[t.id] = t; });
    return out;
  },

  searchAlbums: async function(q){
    var d = await this.get('/api/v1/search?q=' + encodeURIComponent(q) + '&type=playlist&page=1');
    var host = this.working || '';
    var items = (Array.isArray(d) ? d : (d && d.content) || []).filter(function(i){ return i && i.type === 'playlist'; }).slice(0, 6);
    var self = this;
    var albs = await Promise.all(items.map(async function(it){
      var id = String(it.playlistId || '').trim();
      if (!id) return null;
      var alb = {
        id: id,
        title: String(it.title || '').replace(/^Album\s*[–\-—]\s*/i, '').trim(),
        artist: String(it.author || '').trim(),
        thumb: self._thumb(host, it.videos && it.videos[0] && it.videos[0].videoThumbnails ? it.videos[0].videoThumbnails : null) || String(it.playlistThumbnail || '').trim(),
        items: [], c: ['#2b5876','#4e4376']
      };
      if (!/^https?:\/\//i.test(alb.thumb) && alb.thumb) alb.thumb = absUrl(host, alb.thumb);
      try {
        var p = await self.get('/api/v1/playlists/' + encodeURIComponent(id), 8000);
        if (p && p.title) alb.title = String(p.title || '').replace(/^Album\s*[–\-—]\s*/i, '').trim();
        if (p && p.author) alb.artist = String(p.author || '').trim() || alb.artist;
        var videos = (p && Array.isArray(p.videos)) ? p.videos : [];
        if (!videos.length) videos = (it.videos || []);
        if (!videos.length) throw new Error('no videos');
        alb.items = videos.map(function(v){ return self._playlistVideo(host, v); }).filter(Boolean);
        alb.items.forEach(function(t){ TRACK_MAP[t.id] = t; });
      } catch(e){
        var emb = (it.videos || []).map(function(v){ return self._playlistVideo(host, v); }).filter(Boolean);
        alb.items = emb;
        alb.items.forEach(function(t){ TRACK_MAP[t.id] = t; });
      }
      return alb;
    }));
    return { albums: albs.filter(function(a){ return a && (a.title || a.id); }), hidden: [] };
  },

  album: async function(id){
    var host = this.working || '';
    var p = await this.get('/api/v1/playlists/' + encodeURIComponent(id), 10000);
    var self = this;
    var items = ((p && Array.isArray(p.videos)) ? p.videos : []).map(function(v){ return self._playlistVideo(host, v); }).filter(Boolean);
    items.forEach(function(t){ TRACK_MAP[t.id] = t; });
    return {
      id: id,

      thumb: (p && p.playlistThumbnail) ? absUrl(host, String(p.playlistThumbnail)) : '',
      items: items
    };
  },

  probe: async function(){
    try {
      var d = await this.get('/api/v1/search?q=test&type=video&page=1', 8000);
      this.probeDone = true;
      state.net = (d && (Array.isArray(d) ? d.length : (d.content && d.content.length))) ? 'online' : 'online';

};
/* --------------------------- official player --------------------------- */
/* The ONLY playback engine. One embedded YouTube player, visible in the
   now-playing sheet. No direct-audio providers, no downloads, no offline. */
var OfficialPlayer = {
  yt: null, loading: false, apiReady: false, failed: false, active: false, videoId: null, seq: 0,

  frameEl: function(){
    var wrap = document.getElementById('npVideoWrap');
    if (!wrap) return null;
    if (wrap.querySelector('iframe')) return wrap.querySelector('iframe');
    var host = wrap.querySelector('#officialFrame');
    if (!host){
      host = document.createElement('div');
      host.id = 'officialFrame';
      wrap.appendChild(host);
    }
    return host;
  },

  loadApi: function(){
    if (this.apiReady || this.loading) return;
    this.loading = true;
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function(){ OfficialPlayer.failed = true; };
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = function(){
      OfficialPlayer.apiReady = true;
      OfficialPlayer.ensurePlayer();
    };
  },

  ensurePlayer: function(){
    if (this.yt || !window.YT || !window.YT.Player) return;
    if (!this.frameEl()) return;
    try {
      this.yt = new window.YT.Player('officialFrame', {
        height: '100%', width: '100%',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0, origin: location.origin },
        events: {
          onReady: function(){ try { OfficialPlayer.yt.setVolume(100); } catch(e){} },
          onStateChange: function(ev){
            if (ev.data === 0){
              if (state.playing) step(1);
            } else if (ev.data === 1){
              var d = OfficialPlayer.duration(), cur = currentTrack();
              if (d > 0 && cur && !cur.dur){ cur.dur = Math.round(d); paintProgress(); }
              state.playing = true; syncPlayer();
            } else if (ev.data === 2){ state.playing = false; syncPlayer(); }
            else if (ev.data === 3){
              var d2 = OfficialPlayer.duration(), cur2 = currentTrack();
              if (d2 > 0 && cur2 && !cur2.dur){ cur2.dur = Math.round(d2); paintProgress(); }
            }
          },
          onError: function(ev){
            OfficialPlayer.active = false;
            state.playing = false;
            toast('YouTube could not play this track (error ' + ev.data + ')');
            syncPlayer();
          }
        }
      });
    } catch(e){ this.failed = true; }
  },

  play: function(videoId){
    var self = this;
    var seq = ++this.seq;
    this.active = true;
    this.videoId = videoId;
    this.frameEl();
    if (!this.apiReady) this.loadApi();
    var tries = 0;
    var wait = setInterval(function(){
      tries++;
      self.frameEl();
      self.ensurePlayer();
      if (self.yt && self.yt.loadVideoById && seq === self.seq){
        clearInterval(wait);
        try { self.yt.loadVideoById(videoId); self.yt.playVideo(); } catch(e){}
      } else if (self.failed || tries > 150){
        clearInterval(wait);
        if (seq === self.seq){
          self.active = false;
          state.playing = false;
          toast('Could not connect to the YouTube player — check your connection');
          syncPlayer();
        }
      }
    }, 200);
  },

  stop: function(){
    this.active = false; this.videoId = null;
    if (this.yt && this.yt.stopVideo) try { this.yt.stopVideo(); } catch(e){}
  },
  pause: function(){ if (this.yt && this.yt.pauseVideo) try { this.yt.pauseVideo(); } catch(e){} },
  resume: function(){ if (this.yt && this.yt.playVideo) try { this.yt.playVideo(); } catch(e){} },
  seek: function(secs){ if (this.yt && this.yt.seekTo) try { this.yt.seekTo(secs, true); } catch(e){} },
  position: function(){
    if (this.yt && this.yt.getCurrentTime){
      try {
        var pos = this.yt.getCurrentTime();
        return (typeof pos === 'number' && !isNaN(pos)) ? pos : null;
      } catch(e){}
    }
    return null;
  },
  duration: function(){
    if (this.yt && this.yt.getDuration){
      try {
        var d = this.yt.getDuration();
        return (typeof d === 'number' && isFinite(d) && d > 0) ? d : 0;
      } catch(e){}
    }
    return 0;
  }
};

function trackDur(t){
  if (!t) return 0;
  if (t.dur) return t.dur;
  var d = OfficialPlayer.duration();
  if (d > 0){ t.dur = d; return d; }
  return 0;
}

/* ------------------------------ player facade ------------------------------ */
var Player = {
  seq: 0,
  stop: function(){ OfficialPlayer.stop(); this.seq++; },
  pause: function(){ OfficialPlayer.pause(); },
  resume: function(){ OfficialPlayer.resume(); },
  seek: function(pct){
    var t = currentTrack(); if (!t) return;
    var secs = (pct / 100) * trackDur(t);
    OfficialPlayer.seek(secs);
    state.progress = secs;
  },
  position: function(){ return OfficialPlayer.position(); }
};
/* ------------------------------ player state ------------------------------ */
function currentTrack(){ return state.idx >= 0 ? TRACK_MAP[state.queue[state.idx]] : null; }

function playTrack(id, queue){
  var t = TRACK_MAP[id];
  if (!t) return;
  Player.stop();
  state.queue = (queue && queue.length) ? queue.slice() : [id];
  state.idx = state.queue.indexOf(id);
  if (state.idx < 0){ state.queue.push(id); state.idx = state.queue.length - 1; }
  state.playing = true;
  state.progress = 0;
  lyricsReset(false);
  pushRecent(id);
  startTicker();
  loadAndPlay(t);
  syncPlayer();
  setSessionMeta();
}

async function loadAndPlay(t){
  var seq = ++Player.seq;
  OfficialPlayer.play(t.id);
  syncPlayer();
}

function lyricsReset(keepOpen){
  if (!keepOpen) lyricsState.open = false;
  lyricsState.synced = null; lyricsState.plain = null; lyricsState.curLine = -1;
  var wrap = $('#npLyricsWrap');
  if (wrap) wrap.hidden = !lyricsState.open;
  lyricsState.trackId = null;
}

function togglePlay(){
  var t = currentTrack();
  if (!t) return;
  state.playing = !state.playing;
  if (state.playing) Player.resume(); else Player.pause();
  startTicker();
  syncPlayer();
}

function step(dir){
  if (!state.queue.length) return;
  if (state.shuffle && dir > 0 && !state.repeat){
    var others = state.queue.filter(function(x){ return x !== currentTrack().id; });
    if (others.length){
      var pick = others[Math.floor(Math.random() * others.length)];
      state.idx = state.queue.indexOf(pick);
    }
  } else {
    var i = state.idx + dir;
    if (i >= state.queue.length) i = state.repeat ? 0 : -1;
    if (i < 0) i = state.repeat ? state.queue.length - 1 : 0;
    state.idx = i;
  }
  state.progress = 0;
  state.playing = true;
  Player.stop();
  lyricsReset(false);
  var t = currentTrack();
  if (t){
    loadAndPlay(t);
    setSessionMeta();
    pushRecent(t.id);
  }
  syncPlayer();
}

var tickerTicks = 0;
function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(function(){
    var t = currentTrack();
    if (!t || !state.playing) return;
    var pos = Player.position();
    if (pos !== null && !isNaN(pos)) state.progress = pos;
    else state.progress += 0.5;
    /* the YouTube iframe can install its own Media Session (with +-10s) —
       re-apply ours every ~2s so the song buttons stay song buttons */
    if (tickerTicks++ % 4 === 0) sessionHandlers();
    paintProgress();
  }, 500);
}

function paintProgress(){
  var t = currentTrack();
  if (!t) return;
  var dur = trackDur(t);
  var pct = dur ? Math.min(100, (state.progress / dur) * 100) : 0;
  var bar = $('#miniProg'); if (bar) bar.style.width = pct + '%';
  var seek = $('#npSeek');
  if (seek && document.activeElement !== seek) seek.value = pct;
  var cur = $('#npCur'); if (cur) cur.textContent = fmt(state.progress);
  if (lyricsState.open) lyricsTick();
  syncSessionPosition();
}

function pushRecent(id){
  state.recent = [id].concat(state.recent.filter(function(x){ return x !== id; })).slice(0, 20);
  LS.set('sonora.recent', state.recent);
}

function syncPlayer(){
  var t = currentTrack();
  var mini = $('#mini');
  if (t){
    mini.hidden = false;
    $('#miniArt').setAttribute('style', artStyle(t) + ';background-size:cover');
    $('#miniTitle').textContent = t.title;
    $('#miniArtist').textContent = t.artist;
    $('#miniToggle').innerHTML = state.playing ? ICONS.pause : ICONS.play;

    $('#npTitle').textContent = t.title;
    $('#npArtist').textContent = t.artist;
    $('#npDur').textContent = fmt(t.dur);
    $('#npToggleBtn').innerHTML = state.playing ? ICONS.pause : ICONS.play;
    $('#npQual').textContent = 'OFFICIAL PLAYER · SKIP = WHOLE SONG';
    $('#shufBtn').classList.toggle('on', state.shuffle);
    $('#repBtn').classList.toggle('on', state.repeat);
    var lyrBtn = $('#npLyricsBtn');
    if (lyrBtn){
      lyrBtn.classList.toggle('on', lyricsState.open);
      lyrBtn.style.color = lyricsState.open ? 'var(--accent)' : '';
    }
    var lyrWrap = $('#npLyricsWrap');
    if (lyrWrap) lyrWrap.hidden = !lyricsState.open;
    paintProgress();
  } else {
    mini.hidden = true;
  }
}

function sessionHandlers(){
  /* Lock screen / Control Center: whole-song skips only.
     nexttrack + previoustrack are the song buttons; the -10s/+10s seek
     handlers are unregistered so iOS can't offer step buttons instead. */
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.setActionHandler('play', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ step(1); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ step(-1); });
  } catch(e){}
  ['seekbackward', 'seekforward', 'seekto'].forEach(function(a){
    try { navigator.mediaSession.setActionHandler(a, null); } catch(e){}
  });
}

function setSessionMeta(){
  if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
  var t = currentTrack(); if (!t) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: t.album || 'Sonora'
    });
    sessionHandlers();
    navigator.mediaSession.playbackState = state.playing ? 'playing' : 'paused';
  } catch(e){}
  syncSessionPosition();
}

function syncSessionPosition(){
  if (!('mediaSession' in navigator)) return;
  var t = currentTrack();
  if (!t) return;
  var dur = t.dur || 0;
  if (!dur) return;
  try {
    navigator.mediaSession.setPositionState({
      position: Math.max(0, Math.min(state.progress || 0, dur)),
      duration: dur,
      playbackRate: 1
    });
  } catch(e){}
}

/* ------------------------------ lyrics ------------------------------ */
var lyrCache = {};
var lyrLoading = {};
var lyricsState = { open:false, trackId:null, synced:null, plain:null, curLine:-1, err:false };

function parseSynced(lyrics){
  var lines = String(lyrics || '').split(/\r?\n/);
  var out = [];
  lines.forEach(function(l){
    var m = l.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
    if (!m) return;
    var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + (m[3] ? parseInt(m[3], 10) / (m[3].length === 3 ? 1000 : 10) : 0);
    var text = m[4].replace(/<[^>]+>/g, '').trim();
    if (text) out.push({ time: t, line: text });
  });
  return out;
}

function lyricsFor(trackId){
  var t = TRACK_MAP[trackId];
  if (!t) return Promise.resolve(null);
  var hit = lyrCache[trackId];
  if (hit && Date.now() - hit.at < 60 * 60 * 1000) return Promise.resolve(hit);
  return (async function(){
    var text = null, synced = null;
    try {
      var url = 'https://lrclib.net/api/get?track_name=' + encodeURIComponent(t.title) + '&artist_name=' + encodeURIComponent(t.artist || '');
      var res = await fetch(url, { cache:'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined });
      if (res.ok){
        var d = await res.json();
        if (d && d.plainLyrics) text = d.plainLyrics;
        if (d && d.syncedLyrics) synced = parseSynced(d.syncedLyrics);
      }
    } catch (e) {}
    if (!text){
      try {
        var url2 = 'https://api.lyrics.ovh/v1/' + encodeURIComponent(t.artist || '') + '/' + encodeURIComponent(t.title);
        var res2 = await fetch(url2, { cache:'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined });
        if (res2.ok){
          var d2 = await res2.json();
          if (d2 && d2.lyrics) text = d2.lyrics;
        }
      } catch (e) {}
    }
    if (!text) return null;
    var entry = { text: text, synced: synced, at: Date.now() };
    lyrCache[trackId] = entry;
    return entry;
  })();
}

function renderLyrics(t){
  var wrap = $('#npLyricsWrap');
  var bodyEl = $('#npLyricsBody');
  if (!wrap || !bodyEl) return;
  if (lyricsState.open){ wrap.hidden = false; }
  if (!lyricsState.open){ wrap.hidden = true; return; }
  bodyEl.innerHTML = '<div class="lyrics-status">Fetching lyrics…</div>';
  lyricsFor(t.id).then(function(entry){
    if (!lyricsState.open) return;
    if (!entry){
      bodyEl.innerHTML = '<div class="lyrics-status">Lyrics unavailable for this track.</div>';
      return;
    }
    if (entry.synced && entry.synced.length){
      bodyEl.innerHTML = entry.synced.map(function(x, i){ return '<div class="lyrics-line" data-i="' + i + '">' + esc(x.line) + '</div>'; }).join('');
    } else {
      bodyEl.innerHTML = '<div class="lyrics-plain">' + esc(entry.text).replace(/\n/g, '<br>') + '</div>';
    }
    lyricsState.synced = entry.synced; lyricsState.plain = entry.text;
    lyricsTick();
  }).catch(function(){
    if (!lyricsState.open) return;
    bodyEl.innerHTML = '<div class="lyrics-status">Lyrics unavailable for this track.</div>';
  });
}

function lyricsTick(){
  var wrap = $('#npLyricsWrap');
  var bodyEl = $('#npLyricsBody');
  if (!wrap || wrap.hidden) return;
  if (!lyricsState.synced || !lyricsState.synced.length) return;
  var pos = state.progress || 0;
  var idx = -1;
  for (var i = 0; i < lyricsState.synced.length; i++){
    if (pos >= lyricsState.synced[i].time) idx = i;
  }
  if (idx === lyricsState.curLine) return;
  lyricsState.curLine = idx;
  var lines = bodyEl.querySelectorAll('.lyrics-line');
  lines.forEach(function(el){ el.classList.toggle('cur', Number(el.dataset.i) === idx); });
  var active = bodyEl.querySelector('.lyrics-line.cur');
  if (active){
    var target = active.offsetTop - (bodyEl.clientHeight / 2) + (active.clientHeight / 2);
    bodyEl.scrollTop = Math.max(0, target);
  }
}

function searchShellHTML(){

document.addEventListener('click', function(e){
  if (e.target.closest && e.target.closest('#searchResults')) searchDirty = false;
  var el = e.target.closest('[data-act]');
  if (!el){ if (e.target.id === 'scrim') closeSheets(); return; }
  var act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case 'settings': state.view = 'settings'; state.tab = 'settings'; render(); break;
    case 'back':
      if (state.view === 'album'){ state.activeAlbumObj = null; state.view = 'search'; state.tab = 'search'; }
      else { state.view = 'home'; state.tab = 'home'; }
      render(); break;
    case 'play': {
      var q = null;
      if (state.view === 'album' && state.activeAlbumObj && state.activeAlbumObj.items)
        q = state.activeAlbumObj.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
      playTrack(id, q);
      closeSheets();
      break;
    }
    case 'openalbum': {
      var found = state.albumResults.filter(function(a){ return a.id === id; })[0];
      state.activeAlbumObj = found || { id: id, title: 'Album', artist: '', items: [] };
      state.view = 'album'; render();
      if (!(state.activeAlbumObj.items || []).length && state.net !== 'down') reloadAlbum(id);
      break;
    }
    case 'album-play': {
      var alb = state.activeAlbumObj;
      if (alb && alb.items && alb.items.length){
        var ids = alb.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
        playTrack(ids[0], ids);
      } else toast('No tracks available for this album');
      break;
    }
    case 'reload-album': reloadAlbum(id); break;
    case 'retry-net': case 'retry-search': probeAndRender(); break;
    case 'hidden-info': openHiddenInfo(); break;
    case 'close-sheet': closeSheets(); break;
    case 'copy-link': {
      var lt = TRACK_MAP[id];
      var url = 'https://youtu.be/' + encodeURIComponent(lt && lt.id ? lt.id : id);
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ toast('Link copied'); }).catch(function(){ toast(url); });
      } else toast(url);
      closeSheets();
      break;
    }
    case 'mode': state.searchMode = id; state.results = []; state.albumResults = []; render(); if (state.query.trim()) runSearch(); break;
    case 'go-search': state.tab = 'search'; state.view = 'search'; render(); setTimeout(function(){ var i = $('#searchInput'); if (i) i.focus(); }, 150); break;
    case 'clear-history':
      state.recent = []; LS.set('sonora.recent', []); render(); toast('History cleared');
      break;
    case 'set': {
      var key = el.dataset.key, val = el.dataset.val;
      state.settings[key] = val;
      LS.set('sonora.settings', state.settings);
      if (key === 'strictness') toast(val === 'strict' ? 'Strict — lyric videos dropped too' : 'Balanced — lyric videos allowed');
      else toast('Saved');
      render(); if (key === 'strictness' && state.query.trim()) runSearch();
      break;
    }
    case 'toggle': togglePlay(); break;
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'shuffle': state.shuffle = !state.shuffle; syncPlayer(); toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); break;
    case 'repeat': state.repeat = !state.repeat; syncPlayer(); toast(state.repeat ? 'Repeat on' : 'Repeat off'); break;
    case 'open-np': $('#np').classList.add('open'); syncPlayer(); break;
    case 'close-np': $('#np').classList.remove('open'); break;
    case 'np-menu': { var ct = currentTrack(); if (ct) openTrackMenu(ct.id); break; }
    case 'lyrics-toggle': {
      var curTrack = currentTrack();
      if (!curTrack){ toast('Play something first'); break; }
      if (lyricsState.open){ lyricsState.open = false; lyricsReset(false); syncPlayer(); break; }
      lyricsState.open = true; lyricsState.trackId = curTrack.id;
      lyricsState.synced = null; lyricsState.plain = null; lyricsState.curLine = -1;
      renderLyrics(curTrack);
      syncPlayer();
      break;
    }
  }
});

/* ------------------------------ search + album loaders ------------------------------ */
function parseYouTubeLink(q){
  var m = String(q || '').trim();
  if (!m || m.length > 200) return '';
  var pats = [/[?&]v=([A-Za-z0-9_-]{11})/, /youtu\.be\/([A-Za-z0-9_-]{11})/,
              /\/shorts\/([A-Za-z0-9_-]{11})/, /\/embed\/([A-Za-z0-9_-]{11})/];
  for (var i = 0; i < pats.length; i++){
    var r = pats[i].exec(m);
    if (r) return r[1];
  }
  if (/^[A-Za-z0-9_-]{11}$/.test(m) && /[-_0-9]/.test(m)) return m;
  return '';
}

async function runSearch(){
  var q = state.query.trim();
  if (!q){ state.results = []; state.albumResults = []; state.searchError = null; state.searching = false; render(); return; }
  var seq = ++searchSeq;
  state.searching = true; state.searchError = null; state.hidden = [];
  render();

  var linkId = state.searchMode === 'songs' ? parseYouTubeLink(q) : '';
  if (linkId){
    var lt = { id: linkId, title: 'YouTube · ' + linkId, artist: 'Pasted link', album: '',
      dur: 0, thumb: 'https://i.ytimg.com/vi/' + linkId + '/mqdefault.jpg', source: 'link' };
    TRACK_MAP[linkId] = lt;
    state.results = [lt]; state.albumResults = []; state.hidden = [];
    state.searching = false; state.searchError = null;
    render();
    return;
  }

  try {
    if (state.searchMode === 'albums'){
      var a = await Backend.searchAlbums(q);
      if (seq !== searchSeq) return;
      state.albumResults = prioritizeItems(a.albums || [], q); state.hidden = a.hidden || [];
    } else {
      var r = await Backend.searchSongs(q);
      if (seq !== searchSeq) return;
      state.results = prioritizeItems(r.tracks || [], q); state.hidden = r.hidden;
    }
    state.net = 'online';
  } catch(err){
    if (seq !== searchSeq) return;
    state.searchError = err && err.message ? err.message : String(err);
    state.net = 'down';
  } finally {
    if (seq === searchSeq){
      state.searching = false;
      render();
      if (searchDirty){ restoreSearchFocus(); searchDirty = false; }
    }
  }
}

function restoreSearchFocus(){
  if (state.view !== 'search') return;
  var active = document.activeElement;
  if (active && active.id === 'searchInput') return;
  if (active && active.closest && active.closest('#searchResults')) return;
  if (active && active.closest && active.closest('#asheet')) return;
  if (active && active.closest && active.closest('#np')) return;
  var inp = document.getElementById('searchInput');
  if (inp && active !== inp){
    inp.focus();
    try { inp.setSelectionRange(state.query.length, state.query.length); } catch(e){}
  }
}

async function reloadAlbum(id){
  toast('Loading album…');
  try {
    var alb = await Backend.album(id);
    state.activeAlbumObj = alb;
    state.net = 'online';
    render();
    if (!alb.items || !alb.items.length) loadAlbumArtistSongs(id);
  } catch(e){
    state.net = 'down';
    toast('Album unavailable right now');
    render();
    loadAlbumArtistSongs(id);
  }
}

async function probeAndRender(){
  if (state.net !== 'online') toast('Checking instances…');
  await Backend.probe();
  render();
  if (state.net === 'online') toast('Connected to ' + hostLabel(Backend.working || ''));
  else toast('No instance reachable — try again shortly');
}

/* =====================================================================
   Language prioritization — same-language songs/albums float to the top.
   ===================================================================== */
var SCRIPTS = [
  ['devanagari', /[\u0900-\u097F]/], ['bengali-mathiluni', /[\u0980-\u09FF]/], ['gurmukhi', /[\u0A00-\u0A7F]/],
  ['gujarati', /[\u0A80-\u0AFF]/], ['oriya', /[\u0B00-\u0B7F]/], ['tamil', /[\u0B80-\u0BFF]/],
  ['kannada', /[\u0C80-\u0CFF]/], ['malayalam', /[\u0D00-\u0D7F]/], ['sinhala', /[\u0D80-\u0DFF]/],
  ['telugu', /[\u0C00-\u0C7F]/], ['arabic', /[\u0600-\u06FF]/], ['hebrew', /[\u0590-\u05FF]/],
  ['thai', /[\u0E00-\u0E7F]/], ['lao', /[\u0E80-\u0EFF]/], ['khmer', /[\u1780-\u17FF]/],
  ['georgian', /[\u10A0-\u10FF]/], ['armenian', /[\u0530-\u058F]/], ['ethiopic', /[\u1200-\u137F]/],
  ['cjk', /[\u4E00-\u9FFF\u3400-\u4DBF]/], ['hangul', /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/],
  ['cyrillic', /[\u0400-\u04FF]/], ['greek', /[\u0370-\u03FF]/]
];
function scriptOf(s){
  var t = String(s || '');
  for (var i = 0; i < SCRIPTS.length; i++){
    if (SCRIPTS[i][1].test(t)) return SCRIPTS[i][0];
  }
  return 'latin';
}
function browserScript(){
  var lang = String(navigator.language || 'en').toLowerCase().split('-')[0];
  var map = {
    ja:'cjk', zh:'cjk', ko:'hangul', ru:'cyrillic', uk:'cyrillic', be:'cyrillic',
    bg:'cyrillic', sr:'cyrillic', mk:'cyrillic', fa:'arabic', ar:'arabic', ur:'arabic', he:'hebrew',
    hi:'devanagari', mr:'devanagari', ne:'devanagari', sa:'devanagari',
    ta:'tamil', te:'telugu', kn:'kannada', ml:'malayalam', gu:'gujarati', pa:'gurmukhi', or:'oriya',
    si:'sinhala', th:'thai', km:'khmer', lo:'lao', ka:'georgian', am:'ethiopic', hy:'armenian',
    el:'greek', fi:'latin', vi:'latin'
  };
  return map[lang] || 'latin';
}
function scoreItem(t, q, script){
  var sc = 0;
  var title = String(t.title || '').toLowerCase();
  var artist = String(t.artist || '').toLowerCase();
  var qLower = String(q || '').toLowerCase().trim();
  if (!qLower) return 0;
  var nq = normTitle(q);
  if (title.indexOf(qLower) >= 0) sc += 40;
  if (nq && title.indexOf(nq) >= 0) sc += 15;
  if (artist.indexOf(qLower) >= 0) sc += 30;
  if (artist.indexOf(nq) >= 0 && nq.length > 3) sc += 10;
  var lang = script === 'latin' ? null : script;
  var itemScript = scriptOf(t.title + ' ' + t.artist);
  if (lang){
    if (itemScript === lang) sc += 50;
    else sc -= 20;
  }
  return sc;
}
function prioritizeItems(list, q){
  var qScript = scriptOf(q);
  var target = (qScript !== 'latin') ? qScript : browserScript();
  var out = list.slice();
  out.sort(function(a, b){ return scoreItem(b, q, target) - scoreItem(a, q, target); });
  return out;
}

/* ---------- album fallback: artist songs when the track list is empty ---------- */
function artistSongsFallback(album){
  if (!album || !album.artist || album.artist === 'Unknown artist') return '';
  var st = artistSongCache[album.id];
  if (!st || st === 'loading') return '';
  var songs = (st && st.songs) || [];
  if (!songs.length) return '';
  return '<div class="sec-head" style="padding:14px 16px 4px"><h3 style="font-size:15px">Songs by ' + esc(album.artist) + '</h3></div>' +
    '<div class="rows">' + songs.map(trackRow).join('') + '</div>';
}

async function loadAlbumArtistSongs(albumId){
  var a = state.activeAlbumObj;
  if (!a || a.id !== albumId) return;
  if (artistSongCache[albumId] !== undefined) return;
  artistSongCache[albumId] = 'loading';
  try {
    var res = await Backend.searchSongs(a.artist);
    var songs = (res.tracks || []).filter(function(t){
      var art = String(t.artist || '').toLowerCase();
      return art.indexOf(String(a.artist || '').toLowerCase()) >= 0 || art.indexOf(String(a.artist || '').toLowerCase().split(' ')[0]) >= 0;
    });
    if (!songs.length) songs = res.tracks || [];
    artistSongCache[albumId] = { songs: songs.slice(0, 20) };
    if (state.view === 'album' && state.activeAlbumObj && state.activeAlbumObj.id === albumId) render();
  } catch (e) {
    artistSongCache[albumId] = { songs: [] };
  }
}

/* --------------------------- fullscreen (mobile) --------------------------- */
/* There is no app install any more: no manifest, no service worker, no
   Add-to-Home-Screen card. Instead the page itself goes edge to edge on a
   phone and asks the browser for real fullscreen the first time you touch
   anything (browsers require a user gesture). Desktop keeps window chrome. */
var fsRequested = false;

function isMobileUA(){
  /* any one signal is enough: client hints, the UA string, or a touch Mac */
  try {
    if (navigator.userAgentData && navigator.userAgentData.mobile === true) return true;
  } catch(e){}
  if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent)) return true;
  try {
    if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
  } catch(e){}
  return false;
}

function isFullscreen(){
  try {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  } catch(e){ return false; }
}

function syncViewportVars(){
  /* iOS Safari's dynamic viewport: keep the shell glued to the visual viewport */
  try {
    var vv = window.visualViewport;
    if (!vv) return;
    document.documentElement.style.setProperty('--vh', (vv.height * 0.01) + 'px');
  } catch(e){}
}

function requestFullscreenOnce(){
  if (fsRequested || !isMobileUA() || isFullscreen()) return;
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (!fn) return;                      /* iOS Safari: no Element.fullscreen — CSS handles it */
  fsRequested = true;
  try {
    var r = fn.call(el, { navigationUI: 'hide' });
    if (r && r.catch) r.catch(function(){ /* user or browser declined — stay in CSS fullscreen */ });
  } catch(e){}
}

function initFullscreen(){
  if (isMobileUA()) document.body.classList.add('mobile');
  syncViewportVars();
  window.addEventListener('resize', syncViewportVars);
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', syncViewportVars);
    window.visualViewport.addEventListener('scroll', syncViewportVars);
  }
  var onFirstGesture = function(){
    requestFullscreenOnce();
    if (isFullscreen()) {
      document.removeEventListener('pointerdown', onFirstGesture, true);
      document.removeEventListener('touchend', onFirstGesture, true);
    }
  };
  document.addEventListener('pointerdown', onFirstGesture, true);
  document.addEventListener('touchend', onFirstGesture, true);
  document.addEventListener('fullscreenchange', function(){ render(); });
  document.addEventListener('webkitfullscreenchange', function(){ render(); });
}

function paintStaticIcons(){
  var set = function(sel, svg){ var el = document.querySelector(sel); if (el) el.innerHTML = svg; };
  set('#np [data-act="close-np"]', ICONS.down);
  set('#np [data-act="np-menu"]', ICONS.dots);
  set('#np [data-act="prev"]', ICONS.prev);
  set('#np [data-act="next"]', ICONS.next);
  set('#shufBtn', ICONS.shuffle);
  set('#repBtn', ICONS.repeat);
  set('#npToggleBtn', ICONS.play);
  set('#miniToggle', ICONS.play);
  set('#miniPrev', ICONS.prev);
  set('#miniNext', ICONS.next);
  set('#npLyricsBtn', ICONS.lyrics);
}

async function boot(){
  state.settings = Object.assign({}, state.settings, LS.get('sonora.settings', {}));
  delete state.settings.engine;
  delete state.settings.streamQuality;
  delete state.settings.downloadQuality;
  delete state.settings.downloadMode;
  delete state.settings.capMB;
  delete state.settings.apiKey;
  state.recent = LS.get('sonora.recent', []).filter(function(id){ return typeof id === 'string'; });

  paintStaticIcons();
  state.ready = true;
  render();
  initFullscreen();
  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
