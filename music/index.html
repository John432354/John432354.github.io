<style>

  :root{
    --bg:#000;
    --surface:#121212;
    --surface2:#1a1a1a;
    --surface3:#242424;
    --elev:#2a2a2a;
    --text:#ffffff;
    --muted:#a7a7a7;
    --muted2:#7a7a7a;
    --accent:#1db954;
    --accent-dim:#0f6b31;
    --line:rgba(255,255,255,.09);
    --radius:10px;
    --tabbar-h:60px;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#050505;color:var(--text);font-family:var(--font);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
  input{font:inherit}
  ::-webkit-scrollbar{width:0;height:0}

  /* ---------- app frame ---------- */
  #app{
    position:relative;
    width:100%;max-width:460px;
    height:100dvh;height:100svh;
    margin:0 auto;
    background:var(--surface);
    display:flex;flex-direction:column;
    overflow:hidden;
    isolation:isolate;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  @media (min-width:600px){
    body{display:flex;align-items:center;justify-content:center;padding:24px 0;background:radial-gradient(900px 600px at 50% -10%,#1d2b22 0%,#050505 60%)}
    #app{height:min(900px,calc(100dvh - 48px));border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07)}
  }
  @media (display-mode:standalone){
    @media (min-width:600px){ body{padding:0} #app{height:100dvh;border-radius:0;box-shadow:none} }
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:relative;z-index:5;flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:calc(var(--safe-t) + 12px) 16px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));
  }
  #topbar h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;display:flex;align-items:center;gap:8px}
  #demoPill{
    font-size:9.5px;font-weight:800;letter-spacing:.09em;padding:3px 6px;border-radius:5px;
    background:rgba(255,255,255,.13);color:#d8d8d8;
  }
  .iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
  .iconbtn:active{background:rgba(255,255,255,.09)}
  .iconbtn svg{width:22px;height:22px;display:block}

  /* ---------- scroll area ---------- */
  main#view{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding-bottom:20px;
  }
  .viewfade{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- home ---------- */
  .hero{padding:4px 16px 18px;background:linear-gradient(180deg,rgba(29,185,84,.16),rgba(29,185,84,0) 92%)}
  .hero h2{font-size:24px;font-weight:800;margin:0 0 14px;letter-spacing:-.025em}
  .quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .quick{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);
    border-radius:6px;overflow:hidden;height:56px;text-align:left;
  }
  .quick .art{width:56px;height:56px;border-radius:0;flex:0 0 auto}
  .quick span{font-size:13px;font-weight:700;padding-right:8px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .sec{padding-top:22px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 12px}
  .sec-head h3{font-size:18px;font-weight:800;margin:0;letter-spacing:-.015em}
  .sec-head .more{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}

  .shelf{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px}
  .card{flex:0 0 auto;width:142px;text-align:left}
  .card .art{width:142px;height:142px;border-radius:8px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.45)}
  .card .t{font-size:13.5px;font-weight:700;margin-top:9px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .s{font-size:12px;color:var(--muted);margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}

  .art{background:linear-gradient(140deg,#333,#111);background-size:cover;display:grid;place-items:center}
  .art .glyph{opacity:.5}
  .badge-audio{
    position:absolute;left:6px;bottom:6px;font-size:8.5px;font-weight:800;letter-spacing:.07em;
    background:rgba(0,0,0,.62);color:#b8ffcf;padding:3px 5px;border-radius:4px;backdrop-filter:blur(4px);
  }

  /* ---------- rows ---------- */
  .rows{padding:0 0 6px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
  .row:active{background:rgba(255,255,255,.06)}
  .row .art{width:52px;height:52px;border-radius:5px;flex:0 0 auto;position:relative;overflow:hidden}
  .row .meta{flex:1;min-width:0}
  .row .meta .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .tail{display:flex;align-items:center;gap:4px;flex:0 0 auto;color:var(--muted2)}
  .row .tail svg{width:18px;height:18px}
  .row .dur{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums}

  .chips{display:flex;gap:8px;padding:2px 16px 4px;overflow-x:auto}
  .chip{
    flex:0 0 auto;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;
    background:rgba(255,255,255,.1);color:#fff;
  }
  .chip.on{background:var(--accent);color:#04150a}

  .note{
    margin:20px 16px 8px;padding:12px 14px;border-radius:10px;
    background:rgba(29,185,84,.09);border:1px solid rgba(29,185,84,.22);
    font-size:12.5px;line-height:1.5;color:#cfeedc;
  }
  .note b{color:#fff}
  .note button{color:var(--accent);font-weight:800;text-decoration:underline;font-size:12.5px}

  /* ---------- search ---------- */
  .searchwrap{padding:0 16px 6px}
  .searchbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:0 12px;height:44px}
  .searchbox input{flex:1;border:0;outline:0;background:transparent;color:#111;font-size:15px;font-weight:600}
  .searchbox input::placeholder{color:#7a7a7a}
  .searchbox svg{width:19px;height:19px;color:#111;flex:0 0 auto}
  .genres{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
  .genre{height:86px;border-radius:9px;padding:12px;font-weight:800;font-size:15px;position:relative;overflow:hidden;text-align:left}
  .genre::after{content:"";position:absolute;right:-16px;bottom:-16px;width:56px;height:56px;border-radius:6px;background:rgba(0,0,0,.28);transform:rotate(22deg)}

  /* ---------- library ---------- */
  .libhead{padding:6px 16px 14px;display:flex;align-items:center;justify-content:space-between}
  .libhead h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-.025em}
  .addbtn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#04150a;background:var(--accent);padding:8px 13px;border-radius:999px}
  .addbtn svg{width:15px;height:15px}
  .empty{padding:44px 30px;text-align:center;color:var(--muted)}
  .empty .big{font-size:15px;font-weight:700;color:#e8e8e8;margin-bottom:6px}
  .empty p{font-size:13px;line-height:1.55;margin:0}

  /* ---------- settings ---------- */
  .setsec{margin:0 16px 22px}
  .setsec h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin:0 0 10px;font-weight:800}
  .card-box{background:var(--surface2);border-radius:12px;overflow:hidden}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 14px;border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:0}
  .setrow > div{min-width:0}
  .setrow > div:first-child{flex:1 1 auto}
  .setrow .lbl{font-size:14px;font-weight:600}
  .setrow .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .setrow.col{display:block}
  .seg{display:flex;background:#0e0e0e;border-radius:8px;padding:3px;gap:2px;flex:0 0 auto;white-space:nowrap}
  .seg button{font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:6px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#04150a}
  .setrow.col .seg{margin-top:12px;display:flex;width:100%}
  .setrow.col .seg button{flex:1 1 0;padding:8px 4px;text-align:center}
  .meter{height:7px;background:#0e0e0e;border-radius:99px;overflow:hidden;margin-top:10px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
  .danger{color:#ff6b6b;font-weight:700}

  /* ---------- bottom: mini player + tabs ---------- */
  #bottom{flex:0 0 auto;position:relative;z-index:6;background:var(--surface)}
  #mini[hidden]{display:none}
  #backBtn[hidden]{display:none}
  #backBtn{margin-left:-8px}
  #mini{
    display:flex;align-items:center;gap:11px;
    margin:0 8px 6px;padding:7px 10px;border-radius:8px;
    background:linear-gradient(90deg,#2e6f47,#1f4a31);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #mini .art{width:40px;height:40px;border-radius:4px;flex:0 0 auto;position:relative;overflow:hidden}
  #mini .meta{flex:1;min-width:0}
  #mini .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mini .s{font-size:11.5px;color:#c8e6d5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mini .prog{height:2px;background:rgba(255,255,255,.22);border-radius:2px;margin-top:6px;overflow:hidden}
  #mini .prog i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
  #mini .mbtn{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto}
  #mini .mbtn svg{width:20px;height:20px}

  #tabbar{
    height:calc(var(--tabbar-h) + var(--safe-b));
    padding-bottom:var(--safe-b);
    display:flex;align-items:center;
    background:linear-gradient(180deg,#0d0d0d,#050505);
    border-top:1px solid rgba(255,255,255,.06);
  }
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted2);font-size:9.5px;font-weight:700;letter-spacing:.03em}
  #tabbar button svg{width:23px;height:23px}
  #tabbar button.on{color:#fff}

  /* ---------- now playing sheet ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;background:var(--surface);
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;will-change:transform;
  }
  .sheet.open{transform:translateY(0)}
  .np-top{display:flex;align-items:center;padding:calc(var(--safe-t) + 10px) 14px 6px;gap:10px}
  .np-top .label{flex:1;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--muted)}
  .np-art{width:min(78vw,300px);aspect-ratio:1;border-radius:12px;margin:14px auto 0;box-shadow:0 18px 44px rgba(0,0,0,.6);position:relative;overflow:hidden}
  .np-body{padding:24px 24px 0}
  .np-title{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .np-artist{font-size:14.5px;color:var(--muted);margin-top:5px}
  .np-qual{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:10.5px;font-weight:800;
    letter-spacing:.06em;color:#9be8b9;background:rgba(29,185,84,.14);border:1px solid rgba(29,185,84,.3);
    padding:4px 8px;border-radius:5px}
  .seek{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
  .seek input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;background:#3a3a3a;outline:0}
  .seek input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
  .np-controls{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 6px}
  .np-controls button{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff}
  .np-controls button svg{width:26px;height:26px}
  .np-controls button.small{width:44px;height:44px;color:var(--muted)}
  .np-controls button.small svg{width:21px;height:21px}
  .np-controls button.small.on{color:var(--accent)}
  .np-controls .main{width:66px;height:66px;background:#fff;color:#000}
  .np-controls .main svg{width:29px;height:29px}
  .np-bottom{display:flex;align-items:center;justify-content:space-between;padding:18px 26px calc(var(--safe-b) + 18px);margin-top:auto}

  /* ---------- action sheet + scrim ---------- */
  #scrim{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  #scrim.on{opacity:1;pointer-events:auto}
  #asheet{
    position:absolute;left:0;right:0;bottom:0;z-index:16;
    background:var(--surface3);border-radius:16px 16px 0 0;
    padding-bottom:calc(var(--safe-b) + 8px);
    transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:70%;overflow-y:auto;
  }
  #asheet.open{transform:translateY(0)}
  #asheet .ahead{padding:16px 20px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  #asheet .ahead b{display:block;font-size:14px;color:#fff;margin-bottom:2px}
  .aitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 20px;font-size:15px;font-weight:600}
  .aitem:active{background:rgba(255,255,255,.07)}
  .aitem svg{width:20px;height:20px;color:var(--muted)}

  #toast{
    position:absolute;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 84px);
    transform:translate(-50%,10px);z-index:30;
    background:#f5f5f5;color:#111;font-size:12.5px;font-weight:700;
    padding:10px 15px;border-radius:8px;max-width:88%;text-align:center;line-height:1.35;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* install hint card */
  .install{
    display:flex;gap:12px;align-items:flex-start;
    margin:0 16px 8px;padding:13px 14px;border-radius:12px;
    background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.28);
  }
  .install .i{color:var(--accent);flex:0 0 auto;margin-top:1px}

  downloaded:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 14.4L7 12.5l1.5-1.5 2.5 2.4 5-5L17.5 10 11 16.4Z"/></svg>',

  install:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M12 7v6m0 0 2.5-2.5M12 13l-2.5-2.5"/><path d="M10.5 18.5h3"/></svg>',
  queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7M18 12v7"/><circle cx="16.5" cy="17.5" r="1.6" fill="currentColor" stroke="none"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/></svg>',

};

/* ------------------------------ config ------------------------------ */
var DEFAULT_INSTANCES = [
  'https://pipedapi.ducks.party',
  'https://api.piped.private.coffee',
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.reallyaweso.me',
  'https://pipedapi.adminforge.de'
];

var KBPS = { saver:48, normal:128, high:256 };
var QUAL_LABEL = { saver:'Data saver', normal:'Normal', high:'High', auto:'Auto' };

var VIDEO_RX = [
  /\bofficial\s+(music\s+)?video\b/i, /\bmusic\s+video\b/i, /\bM\/?V\b/i,
  /\bvideoclip\b/i, /video\s+oficial/i, /clip\s+officiel/i,
  /\blive\s+(at|from|in|on)\b/i, /\bperformance\b/i, /\bchoreography\b/i,
  /\bdance\s+practice\b/i, /\binterview\b/i, /\bteaser\b/i, /\btrailer\b/i,
  /\bbehind\s+the\s+scenes\b/i
];
var SOFT_VIDEO_RX = [/\blyric\s+video\b/i, /\bvisuali[sz]er\b/i, /\baudio\s+video\b/i];

/* ------------------------------ storage ------------------------------ */
var memory = new Map();
var LS = (function(){
  var ok = true;
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); } catch(e){ ok = false; }
  return {
    ok: ok,
    get: function(k, d){
      try { var v = ok ? localStorage.getItem(k) : memory.get(k); return (v === null || v === undefined) ? d : JSON.parse(v); }
      catch(e){ return d; }
    },
    set: function(k, v){
      try { if (ok) localStorage.setItem(k, JSON.stringify(v)); else memory.set(k, JSON.stringify(v)); } catch(e){}
    }
  };
})();

var db = null, idbBroken = false;
var memStores = { playlists:{}, albums:{}, liked:{}, downloads:{}, blobs:{} };

function openDB(){
  return new Promise(function(resolve){
    if (idbBroken || !('indexedDB' in window)) return resolve(null);
    var req;
    try { req = indexedDB.open('sonora', 2); } catch(e){ idbBroken = true; return resolve(null); }
    req.onupgradeneeded = function(){
      var d = req.result;
      ['playlists','albums','liked','downloads','blobs'].forEach(function(s){
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:'id'});
      });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ idbBroken = true; resolve(null); };
    req.onblocked = function(){ resolve(null); };
  });
}
function dbAll(store){
  return new Promise(function(resolve){
    if (!db) return resolve(Object.values(memStores[store] || {}));
    try {
      var r = db.transaction(store,'readonly').objectStore(store).getAll();
      r.onsuccess = function(){ resolve(r.result || []); };
      r.onerror = function(){ resolve(Object.values(memStores[store] || {})); };
    } catch(e){ resolve(Object.values(memStores[store] || {})); }
  });
}
function dbPut(store, val){
  return new Promise(function(resolve){
    if (!db){ memStores[store][val.id] = val; return resolve(true); }
    try {
      var r = db.transaction(store,'readwrite').objectStore(store).put(val);
      r.onsuccess = function(){ resolve(true); };
      r.onerror = function(){ memStores[store][val.id] = val; resolve(true); };
    } catch(e){ memStores[store][val.id] = val; resolve(true); }
  });
}
function dbGet(store, id){
  return new Promise(function(resolve){
    if (!db) return resolve(memStores[store][id] || null);
    try {
      var r = db.transaction(store,'readonly').objectStore(store).get(id);
      r.onsuccess = function(){ resolve(r.result || null); };
      r.onerror = function(){ resolve(memStores[store][id] || null); };
    } catch(e){ resolve(memStores[store][id] || null); }
  });
}
function dbDel(store, id){
  return new Promise(function(resolve){
    if (!db){ delete memStores[store][id]; return resolve(true); }
    try {
      var r = db.transaction(store,'readwrite').objectStore(store).delete(id);
      r.onsuccess = function(){ resolve(true); };
      r.onerror = function(){ delete memStores[store][id]; resolve(true); };
    } catch(e){ delete memStores[store][id]; resolve(true); }
  });
}

/* ------------------------------ state ------------------------------ */
var state = {
  view:'home', tab:'home',
  playlists:[], albums:[], liked:[], downloads:[], recent:[],
  activePlaylist:null, activeAlbum:null, activeAlbumObj:null,
  libTab:'playlists',
  query:'', searchMode:'songs',
  results:[], albumResults:[], hidden:[], searching:false, searchError:null,
  settings:{ streamQuality:'auto', downloadQuality:'high', downloadMode:'audio',
             strictness:'balanced', capMB:512, instance:'', apiKey:'' },
  queue:[], idx:-1, playing:false, progress:0, shuffle:false, repeat:false,
  net:'unknown', installDismissed:false, canInstall:false, ready:false
};

var TRACK_MAP = {};
var deferredPrompt = null;
var ticker = null;
var standalone = false;
var searchSeq = 0, searchTimer = null;

/* ------------------------------ helpers ------------------------------ */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function fmt(sec){ sec = Math.max(0, Math.floor(sec||0)); var m = Math.floor(sec/60), s = sec%60; return m + ':' + (s<10?'0':'') + s; }
function fmtMB(bytes){ var mb = (bytes||0)/1048576; return mb >= 1024 ? (mb/1024).toFixed(2)+' GB' : mb.toFixed(1)+' MB'; }
function isDownloaded(id){ return state.downloads.some(function(d){ return d.id === id; }); }
function downloadOf(id){ return state.downloads.filter(function(d){ return d.id === id; })[0] || null; }
function isLiked(id){ return state.liked.some(function(l){ return l.id === id; }); }
function downloadedBytes(){ return state.downloads.reduce(function(s,d){ return s + (d.bytes||0); }, 0); }

function artStyle(t){
  var grad = 'linear-gradient(140deg,' + ((t && t.c && t.c[0]) || '#333') + ',' + ((t && t.c && t.c[1]) || '#111') + ')';
  if (t && t.thumb) return 'background-image:url(\'' + t.thumb + '\'),' + grad;
  return 'background-image:' + grad;
}
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
function normTitle(s){
  return String(s || '').toLowerCase()
    .replace(/\((official|lyric|lyrics|audio|visualizer|hd|4k)[^)]*\)/g,' ')
    .replace(/\[[^\]]*\]/g,' ')
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}

/* ------------------------------ backend ------------------------------ */
var Backend = {
  working: null,
  lastError: '',
  probeDone: false,

  hosts: function(){
    var custom = String(state.settings.instance || '').trim().replace(/\/+$/, '');
    if (custom && !/^https?:\/\//i.test(custom)) custom = 'https://' + custom;
    var list = custom ? [custom] : [];
    DEFAULT_INSTANCES.forEach(function(h){ if (list.indexOf(h) < 0) list.push(h); });
    return list;
  },

  get: async function(path, timeout){
    var hosts = this.hosts();
    if (this.working){
      hosts = [this.working].concat(hosts.filter(function(h){ return h !== Backend.working; }));
    }
    var errs = [];
    for (var i = 0; i < hosts.length; i++){
      var host = hosts[i];
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort('timeout'); }, timeout || 9000);
      try {
        var res = await fetch(host + path, { signal: ctrl.signal, cache:'no-store' });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        this.working = host;
        this.lastError = '';
        return json;
      } catch(e){
        clearTimeout(timer);
        errs.push(host.replace(/^https?:\/\//,'') + ' → ' + (e && e.message ? e.message : 'failed'));
      }
    }
    this.working = null;
    this.lastError = errs.join(' · ');
    throw new Error(this.lastError || 'all instances failed');
  },

  videoId: function(url){
    if (!url) return null;
    var m = String(url).match(/[?&]v=([\w-]{6,})/) || String(url).match(/([\w-]{11})$/);
    return m ? m[1] : null;
  },
  listId: function(url){
    if (!url) return null;
    var m = String(url).match(/[?&]list=([\w-]+)/);
    return m ? m[1] : null;
  },

  toTrack: function(it){
    if (!it || it.type !== 'stream') return null;
    var vid = this.videoId(it.url);
    if (!vid) return null;
    return {
      id: vid,
      title: String(it.title || '').trim(),
      artist: String(it.uploaderName || '').trim() || 'Unknown artist',
      album: '',
      dur: Number(it.duration) || 0,
      thumb: it.thumbnail || ('https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg'),
      source: 'piped'
    };
  },

  /* classify + suppress music videos, dedupe */
  filter: function(items){
    var strict = state.settings.strictness === 'strict';
    var hidden = [], kept = [], seen = {};
    items.forEach(function(it){
      if (!it) return;
      var title = it.title || '';
      var reason = null;
      for (var i = 0; i < VIDEO_RX.length; i++){ if (VIDEO_RX[i].test(title)){ reason = 'title matches “' + title.match(VIDEO_RX[i])[0] + '”'; break; } }
      if (!reason && strict){
        for (var j = 0; j < SOFT_VIDEO_RX.length; j++){ if (SOFT_VIDEO_RX[j].test(title)){ reason = 'Strict mode drops “' + title.match(SOFT_VIDEO_RX[j])[0] + '”'; break; } }
      }
      if (!reason && it.dur > 900) reason = 'over 15 minutes — mix, concert or DJ set';
      if (reason){ hidden.push({ title: title, artist: it.artist, reason: reason }); return; }
      var key = normTitle(title) + '|' + normTitle(it.artist);
      if (seen[key]){ hidden.push({ title: title, artist: it.artist, reason: 'duplicate release — kept the first audio version' }); return; }
      seen[key] = 1;
      kept.push(it);
    });
    return { tracks: kept, hidden: hidden };
  },

  searchSongs: async function(q){
    var d = await this.get('/search?q=' + encodeURIComponent(q) + '&filter=music_songs');
    var mapped = (d.items || []).map(this.toTrack.bind(this)).filter(Boolean);
    var out = this.filter(mapped);
    out.tracks.forEach(function(t){ TRACK_MAP[t.id] = t; });
    return out;
  },

  searchAlbums: async function(q){
    var d = await this.get('/search?q=' + encodeURIComponent(q) + '&filter=music_albums');
    var items = (d.items || []).filter(function(i){ return i && i.type === 'playlist' && i.url; }).slice(0, 6);
    var self = this;
    var resolved = await Promise.all(items.map(async function(it){
      var id = self.listId(it.url);
      var alb = {
        id: id, title: '', artist: String(it.uploaderName || '').trim(),
        thumb: it.thumbnail || '', items: [], c: ['#2b5876','#4e4376']
      };
      try {
        var p = await self.get('/playlists/' + id, 8000);
        alb.title = String(p.name || '').replace(/^Album\s*[–\-—]\s*/i, '').trim();
        if (!alb.artist) alb.artist = String(p.uploader || '').trim();
        if (!alb.thumb) alb.thumb = p.thumbnailUrl || '';
        alb.items = (p.relatedStreams || []).map(self.toTrack.bind(self)).filter(Boolean);
        alb.items.forEach(function(t){ TRACK_MAP[t.id] = t; });
      } catch(e){}
      return alb;
    }));
    return { albums: resolved.filter(function(a){ return a.title && a.id; }), hidden: [] };
  },

  album: async function(id){
    var p = await this.get('/playlists/' + id, 10000);
    var self = this;
    var items = (p.relatedStreams || []).map(self.toTrack.bind(self)).filter(Boolean);
    items.forEach(function(t){ TRACK_MAP[t.id] = t; });
    return {
      id: id,
      title: String(p.name || 'Album').replace(/^Album\s*[–\-—]\s*/i, '').trim(),
      artist: String(p.uploader || '').trim(),
      thumb: p.thumbnailUrl || '',
      items: items
    };
  },

  bestAudio: async function(videoId, targetKbps){
    var d = await this.get('/streams/' + videoId, 12000);
    var list = (d.audioStreams || []).map(function(a){
      var br = Number(a.bitrate) || 0;
      if (br > 10000) br = Math.round(br / 1000);
      return { url: a.url, bitrate: br, mime: a.mimeType || '', codec: a.codec || '' };
    }).filter(function(a){ return a.url; });
    if (!list.length) throw new Error('no audio streams (instance blocked by YouTube)');
    list.sort(function(a,b){ return a.bitrate - b.bitrate; });
    var pick = null;
    for (var i = 0; i < list.length; i++){ if (list[i].bitrate <= targetKbps) pick = list[i]; }
    return pick || list[0];
  },

  probe: async function(){
    try {
      var d = await this.get('/search?q=test&filter=music_songs', 8000);
      this.probeDone = true;
      state.net = (d && d.items) ? 'online' : 'online';
      return true;
    } catch(e){
      this.probeDone = true;
      state.net = 'down';
      return false;
    }
  }
};

/* ------------------------------ player ------------------------------ */
var Player = {
  yt: null, apiLoading: false, apiReady: false, apiFailed: false,
  useBlob: false, audioEl: null, blobUrl: null,

  loadApi: function(){
    if (this.apiLoading || this.apiReady) return;
    this.apiLoading = true;
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function(){ Player.apiFailed = true; };
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = function(){
      Player.apiReady = true;
      Player.ensure();
    };
  },

  ensure: function(){
    if (this.yt || !window.YT || !window.YT.Player) return;
    try {
      this.yt = new window.YT.Player('ytframe', {
        height: '68', width: '120',
        playerVars: { autoplay:0, controls:0, disablekb:1, playsinline:1, rel:0, iv_load_policy:3, origin: location.origin },
        events: {
          onReady: function(){ Player.yt.setVolume(100); },
          onStateChange: function(ev){
            var s = ev.data;
            if (s === 0){ /* ended */ state.progress = 0; step(1); }
            else if (s === 1){ state.playing = true; syncPlayer(); }
            else if (s === 2){ state.playing = false; syncPlayer(); }
          },
          onError: function(ev){
            toast('YouTube player error (' + ev.data + ') — skipping');
            step(1);
          }
        }
      });
    } catch(e){ this.apiFailed = true; }
  },

  playYt: function(videoId){
    var self = this;
    if (!this.yt){
      this.loadApi();
      var tries = 0;
      var wait = setInterval(function(){
        tries++;
        self.ensure();
        if (self.yt){ clearInterval(wait); try { self.yt.loadVideoById(videoId); self.yt.playVideo(); } catch(e){} }
        else if (tries > 75 || self.apiFailed){ clearInterval(wait); toast('Could not load the YouTube player — check your connection'); }
      }, 200);
      return;
    }
    try { this.yt.loadVideoById(videoId); this.yt.playVideo(); } catch(e){}
  },

  pause: function(){ if (this.yt) try { this.yt.pauseVideo(); } catch(e){}; if (this.audioEl) this.audioEl.pause(); },
  resume: function(){ if (this.yt) try { this.yt.playVideo(); } catch(e){}; if (this.audioEl) this.audioEl.play().catch(function(){}); },

  seek: function(pct){
    var t = currentTrack(); if (!t) return;
    var secs = (pct/100) * (t.dur || 0);
    if (this.audioEl && this.useBlob){ try { this.audioEl.currentTime = secs; } catch(e){} }
    else if (this.yt && this.yt.seekTo){ try { this.yt.seekTo(secs, true); } catch(e){} }
    state.progress = secs;
  },

  position: function(){
    if (this.audioEl && this.useBlob) return this.audioEl.currentTime || 0;
    if (this.yt && this.yt.getCurrentTime){ try { return this.yt.getCurrentTime() || 0; } catch(e){} }
    return null;
  },

  playBlob: function(blob){
    if (!this.audioEl) this.audioEl = $('#blobAudio');
    if (this.blobUrl) URL.revokeObjectURL(this.blobUrl);
    this.blobUrl = URL.createObjectURL(blob);
    this.useBlob = true;
    if (this.audioEl){
      this.audioEl.src = this.blobUrl;
      this.audioEl.play().catch(function(){});
    }
    if (this.yt && this.yt.pauseVideo) try { this.yt.pauseVideo(); } catch(e){}
  }
};

/* ------------------------------ player state ------------------------------ */
function currentTrack(){ return state.idx >= 0 ? TRACK_MAP[state.queue[state.idx]] : null; }

function playTrack(id, queue){
  var t = TRACK_MAP[id];
  if (!t) return;
  state.queue = (queue && queue.length) ? queue.slice() : [id];
  state.idx = state.queue.indexOf(id);
  if (state.idx < 0){ state.queue.push(id); state.idx = state.queue.length - 1; }
  state.playing = true;
  state.progress = 0;
  bufferingSince = 0; bufferingWarned = false;
  pushRecent(id);
  Player.useBlob = false;
  startTicker();
  loadAndPlay(t);
  syncPlayer();
  setSessionMeta();
}

async function loadAndPlay(t){
  var dl = downloadOf(t.id);
  if (dl && dl.kind === 'audio'){
    var rec = await dbGet('blobs', t.id);
    if (rec && rec.data instanceof Blob){
      Player.playBlob(rec.data);
      toast('Playing downloaded copy (offline)');
      return;
    }
  }
  if (t.source === 'demo'){
    Player.pause();
    return; /* simulated */
  }
  Player.playYt(t.id);
}

function togglePlay(){
  var t = currentTrack();
  if (!t) return;
  state.playing = !state.playing;
  if (state.playing) Player.resume(); else Player.pause();
  startTicker();
  syncPlayer();
}

function step(dir){
  if (!state.queue.length) return;
  if (state.shuffle && dir > 0){
    state.idx = Math.floor(Math.random() * state.queue.length);
  } else {
    var i = state.idx + dir;
    if (i >= state.queue.length) i = state.repeat ? 0 : -1;
    if (i < 0) i = state.repeat ? state.queue.length - 1 : 0;
    state.idx = i;
  }
  state.progress = 0;
  state.playing = true;
  var t = currentTrack();
  if (t){
    Player.useBlob = false;
    loadAndPlay(t);
    setSessionMeta();
    pushRecent(t.id);
  }
  syncPlayer();
}

function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(function(){
    var t = currentTrack();
    if (!t || !state.playing) return;
    var pos = Player.position();
    if (pos !== null && !isNaN(pos)){
      state.progress = pos;
      watchdog(pos);
    } else {
      state.progress += 0.5;
      if (t.dur && state.progress >= t.dur) { step(1); return; }
    }
    paintProgress();
  }, 500);
}

var bufferingSince = 0, bufferingWarned = false;
function watchdog(pos){
  if (pos > 0.2){ bufferingSince = 0; bufferingWarned = false; return; }
  if (!state.playing) return;
  if (!bufferingSince){ bufferingSince = Date.now(); return; }
  if (!bufferingWarned && Date.now() - bufferingSince > 10000){
    bufferingWarned = true;
    toast('YouTube is not starting playback — this browser may lack its audio codecs, or a blocker is interfering');
  }
}
function paintProgress(){
  var t = currentTrack();
  if (!t) return;
  var pct = t.dur ? Math.min(100, (state.progress / t.dur) * 100) : 0;
  var bar = $('#miniProg'); if (bar) bar.style.width = pct + '%';
  var seek = $('#npSeek');
  if (seek && document.activeElement !== seek) seek.value = pct;
  var cur = $('#npCur'); if (cur) cur.textContent = fmt(state.progress);
}

function pushRecent(id){
  state.recent = [id].concat(state.recent.filter(function(x){ return x !== id; })).slice(0, 12);
  LS.set('sonora.recent', state.recent);
}

function syncPlayer(){
  var t = currentTrack();
  var mini = $('#mini');
  if (t){
    mini.hidden = false;
    $('#miniArt').setAttribute('style', artStyle(t) + ';background-size:cover');
    $('#miniTitle').textContent = t.title;
    $('#miniArtist').textContent = t.artist + (isDownloaded(t.id) ? ' · offline' : '');
    $('#miniToggle').innerHTML = state.playing ? ICONS.pause : ICONS.play;

    $('#npArt').setAttribute('style', artStyle(t));
    $('#npTitle').textContent = t.title;
    $('#npArtist').textContent = t.artist;
    $('#npDur').textContent = fmt(t.dur);
    $('#npToggleBtn').innerHTML = state.playing ? ICONS.pause : ICONS.play;
    var dl = downloadOf(t.id);
    $('#npQual').textContent = (dl && dl.kind === 'audio' ? 'OFFLINE · ' : 'AUDIO ONLY · ') +
      (QUAL_LABEL[state.settings.streamQuality] || 'Auto').toUpperCase();
    $('#npLike').innerHTML = isLiked(t.id) ? ICONS.heartF : ICONS.heart;
    $('#npLike').style.color = isLiked(t.id) ? 'var(--accent)' : '';
    $('#npDl').innerHTML = isDownloaded(t.id) ? ICONS.downloaded : ICONS.download;
    $('#npDl').style.color = isDownloaded(t.id) ? 'var(--accent)' : '';
    $('#shufBtn').classList.toggle('on', state.shuffle);
    $('#repBtn').classList.toggle('on', state.repeat);
    paintProgress();
  } else {
    mini.hidden = true;
  }
}

function setSessionMeta(){
  if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
  var t = currentTrack(); if (!t) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: 'Sonora',
      artwork: [{ src: ICON_512, sizes:'512x512', type:'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ step(1); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ step(-1); });
  } catch(e){}
}

/* ------------------------------ library ops ------------------------------ */
function newPlaylist(name){
  var pl = { id:'pl_' + Date.now(), name: name || ('My Playlist #' + (state.playlists.length + 1)), tracks:[], createdAt: Date.now() };
  state.playlists.push(pl);
  dbPut('playlists', pl);
  return pl;
}
function addToPlaylist(plId, trackId){
  var pl = state.playlists.filter(function(p){ return p.id === plId; })[0];
  if (!pl) return;
  if (pl.tracks.indexOf(trackId) >= 0){ toast('Already in “' + pl.name + '”'); return; }
  pl.tracks.push(trackId);

  render();

function toggleLike(id){
  var i = -1;
  state.liked.forEach(function(l, k){ if (l.id === id) i = k; });
  if (i >= 0){ state.liked.splice(i,1); dbDel('liked', id); toast('Removed from Liked Songs'); }
  else { state.liked.push({ id:id, at:Date.now() }); dbPut('liked', { id:id, at:Date.now() }); toast('Added to Liked Songs'); }
  render(); syncPlayer();
}
function saveAlbum(alb){
  var rec = {
    id: alb.id, title: alb.title, artist: alb.artist, thumb: alb.thumb,
    items: (alb.items || []).map(function(t){ return t.id; }),
    at: Date.now()
  };
  var existing = -1;
  state.albums.forEach(function(a, i){ if (a.id === alb.id) existing = i; });
  if (existing >= 0){ state.albums.splice(existing,1); dbDel('albums', alb.id); toast('Album removed from library'); }
  else { state.albums.push(rec); dbPut('albums', rec); toast('Album saved'); }
  render();
}

/* downloads: two tiers — real offline audio when an instance can serve it,
   otherwise a library save (metadata only, plays with network) */
async function downloadTrack(id){
  var t = TRACK_MAP[id];
  if (!t) return;
  if (isDownloaded(id)){ toast('Already saved'); return; }
  var kbps = KBPS[state.settings.downloadQuality] || 128;
  var cap = state.settings.capMB * 1048576;

  if (state.settings.downloadMode === 'audio' && t.source !== 'demo'){
    toast('Looking for an audio stream…');
    try {
      var got = await Backend.bestAudio(id, kbps);
      var res = await fetch(got.url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var blob = await res.blob();
      if (!blob || blob.size < 2048) throw new Error('empty stream');
      if (downloadedBytes() + blob.size > cap){ toast('Storage cap reached — raise it in Settings'); return; }
      var rec = {
        id: id, title: t.title, artist: t.artist, thumb: t.thumb || '',
        kbps: got.bitrate || kbps, bytes: blob.size, kind:'audio', at: Date.now()
      };
      state.downloads.push(rec);
      await dbPut('downloads', rec);
      await dbPut('blobs', { id: id, data: blob });
      toast('Downloaded · ' + rec.kbps + ' kbps · ' + fmtMB(blob.size) + ' · plays offline');
      render(); syncPlayer();
      return;
    } catch(e){
      toast('No instance can serve audio right now — saving to your library instead');
    }
  }

  var bytes = Math.round((t.dur || 0) * kbps * 1000 / 8);
  if (downloadedBytes() + bytes > cap){ toast('Storage cap reached — raise it in Settings'); return; }
  var lib = {
    id: id, title: t.title, artist: t.artist, thumb: t.thumb || '',
    kbps: kbps, bytes: bytes, kind:'library', at: Date.now()
  };
  state.downloads.push(lib);
  await dbPut('downloads', lib);
  toast('Saved to library · ' + fmtMB(bytes) + ' est. · needs network to play');
  render(); syncPlayer();
}

async function removeDownload(id){
  state.downloads = state.downloads.filter(function(d){ return d.id !== id; });
  await dbDel('downloads', id);
  await dbDel('blobs', id);
  toast('Download deleted');
  render(); syncPlayer();
}

function renderTabs(){

function trackRow(t){

  if (dl) tail += (dl.kind === 'audio' ? ICONS.downloaded : ICONS.download);
  else tail += '<span class="dur">' + (t.dur ? fmt(t.dur) : '—') + '</span>';
  tail += '<button class="iconbtn" style="width:30px;height:30px" data-act="menu" data-id="' + t.id + '" aria-label="More">' + ICONS.dots + '</button>';
  return '<div class="row" data-act="play" data-id="' + t.id + '">' +

function albumCard(a){

function viewSearch(){
  var q = state.query.trim();
  var modeChips = '<div class="chips" style="padding:10px 16px 2px">' +
    '<button class="chip' + (state.searchMode === 'songs' ? ' on' : '') + '" data-act="mode" data-id="songs">Songs</button>' +
    '<button class="chip' + (state.searchMode === 'albums' ? ' on' : '') + '" data-act="mode" data-id="albums">Albums</button>' +

    '<input id="searchInput" type="search" placeholder="Songs, artists, albums" value="' + esc(state.query) + '" autocomplete="off" spellcheck="false"></div></div>';
  html += modeChips;

  if (!q){
    html += '<div class="note" style="margin-top:16px"><b>Audio releases only.</b> Results come from YouTube Music’s song index, ' +
      'then get checked again — anything that looks like a music video is dropped before you see it.</div>';
    if (state.net === 'down'){
      html += '<div class="errbox"><b>Search is offline</b>None of the public instances answered. ' +
        '<code>' + esc(Backend.lastError || '') + '</code><button class="retry" data-act="retry-net">Try again</button></div>';
    }
    html += '</div>';
    return html;
  }

  if (state.searching){
    html += '<div class="skeleton">' + [1,2,3,4].map(function(){
      return '<div class="skrow"><div class="sk skart"></div><div class="sklines"><div class="sk skl1"></div><div class="sk skl2"></div></div></div>';
    }).join('') + '</div></div>';
    return html;
  }

  if (state.searchError){
    html += '<div class="errbox"><b>Couldn’t reach any search instance</b>' +
      'This is the usual failure mode of free public instances. Your library and downloads still work.' +
      '<code>' + esc(state.searchError) + '</code>' +
      '<button class="retry" data-act="retry-search">Retry search</button></div>';
  }

  if (state.searchMode === 'albums'){
    if (state.albumResults.length){
      html += '<div class="sec-head" style="padding:14px 16px 6px"><h3>' + state.albumResults.length + ' album' + (state.albumResults.length === 1 ? '' : 's') + '</h3></div>';
      html += '<div class="cardgrid">' + state.albumResults.map(albumCard).join('') + '</div>';
    } else if (!state.searchError){
      html += '<div class="empty"><div class="big">No albums found</div><p>Try the Songs tab — it’s the most reliable index.</p></div>';
    }
    html += '</div>';
    return html;
  }

  var results = state.results;
  if (results.length){
    html += '<div class="note" style="margin-top:12px"><b>' + results.length + ' audio release' + (results.length === 1 ? '' : 's') + '</b>' +
      (state.hidden.length ? ' · ' + state.hidden.length + ' music video' + (state.hidden.length === 1 ? '' : 's') + ' filtered out. ' +
        '<button data-act="hidden-info">see why</button>' : ' · no music videos in these results.') + '</div>';
    html += '<div class="rows">' + results.map(trackRow).join('') + '</div>';
  } else if (!state.searchError){
    html += '<div class="empty"><div class="big">No audio release found</div><p>' +
      (state.settings.strictness === 'strict'
        ? 'Strict mode drops lyric and visualizer uploads too. Switch to Balanced in Settings to widen it.'
        : 'Try a different spelling, or the artist plus song title.') + '</p></div>';
  }
  html += '</div>';
  return html;
}

function viewLibrary(){
  var tabs = [['playlists','Playlists'],['albums','Albums'],['liked','Liked'],['downloads','Downloads']];
  var html = '<div class="viewfade">';
  html += '<div class="libhead"><span></span><button class="addbtn" data-act="newplaylist">' + ICONS.plus + 'Playlist</button></div>';
  html += '<div class="chips">' + tabs.map(function(t){
    return '<button class="chip' + (state.libTab === t[0] ? ' on' : '') + '" data-act="libtab" data-id="' + t[0] + '">' + t[1] + '</button>';
  }).join('') + '</div>';

  if (state.libTab === 'playlists'){
    html += '<div class="rows">' + (state.playlists.length
      ? state.playlists.map(function(pl){
          return '<div class="row" data-act="openplaylist" data-id="' + pl.id + '">' +
            '<div class="art" style="background:linear-gradient(140deg,#1db954,#0b3d24)"></div>' +
            '<div class="meta"><div class="t">' + esc(pl.name) + '</div>' +
            '<div class="s">Playlist · ' + pl.tracks.length + ' song' + (pl.tracks.length === 1 ? '' : 's') + '</div></div>' +
            '<div class="tail"></div></div>';
        }).join('')
      : '<div class="empty"><div class="big">No playlists yet</div><p>Tap “Playlist” above, then add songs from the ••• menu.</p></div>') + '</div>';
  } else if (state.libTab === 'albums'){
    html += state.albums.length
      ? '<div class="cardgrid">' + state.albums.map(function(a){
          return '<button class="card" data-act="openalbum" data-id="' + a.id + '">' +
            '<div class="art" style="' + artStyle(a) + '"></div>' +
            '<div class="t">' + esc(a.title) + '</div><div class="s">' + esc(a.artist || 'Album') + '</div></button>';
        }).join('') + '</div>'
      : '<div class="empty"><div class="big">No saved albums</div><p>Search the Albums tab and tap Save, or save a playlist as an album.</p></div>';
  } else if (state.libTab === 'liked'){
    var liked = state.liked.map(function(l){ return TRACK_MAP[l.id]; }).filter(Boolean);
    html += '<div class="rows">' + (liked.length ? liked.map(trackRow).join('')
      : '<div class="empty"><div class="big">No liked songs</div><p>Tap the heart on any track.</p></div>') + '</div>';
  } else {
    html += '<div class="rows">' + (state.downloads.length
      ? state.downloads.map(function(d){
          var t = TRACK_MAP[d.id] || { id:d.id, title:d.title, artist:d.artist, thumb:d.thumb, dur:0 };
          return '<div class="row" data-act="play" data-id="' + t.id + '">' +
            '<div class="art" style="' + artStyle(t) + '"></div>' +
            '<div class="meta"><div class="t">' + esc(t.title) + '</div>' +
            '<div class="s">' + esc(t.artist) + ' · ' + (d.kind === 'audio' ? 'offline audio · ' + d.kbps + ' kbps' : 'library save · needs network') +
            ' · ' + fmtMB(d.bytes) + '</div></div>' +
            '<div class="tail"><button class="iconbtn" style="width:30px;height:30px" data-act="menu" data-id="' + t.id + '">' + ICONS.dots + '</button></div></div>';
        }).join('')
      : '<div class="empty"><div class="big">No downloads</div><p>Use ••• → Download on any song. Offline audio when an instance can serve it, otherwise a library save.</p></div>') + '</div>';
    if (state.downloads.length){
      var audioCount = state.downloads.filter(function(d){ return d.kind === 'audio'; }).length;
      html += '<div class="note">Using <b>' + fmtMB(downloadedBytes()) + '</b> of your <b>' + state.settings.capMB + ' MB</b> cap · ' +
        audioCount + ' offline audio file' + (audioCount === 1 ? '' : 's') + '.</div>';
    }
  }
  html += '</div>';
  return html;
}

function viewPlaylist(){
  var pl = state.activePlaylist;
  if (!pl) return viewLibrary();
  var ts = pl.tracks.map(function(id){ return TRACK_MAP[id]; }).filter(Boolean);
  var total = ts.reduce(function(s,t){ return s + (t.dur || 0); }, 0);
  var html = '<div class="viewfade">';
  html += '<div class="hero" style="background:linear-gradient(180deg,rgba(29,185,84,.22),rgba(0,0,0,0))">' +
    '<div style="display:flex;gap:16px;align-items:flex-end">' +
    '<div class="art" style="width:120px;height:120px;border-radius:10px;flex:0 0 auto;background:linear-gradient(140deg,#1db954,#0b3d24);box-shadow:0 14px 30px rgba(0,0,0,.5)"></div>' +
    '<div style="min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#cfe9d8">PLAYLIST</div>' +
    '<div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.15">' + esc(pl.name) + '</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">' + ts.length + ' songs · ' + Math.round(total/60) + ' min</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:14px;margin-top:18px">' +
    '<button data-act="playlist-play" data-id="' + pl.id + '" style="width:54px;height:54px;border-radius:50%;background:var(--accent);color:#04150a;display:grid;place-items:center">' + ICONS.play + '</button>' +
    '<button class="chip" data-act="playlist-to-album" data-id="' + pl.id + '">Save as album</button>' +

    '<button data-act="playlist-delete" data-id="' + pl.id + '" class="iconbtn">' + ICONS.trash + '</button>' +
    '</div></div>';
  html += '<div class="rows">' + (ts.length ? ts.map(trackRow).join('')
    : '<div class="empty"><div class="big">Empty playlist</div><p>Add songs from the ••• menu in search results.</p></div>') + '</div>';
  html += '</div>';
  return html;
}

  html += '<div class="hero" style="background:linear-gradient(180deg,rgba(43,88,118,.55),rgba(0,0,0,.1))">' +

    '<div class="art" style="width:120px;height:120px;border-radius:10px;flex:0 0 auto;' + artStyle(a) + ';box-shadow:0 14px 30px rgba(0,0,0,.5)"></div>' +
    '<div style="min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.85)">ALBUM · AUDIO ONLY</div>' +
    '<div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.15">' + esc(a.title || 'Album') + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:8px">' + esc(a.artist || '') + (ts.length ? ' · ' + ts.length + ' songs' : '') + '</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:14px;margin-top:18px">' +
    (ts.length ? '<button data-act="album-play" data-id="' + a.id + '" style="width:54px;height:54px;border-radius:50%;background:var(--accent);color:#04150a;display:grid;place-items:center">' + ICONS.play + '</button>' : '') +
    '<button class="chip' + (saved ? ' on' : '') + '" data-act="album-save" data-id="' + a.id + '">' + (saved ? 'Saved' : 'Save album') + '</button>' +
    '</div></div>';

  if (!ts.length){
    html += '<div class="errbox"><b>Track list unavailable</b>The public instance returned this album’s name but not its songs — ' +
      'a common limitation right now. You can still save the album for later, or open it on YouTube Music.' +
      '<a class="extlink" href="https://music.youtube.com/playlist?list=' + encodeURIComponent(a.id) + '" target="_blank" rel="noopener">Open on YouTube Music ↗</a>' +

function viewSettings(){
  var st = state.settings;
  function seg(key, opts, cur, extra){
    return '<div class="seg">' + opts.map(function(o){
      return '<button class="' + (String(cur) === String(o[0]) ? 'on' : '') + '" data-act="set" data-key="' + key +
        '" data-val="' + o[0] + '"' + (extra || '') + '>' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  var used = downloadedBytes();
  var pct = Math.min(100, (used / (st.capMB * 1048576)) * 100);
  var audioCount = state.downloads.filter(function(d){ return d.kind === 'audio'; }).length;

  var html = '<div class="viewfade">';
  html += installHintHTML();

  html += '<div class="setsec"><h3>Search backend</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Status</div>' +
    '<div class="sub">' + (state.net === 'online'
      ? 'Connected to <b style="color:#cfeedc">' + esc((Backend.working || '').replace(/^https?:\/\//,'')) + '</b>'
      : state.net === 'down' ? 'No instance reachable right now' : 'Checking…') + '</div></div>' +
    '<button class="chip" data-act="retry-net">Test</button></div>' +
    '<div class="inputrow"><label for="instInput">Custom instance (optional)</label>' +
    '<input id="instInput" type="url" inputmode="url" spellcheck="false" placeholder="https://pipedapi.example.com" value="' + esc(st.instance) + '">' +
    '<div class="hint">Sonora tries public Piped instances in order. Paste your own if you have one — no account needed.</div></div>' +
    '<div class="inputrow"><label for="keyInput">YouTube Data API key (optional fallback)</label>' +
    '<input id="keyInput" type="password" spellcheck="false" placeholder="AIza…" value="' + esc(st.apiKey) + '">' +
    '<div class="hint">Not required. Only used if every public instance is down.</div></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Download behaviour</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">What “Download” does</div>' +
    '<div class="sub">Offline audio needs an instance that YouTube still lets decrypt — today most can’t, so it falls back to a library save automatically.</div></div>' +
    seg('downloadMode', [['audio','Offline audio'],['library','Library save']], st.downloadMode) + '</div>' +
    '<div class="setrow col"><div><div class="lbl">Audio bitrate</div>' +
    '<div class="sub">Applied exactly when a real audio stream is available.</div></div>' +
    seg('downloadQuality', [['saver','48k'],['normal','128k'],['high','256k']], st.downloadQuality) + '</div>' +
    '<div class="setrow col"><div><div class="lbl">Storage cap</div>' +
    '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
    '<div class="kv"><span>' + fmtMB(used) + ' · ' + state.downloads.length + ' item(s), ' + audioCount + ' offline</span><span>cap ' + st.capMB + ' MB</span></div></div>' +
    seg('capMB', [['256','256'],['512','512'],['1024','1 GB'],['2048','2 GB']], st.capMB) + '</div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Streaming quality</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">Stream over</div>' +
    '<div class="sub">The YouTube player chooses the actual bitrate itself — this is a preference hint and a label, not a hard cap.</div></div>' +
    seg('streamQuality', [['saver','Saver'],['normal','Normal'],['high','High'],['auto','Auto']], st.streamQuality) + '</div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Music videos</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">Filter level</div>' +
    '<div class="sub">Strict also drops lyric videos and visualizers.</div></div>' +
    seg('strictness', [['balanced','Balanced'],['strict','Strict']], st.strictness) + '</div>' +
    '<div class="setrow"><div><div class="lbl">Filtered in this session</div>' +
    '<div class="sub">Every suppressed title is listed with the reason.</div></div>' +
    '<button class="chip" data-act="hidden-info">' + state.hidden.length + ' hidden</button></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>App</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Installed as app</div>' +
    '<div class="sub">' + (standalone ? 'Running standalone — no browser UI.' : 'Safari → Share → Add to Home Screen.') + '</div></div>' +
    '<span style="font-size:11px;font-weight:800;letter-spacing:.06em;color:' + (standalone ? 'var(--accent)' : 'var(--muted)') + '">' + (standalone ? 'YES' : 'NO') + '</span></div>' +
    '<div class="setrow"><div><div class="lbl">Storage</div>' +
    '<div class="sub">' + (db ? 'IndexedDB · persistent on this device' : 'In-memory fallback — this context blocks IndexedDB') + '</div></div></div>' +
    '<div class="setrow"><div><div class="lbl">Clear local data</div>' +
    '<div class="sub">Playlists, albums, likes and downloads on this device.</div></div>' +
    '<button class="chip danger" data-act="clear-data">Clear</button></div>' +
    '</div></div>';

  html += '<div class="note" style="margin-bottom:26px"><b>If you delete the Home Screen icon</b>, iOS also deletes everything Sonora stored on the device.</div>';
  html += '</div>';
  return html;
}

function renderView(){
  var html = '';
  if (state.view === 'home') html = viewHome();
  else if (state.view === 'search') html = viewSearch();
  else if (state.view === 'library') html = viewLibrary();
  else if (state.view === 'settings') html = viewSettings();
  else if (state.view === 'playlist') html = viewPlaylist();
  else if (state.view === 'album') html = viewAlbum();
  $('#view').innerHTML = html;
}

/* ------------------------------ sheets ------------------------------ */
function closeSheets(){ $('#asheet').classList.remove('open'); $('#scrim').classList.remove('on'); }
function openSheet(inner){ var s = $('#asheet'); s.innerHTML = inner; s.classList.add('open'); $('#scrim').classList.add('on'); }

function openTrackMenu(id){
  var t = TRACK_MAP[id]; if (!t) return;
  var dl = downloadOf(id);
  var inPl = !!state.activePlaylist;
  var html = '<div class="ahead"><b>' + esc(t.title) + '</b>' + esc(t.artist) + (t.source === 'demo' ? ' · demo track' : ' · audio-only release') + '</div>';
  html += '<button class="aitem" data-act="do-like" data-id="' + id + '">' + (isLiked(id) ? ICONS.heartF : ICONS.heart) + (isLiked(id) ? 'Remove from Liked Songs' : 'Add to Liked Songs') + '</button>';
  html += '<button class="aitem" data-act="do-download" data-id="' + id + '">' + ICONS.download + (dl ? 'Delete download' : 'Download') + '</button>';
  html += '<button class="aitem" data-act="play" data-id="' + id + '">' + ICONS.play + 'Play now</button>';
  if (t.source !== 'demo'){
    html += '<a class="aitem" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" ' +
      'href="https://music.youtube.com/watch?v=' + encodeURIComponent(t.id) + '">' + ICONS.share + 'Open in YouTube Music</a>';
  }
  if (inPl) html += '<button class="aitem" data-act="remove-from-playlist" data-id="' + id + '">' + ICONS.x + 'Remove from this playlist</button>';
  html += '<div class="ahead" style="border-bottom:0;border-top:1px solid var(--line);padding-top:10px">Add to playlist</div>';
  if (!state.playlists.length){
    html += '<button class="aitem" data-act="newplaylist-for" data-id="' + id + '">' + ICONS.plus + 'Create a playlist</button>';
  } else {
    state.playlists.forEach(function(pl){
      html += '<button class="aitem" data-act="add-to" data-id="' + id + '" data-pl="' + pl.id + '">' + ICONS.plus + esc(pl.name) + '</button>';
    });
    html += '<button class="aitem" data-act="newplaylist-for" data-id="' + id + '">' + ICONS.plus + 'New playlist…</button>';
  }
  openSheet(html);
}

function openHiddenInfo(){
  if (!state.hidden.length){
    openSheet('<div class="ahead"><b>Nothing filtered yet</b>Search for something and Sonora will list every music video it dropped.</div>' +
      '<button class="aitem" data-act="close-sheet" style="justify-content:center;color:var(--accent)">Close</button>');
    return;
  }
  var html = '<div class="ahead"><b>' + state.hidden.length + ' music videos suppressed</b>Each one was dropped instead of being substituted in.</div>';
  state.hidden.forEach(function(v){
    html += '<div class="aitem" style="display:block"><div style="font-size:13.5px;font-weight:700;line-height:1.35">' + esc(v.title) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px">' + esc(v.artist || '') + ' — ' + esc(v.reason) + '</div></div>';
  });
  html += '<button class="aitem" data-act="close-sheet" style="justify-content:center;color:var(--accent)">Close</button>';

/* ------------------------------ events ------------------------------ */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el){ if (e.target.id === 'scrim') closeSheets(); return; }
  var act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case 'settings': state.view = 'settings'; render(); break;
    case 'back':
      if (state.view === 'playlist' || state.view === 'album'){
        state.activePlaylist = null; state.activeAlbumObj = null;
        state.view = 'library'; state.tab = 'library';
      } else { state.view = 'home'; state.tab = 'home'; }
      render(); break;
    case 'play': {
      var q = null;
      if (state.activePlaylist) q = state.activePlaylist.tracks.slice();
      else if (state.view === 'album' && state.activeAlbumObj && state.activeAlbumObj.items)
        q = state.activeAlbumObj.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
      playTrack(id, q);
      break;
    }
    case 'openplaylist':
      state.activePlaylist = state.playlists.filter(function(p){ return p.id === id; })[0] || null;
      state.view = 'playlist'; render(); break;
    case 'openalbum': {
      var sAlb = state.albums.filter(function(a){ return a.id === id; })[0];
      var found = state.albumResults.filter(function(a){ return a.id === id; })[0];
      state.activeAlbumObj = found || (sAlb ? { id: sAlb.id, title: sAlb.title, artist: sAlb.artist, thumb: sAlb.thumb, items: sAlb.items || [] } : { id: id, title: 'Album', artist: '', items: [] });
      state.view = 'album'; render();
      if (!(state.activeAlbumObj.items || []).length && state.net !== 'down') reloadAlbum(id);
      break;
    }
    case 'reload-album': reloadAlbum(id); break;
    case 'album-save': {
      var a = state.activeAlbumObj || { id: id, title:'Album', artist:'', items:[] };
      saveAlbum(a); break;
    }
    case 'album-play': {
      var alb = state.activeAlbumObj;
      if (alb && alb.items && alb.items.length){
        var ids = alb.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
        playTrack(ids[0], ids);
      } else toast('No tracks available for this album');
      break;
    }
    case 'playlist-play': {
      var pl = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (pl && pl.tracks.length) playTrack(pl.tracks[0], pl.tracks.slice());
      else toast('This playlist is empty');
      break;
    }
    case 'playlist-to-album': {
      var p2 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (!p2) break;
      saveAlbum({ id: 'album_' + p2.id, title: p2.name, artist: 'From your playlist', thumb: '', items: p2.tracks.slice(), c: ['#1db954','#0b3d24'] });
      break;
    }
    case 'playlist-rename': {
      var p3 = state.playlists.filter(function(p){ return p.id === id; })[0];
      var nm = prompt('Rename playlist', p3 ? p3.name : '');
      if (nm && p3){ p3.name = nm.trim() || p3.name; dbPut('playlists', p3); render(); }
      break;
    }
    case 'playlist-delete': {
      var p4 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (p4 && confirm('Delete playlist “' + p4.name + '”?')){
        state.playlists = state.playlists.filter(function(p){ return p.id !== id; });
        dbDel('playlists', id);
        state.activePlaylist = null; state.view = 'library';
        render(); toast('Playlist deleted');
      }
      break;
    }
    case 'newplaylist': {
      var name = prompt('New playlist name', 'My Playlist #' + (state.playlists.length + 1));
      if (name !== null){
        var np = newPlaylist(name.trim() || undefined);
        state.libTab = 'playlists'; state.view = 'library'; state.tab = 'library';
        render(); toast('Created “' + np.name + '”');
      }
      break;
    }
    case 'newplaylist-for': {
      var nm2 = prompt('New playlist name', 'My Playlist #' + (state.playlists.length + 1));
      if (nm2 !== null){ var np2 = newPlaylist(nm2.trim() || undefined); addToPlaylist(np2.id, id); closeSheets(); render(); }
      break;
    }
    case 'add-to': addToPlaylist(el.dataset.pl, id); closeSheets(); break;
    case 'remove-from-playlist':
      if (state.activePlaylist){
        state.activePlaylist.tracks = state.activePlaylist.tracks.filter(function(x){ return x !== id; });
        dbPut('playlists', state.activePlaylist);
        closeSheets(); render(); toast('Removed from playlist');
      }
      break;
    case 'menu': openTrackMenu(id); break;
    case 'do-like': toggleLike(id); closeSheets(); break;
    case 'do-download': if (isDownloaded(id)) removeDownload(id); else downloadTrack(id); closeSheets(); break;
    case 'like-current': { var ct = currentTrack(); if (ct) toggleLike(ct.id); break; }
    case 'download-current': { var ct2 = currentTrack(); if (ct2){ if (isDownloaded(ct2.id)) removeDownload(ct2.id); else downloadTrack(ct2.id); } break; }
    case 'toggle': togglePlay(); break;
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'shuffle': state.shuffle = !state.shuffle; syncPlayer(); toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); break;
    case 'repeat': state.repeat = !state.repeat; syncPlayer(); toast(state.repeat ? 'Repeat on' : 'Repeat off'); break;
    case 'open-np': $('#np').classList.add('open'); syncPlayer(); break;
    case 'close-np': $('#np').classList.remove('open'); break;
    case 'np-menu': { var ct3 = currentTrack(); if (ct3) openTrackMenu(ct3.id); break; }
    case 'hidden-info': openHiddenInfo(); break;
    case 'close-sheet': closeSheets(); break;
    case 'libtab': state.libTab = id; render(); break;
    case 'mode': state.searchMode = id; state.results = []; state.albumResults = []; render(); if (state.query.trim()) runSearch(); break;
    case 'go-search': state.tab = 'search'; state.view = 'search'; render(); setTimeout(function(){ var i = $('#searchInput'); if (i) i.focus(); }, 150); break;
    case 'open-liked': state.libTab = 'liked'; state.view = 'library'; state.tab = 'library'; render(); break;
    case 'retry-net': case 'retry-search': probeAndRender(); break;
    case 'set': {
      var key = el.dataset.key, val = el.dataset.val;
      state.settings[key] = (key === 'capMB') ? parseInt(val, 10) : val;
      LS.set('sonora.settings', state.settings);
      if (key === 'strictness') toast(val === 'strict' ? 'Strict — lyric videos dropped too' : 'Balanced — lyric videos allowed');
      else if (key === 'downloadMode') toast(val === 'audio' ? 'Downloads try real offline audio first' : 'Downloads save to library only');
      else if (key === 'downloadQuality') toast('Audio bitrate: ' + KBPS[val] + ' kbps');
      else if (key === 'capMB') toast('Storage cap: ' + val + ' MB');
      else toast('Streaming preference: ' + (QUAL_LABEL[val] || val));
      render(); if (key === 'strictness' && state.query.trim()) runSearch();
      break;
    }
    case 'clear-data':
      if (confirm('Delete all Sonora data on this device?')){
        state.playlists.forEach(function(p){ dbDel('playlists', p.id); });
        state.albums.forEach(function(a){ dbDel('albums', a.id); });
        state.liked.forEach(function(l){ dbDel('liked', l.id); });
        state.downloads.forEach(function(d){ dbDel('downloads', d.id); dbDel('blobs', d.id); });
        state.playlists = []; state.albums = []; state.liked = []; state.downloads = []; state.recent = [];
        LS.set('sonora.recent', []);
        render(); toast('Local data cleared');
      }
      break;
    case 'dismiss-install': state.installDismissed = true; LS.set('sonora.installDismissed', true); render(); break;
    case 'install-app': if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; state.canInstall = false; } break;
  }
});

document.addEventListener('input', function(e){
  if (e.target.id === 'searchInput'){
    state.query = e.target.value;
    renderView();
    var inp = document.getElementById('searchInput');
    if (inp){ inp.focus(); inp.setSelectionRange(state.query.length, state.query.length); }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 480);
  }
});

document.addEventListener('change', function(e){
  if (e.target.id === 'instInput'){
    state.settings.instance = e.target.value.trim();
    LS.set('sonora.settings', state.settings);
    Backend.working = null;
    toast('Instance saved');
    probeAndRender();
  }
  if (e.target.id === 'keyInput'){
    state.settings.apiKey = e.target.value.trim();
    LS.set('sonora.settings', state.settings);
    toast('API key saved');
  }
  if (e.target.id === 'npSeek'){ Player.seek(parseFloat(e.target.value)); paintProgress(); }
});

$('#mini').addEventListener('click', function(e){
  if (e.target.closest('#miniToggle')) return;
  $('#np').classList.add('open'); syncPlayer();
});
$('#miniToggle').addEventListener('click', function(e){ e.stopPropagation(); togglePlay(); });

Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function(btn){
  btn.addEventListener('click', function(){
    state.tab = btn.dataset.tab;
    state.view = btn.dataset.tab;
    state.activePlaylist = null; state.activeAlbumObj = null;
    render();
    $('#view').scrollTop = 0;
  });
});

/* ------------------------------ search + album loaders ------------------------------ */
async function runSearch(){
  var q = state.query.trim();
  if (!q){ state.results = []; state.albumResults = []; state.searchError = null; state.searching = false; render(); return; }
  var seq = ++searchSeq;
  state.searching = true; state.searchError = null; state.hidden = [];
  render();
  try {
    if (state.searchMode === 'albums'){
      var a = await Backend.searchAlbums(q);
      if (seq !== searchSeq) return;
      state.albumResults = a.albums; state.hidden = a.hidden || [];
    } else {
      var r = await Backend.searchSongs(q);
      if (seq !== searchSeq) return;
      state.results = r.tracks; state.hidden = r.hidden;
    }
    state.net = 'online';
  } catch(err){
    if (seq !== searchSeq) return;
    state.searchError = err && err.message ? err.message : String(err);
    state.net = 'down';
    if (state.searchMode === 'songs'){
      var demo = demoSearch(q);
      if (demo.length){ state.results = demo; state.searchError += ' — showing offline demo results'; }
    }
  } finally {
    if (seq === searchSeq){ state.searching = false; render(); restoreSearchFocus(); }
  }
}
function restoreSearchFocus(){
  var inp = document.getElementById('searchInput');
  if (inp && document.activeElement !== inp && state.view === 'search'){
    inp.focus();
    try { inp.setSelectionRange(state.query.length, state.query.length); } catch(e){}
  }
}
async function reloadAlbum(id){
  toast('Loading album…');
  try {
    var alb = await Backend.album(id);
    state.activeAlbumObj = alb;
    state.net = 'online';
    render();
  } catch(e){
    state.net = 'down';
    toast('Album unavailable right now');
    render();
  }
}
async function probeAndRender(){
  if (state.net !== 'online') toast('Checking instances…');
  await Backend.probe();
  render();
  if (state.net === 'online') toast('Connected to ' + (Backend.working || '').replace(/^https?:\/\//,''));
  else toast('No instance reachable — try again shortly');
}

function isStandaloneMode(){
  try {
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.matchMedia('(display-mode: fullscreen)').matches ||
           navigator.standalone === true;
  } catch(e){ return false; }
}

function manifestObject(){
  return {
    id: location.pathname || '/',
    name: 'Sonora — audio-only music',
    short_name: 'Sonora',
    description: 'A YouTube Music client that plays the audio release and never the music video.',
    start_url: location.pathname + location.search,
    scope: location.pathname.replace(/[^/]*$/, ''),
    display: 'standalone',
    display_override: ['standalone', 'minimal-ui'],
    orientation: 'portrait',
    background_color: '#121212',
    theme_color: '#121212',
    lang: 'en',
    categories: ['music', 'entertainment'],
    icons: [
      { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: ICON_MASK, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
}

async function initPWA(){
  standalone = isStandaloneMode();
  if (standalone) document.body.classList.add('standalone');
  try {
    window.matchMedia('(display-mode: standalone)').addEventListener('change', function(ev){
      standalone = ev.matches;
      document.body.classList.toggle('standalone', standalone);
      render();
    });
  } catch(e){}

  /* The <link> already points at manifest.webmanifest. If that file isn't there
     (opened as a lone file, or hosted without it), build one at runtime instead. */
  var link = document.getElementById('manifest-link');
  var haveExternal = false;
  if (location.protocol === 'http:' || location.protocol === 'https:'){
    try {
      var ctrl = new AbortController();
      var tmo = setTimeout(function(){ ctrl.abort(); }, 4000);
      var mr = await fetch('manifest.webmanifest', { cache:'no-store', signal: ctrl.signal });
      clearTimeout(tmo);
      haveExternal = mr.ok;
    } catch(e){ haveExternal = false; }
  }
  if (!haveExternal){
    try {
      var blob = new Blob([JSON.stringify(manifestObject())], { type:'application/manifest+json' });
      link.href = URL.createObjectURL(blob);
    } catch(e){}
  }

  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')){
    try { await navigator.serviceWorker.register('sw.js', { scope:'./' }); } catch(e){}
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e; state.canInstall = true; render();
  });
  window.addEventListener('appinstalled', function(){ state.canInstall = false; toast('Installed — open Sonora from your home screen'); render(); });
}

/* ------------------------------ boot ------------------------------ */
function paintStaticIcons(){
  var set = function(sel, svg){ var el = document.querySelector(sel); if (el) el.innerHTML = svg; };
  set('#np [data-act="close-np"]', ICONS.down);
  set('#np [data-act="np-menu"]', ICONS.dots);
  set('#np [data-act="prev"]', ICONS.prev);
  set('#np [data-act="next"]', ICONS.next);
  set('#shufBtn', ICONS.shuffle);
  set('#repBtn', ICONS.repeat);
  set('#npToggleBtn', ICONS.play);
  set('#npLike', ICONS.heart);
  set('#npDl', ICONS.download);
  set('#miniToggle', ICONS.play);
}

async function boot(){
  state.settings = Object.assign({}, state.settings, LS.get('sonora.settings', {}));
  state.recent = LS.get('sonora.recent', []);
  state.installDismissed = LS.get('sonora.installDismissed', false);

  db = await openDB();
  state.playlists = (await dbAll('playlists')).sort(function(a,b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  state.albums = await dbAll('albums');
  state.liked = await dbAll('liked');
  state.downloads = await dbAll('downloads');

  /* re-register tracks referenced by saved library so they resolve offline */
  state.downloads.forEach(function(d){
    if (!TRACK_MAP[d.id]) TRACK_MAP[d.id] = { id:d.id, title:d.title, artist:d.artist, thumb:d.thumb, dur:0, source:'saved' };
  });

  paintStaticIcons();
  state.ready = true;
  render();
  await initPWA();
  render();
  Backend.probe().then(function(){ render(); });

  if (navigator.onLine === false) state.net = 'down';
  window.addEventListener('online', function(){ Backend.working = null; probeAndRender(); });
  window.addEventListener('offline', function(){ state.net = 'down'; render(); });

  if (!standalone) Player.loadApi(); /* warm up the player so the first tap is instant */
}

boot();
</script>
