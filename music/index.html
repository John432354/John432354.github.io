function viewHome(){
  var hour = new Date().getHours();
  var greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  var recents = state.recent.map(function(id){ return TRACK_MAP[id]; }).filter(Boolean).slice(0, 6);
  var savedAlbums = state.albums.slice(0, 8);

  var html = '<div class="viewfade">';
  html += '<div class="hero"><h2>' + greet + '</h2>';
  html += '<div class="quickgrid">';
  state.playlists.slice(0, 4).forEach(function(pl){
    html += '<button class="quick" data-act="openplaylist" data-id="' + pl.id + '">' +
      '<div class="art" style="' + plArt(pl) + '"></div><span>' + esc(pl.name) + '</span></button>';
  });
  html += '<button class="quick" data-act="open-liked"><div class="art" style="background:linear-gradient(140deg,#e0a63f,#6e3c14)"></div><span>Liked Songs</span></button>';
  html += '<button class="quick" data-act="go-search"><div class="art" style="background:linear-gradient(140deg,#4e4376,#2b5876)"></div><span>Find music</span></button>';
  html += '</div></div>';

  html += installHintHTML();

  if (savedAlbums.length){
    html += '<section class="sec"><div class="sec-head"><h3>Your albums</h3><span class="more">SAVED</span></div>' +
      '<div class="shelf">' + savedAlbums.map(albumCard).join('') + '</div></section>';
  }

  html += '<section class="sec"><div class="sec-head"><h3>Recently played</h3></div><div class="rows">' +
    (recents.length ? recents.map(trackRow).join('')
      : '<div class="empty"><div class="big">Nothing yet</div><p>Search for a song — song, artist or album.</p></div>') +
    '</div></section>';

  if (state.searchError || state.net === 'down'){
    html += '<div class="errbox"><b>Search servers unreachable</b>' +
      'The public instances Sonora uses are down or rate-limited. <code>' + esc(Backend.lastError || '') + '</code>' +
      '<button class="retry" data-act="retry-net">Retry now</button></div>';
  }

  html += '</div>';
  return html;
}

function searchShellHTML(){
  var chips = '<div class="chips" style="padding:10px 16px 2px">' +
    '<button class="chip' + (state.searchMode === 'songs' ? ' on' : '') + '" data-act="mode" data-id="songs">Songs</button>' +
    '<button class="chip' + (state.searchMode === 'albums' ? ' on' : '') + '" data-act="mode" data-id="albums">Albums</button>' +
    '</div>';
  return '<div class="viewfade" id="searchView">' +
    '<div class="searchwrap"><div class="searchbox">' + ICONS.search +
    '<input id="searchInput" type="search" placeholder="Songs, artists, albums" value="' + esc(state.query) + '" autocomplete="off" spellcheck="false" enterkeyhint="search"></div></div>' +
    chips +
    '<div id="searchResults">' + searchResultsHTML() + '</div></div>';
}

function searchResultsHTML(){
  var q = state.query.trim();
  var html = '';
  if (!q){
    html += '<div class="note" style="margin-top:16px"><b>Clean audio results.</b> Songs and albums from YouTube Music, checked for music videos before they show up.</div>';
    if (state.net === 'down'){
      html += '<div class="errbox"><b>Search is offline</b>None of the public instances answered. ' +
        '<code>' + esc(Backend.lastError || '') + '</code><button class="retry" data-act="retry-net">Try again</button></div>';
    }
    return html;
  }

  if (state.searching){
    html += '<div class="skeleton">' + [1,2,3,4].map(function(){
      return '<div class="skrow"><div class="sk skart"></div><div class="sklines"><div class="sk skl1"></div><div class="sk skl2"></div></div></div>';
    }).join('') + '</div>';
    return html;
  }

  if (state.searchError){
    html += '<div class="errbox"><b>Couldn’t reach any search instance</b>' +
      'This is the usual failure mode of free public instances. Your library and downloads still work.' +
      '<code>' + esc(state.searchError) + '</code>' +
      '<button class="retry" data-act="retry-search">Retry search</button></div>';
  }

  if (state.searchMode === 'albums'){
    if (state.albumResults.length){
      html += '<div class="sec-head" style="padding:14px 16px 6px"><h3>' + state.albumResults.length + ' album' + (state.albumResults.length === 1 ? '' : 's') + '</h3></div>';
      html += '<div class="cardgrid">' + state.albumResults.map(albumCard).join('') + '</div>';
    } else if (!state.searchError){
      html += '<div class="empty"><div class="big">No albums found</div><p>Try the Songs tab — it’s the most reliable index.</p></div>';
    }
    return html;
  }

  var results = state.results;
  if (results.length){
    html += '<div class="note" style="margin-top:12px"><b>' + results.length + ' release' + (results.length === 1 ? '' : 's') + '</b>' +
      (state.hidden.length ? ' · ' + state.hidden.length + ' music video' + (state.hidden.length === 1 ? '' : 's') + ' filtered out. ' +
        '<button data-act="hidden-info">see why</button>' : ' · no music videos in these results.') + '</div>';
    html += '<div class="rows">' + results.map(trackRow).join('') + '</div>';
  } else if (!state.searchError){
    html += '<div class="empty"><div class="big">No releases found</div><p>' +
      (state.settings.strictness === 'strict'
        ? 'Strict mode drops lyric and visualizer uploads too. Switch to Balanced in Settings to widen it.'
        : 'Try a different spelling, or the artist plus song title.') + '</p></div>';
  }
  return html;
}

function renderSearch(){
  var view = $('#view');
  var shell = view.querySelector('#searchView');
  var modeChanged = view.dataset.searchMode !== state.searchMode;
  if (!shell || modeChanged || view.dataset.view !== 'search'){
    view.innerHTML = searchShellHTML();
    view.dataset.view = 'search';
    view.dataset.searchMode = state.searchMode;
    restoreSearchFocus();
  } else {
    var res = view.querySelector('#searchResults');
    if (res) res.innerHTML = searchResultsHTML();
  }
}

function renderSearchResultsOnly(){
  var view = $('#view');
  var res = view.querySelector('#searchResults');
  if (res) res.innerHTML = searchResultsHTML();
}

function viewLibrary(){
  var tabs = [['playlists','Playlists'],['albums','Albums'],['liked','Liked'],['downloads','Downloads']];
  var html = '<div class="viewfade">';
  html += '<div class="libhead"><span class="lib-title" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted2)">LIBRARY</span>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="addbtn" data-act="export-playlists">' + ICONS.export + 'Export</button>' +
    '<button class="addbtn" data-act="import-playlists">' + ICONS.cloudDown + 'Import</button>' +
    '<button class="addbtn" data-act="newplaylist">' + ICONS.plus + 'Playlist</button></div></div>';
  html += '<div class="chips">' + tabs.map(function(t){
    return '<button class="chip' + (state.libTab === t[0] ? ' on' : '') + '" data-act="libtab" data-id="' + t[0] + '">' + t[1] + '</button>';
  }).join('') + '</div>';

  if (state.libTab === 'playlists'){
    html += '<div class="rows">' + (state.playlists.length
      ? state.playlists.map(function(pl){
          return '<div class="row" data-act="openplaylist" data-id="' + pl.id + '">' +
            '<div class="art" style="' + plArt(pl) + '"></div>' +
            '<div class="meta"><div class="t">' + esc(pl.name) + '</div>' +
            '<div class="s">Playlist · ' + pl.tracks.length + ' song' + (pl.tracks.length === 1 ? '' : 's') + '</div></div>' +
            '<div class="tail"></div></div>';
        }).join('')
      : '<div class="empty"><div class="big">No playlists yet</div><p>Tap “Playlist” above, then add songs from the ••• menu.</p></div>') + '</div>';
  } else if (state.libTab === 'albums'){
    html += state.albums.length
      ? '<div class="cardgrid">' + state.albums.map(function(a){
          return '<button class="card" data-act="openalbum" data-id="' + a.id + '">' +
            '<div class="art" style="' + artStyle(a) + '"></div>' +
            '<div class="t">' + esc(a.title) + '</div><div class="s">' + esc(a.artist || 'Album') + '</div></button>';
        }).join('') + '</div>'
      : '<div class="empty"><div class="big">No saved albums</div><p>Search the Albums tab and tap Save, or save a playlist as an album.</p></div>';
  } else if (state.libTab === 'liked'){
    var liked = state.liked.map(function(l){ return TRACK_MAP[l.id]; }).filter(Boolean);
    html += '<div class="rows">' + (liked.length ? liked.map(trackRow).join('')
      : '<div class="empty"><div class="big">No liked songs</div><p>Tap the heart on any track.</p></div>') + '</div>';
  } else {
    html += '<div class="rows">' + (state.downloads.length
      ? state.downloads.map(function(d){
          var t = TRACK_MAP[d.id] || { id:d.id, title:d.title, artist:d.artist, thumb:d.thumb, dur:0 };
          return '<div class="row" data-act="play" data-id="' + t.id + '">' +
            '<div class="art" style="' + artStyle(t) + '"></div>' +
            '<div class="meta"><div class="t">' + esc(t.title) + '</div>' +
            '<div class="s">' + esc(t.artist) + ' · ' + (d.kind === 'audio' ? 'offline audio · ' + d.kbps + ' kbps' : 'library save · needs network') +
            ' · ' + fmtMB(d.bytes) + '</div></div>' +
            '<div class="tail"><button class="iconbtn" style="width:30px;height:30px" data-act="menu" data-id="' + t.id + '">' + ICONS.dots + '</button></div></div>';
        }).join('')
      : '<div class="empty"><div class="big">No downloads</div><p>Use ••• → Download on any song. Offline audio when an instance can serve it, otherwise a library save.</p></div>') + '</div>';
    if (state.downloads.length){
      var audioCount = state.downloads.filter(function(d){ return d.kind === 'audio'; }).length;
      html += '<div class="note">Using <b>' + fmtMB(downloadedBytes()) + '</b> of your <b>' + state.settings.capMB + ' MB</b> cap · ' +
        audioCount + ' offline audio file' + (audioCount === 1 ? '' : 's') + '.</div>';
    }
  }
  html += '</div>';
  return html;
}

function viewPlaylist(){
  var pl = state.activePlaylist;
  if (!pl) return viewLibrary();
  var ts = pl.tracks.map(function(id){ return TRACK_MAP[id]; }).filter(Boolean);
  var total = ts.reduce(function(s,t){ return s + (t.dur || 0); }, 0);
  var html = '<div class="viewfade">';
  html += '<div class="hero" style="background:linear-gradient(180deg,rgba(224,166,63,.18),rgba(0,0,0,0))">' +
    '<div style="display:flex;gap:16px;align-items:flex-end">' +
    '<div class="art" style="width:120px;height:120px;flex:0 0 auto;box-shadow:0 14px 30px rgba(0,0,0,.5);' + plArt(pl) + '"></div>' +
    '<div style="min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#f0d091">PLAYLIST</div>' +
    '<div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.15">' + esc(pl.name) + '</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">' + ts.length + ' songs · ' + Math.round(total/60) + ' min</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap">' +
    '<button data-act="playlist-play" data-id="' + pl.id + '" style="width:52px;height:52px;background:linear-gradient(180deg,#f0bc58,#c98a2c);color:#241503;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,240,200,.55),0 3px 0 rgba(0,0,0,.4);border:1px solid #7a4e16">' + ICONS.play + '</button>' +
    '<button class="chip" data-act="playlist-to-album" data-id="' + pl.id + '">Save as album</button>' +
    '<button data-act="playlist-rename" data-id="' + pl.id + '" class="iconbtn" aria-label="Rename">' + ICONS.edit + '</button>' +
    '<button data-act="playlist-image" data-id="' + pl.id + '" class="iconbtn" aria-label="Change image">' + (pl.image ? ICONS.photo : ICONS.photoPlus) + '</button>' +
    (pl.image ? '<button data-act="playlist-image-clear" data-id="' + pl.id + '" class="iconbtn" aria-label="Clear image">' + ICONS.x + '</button>' : '') +
    '<button data-act="playlist-delete" data-id="' + pl.id + '" class="iconbtn">' + ICONS.trash + '</button>' +
    '</div></div>';
  html += '<div class="rows">' + (ts.length ? ts.map(trackRow).join('')
    : '<div class="empty"><div class="big">Empty playlist</div><p>Add songs from the ••• menu in search results.</p></div>') + '</div>';
  html += '</div>';
  return html;
}

function viewAlbum(){
  var a = state.activeAlbumObj;
  if (!a) return viewLibrary();
  var saved = state.albums.some(function(x){ return x.id === a.id; });
  var ts = (a.items || []).map(function(x){ return typeof x === 'string' ? TRACK_MAP[x] : x; }).filter(Boolean);
  var html = '<div class="viewfade">';
  html += '<div class="hero" style="background:linear-gradient(180deg,rgba(43,88,118,.55),rgba(0,0,0,.1))">' +
    '<div style="display:flex;gap:16px;align-items:flex-end">' +
    '<div class="art" style="width:120px;height:120px;flex:0 0 auto;' + artStyle(a) + ';box-shadow:0 14px 30px rgba(0,0,0,.5)"></div>' +
    '<div style="min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.85)">ALBUM</div>' +
    '<div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.15">' + esc(a.title || 'Album') + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:8px">' + esc(a.artist || '') + (ts.length ? ' · ' + ts.length + ' songs' : '') + '</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:14px;margin-top:18px">' +
    (ts.length ? '<button data-act="album-play" data-id="' + a.id + '" style="width:52px;height:52px;background:linear-gradient(180deg,#f0bc58,#c98a2c);color:#241503;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,240,200,.55),0 3px 0 rgba(0,0,0,.4);border:1px solid #7a4e16">' + ICONS.play + '</button>' : '') +
    '<button class="chip' + (saved ? ' on' : '') + '" data-act="album-save" data-id="' + a.id + '">' + (saved ? 'Saved' : 'Save album') + '</button>' +
    '</div></div>';

  if (!ts.length){
    html += '<div class="errbox"><b>Track list unavailable</b>The public instance returned this album’s name but not its songs — ' +
      'a common limitation right now. Try again, or open it on YouTube Music.' +
      '<a class="extlink" href="https://music.youtube.com/playlist?list=' + encodeURIComponent(a.id) + '" target="_blank" rel="noopener">Open on YouTube Music ↗</a>' +
      '<button class="retry" data-act="reload-album" data-id="' + a.id + '">Try again</button></div>';
    html += artistSongsFallback(a);
  } else {
    html += '<div class="rows">' + ts.map(trackRow).join('') + '</div>';
  }
  html += '</div>';
  return html;
}

function viewSettings(){
  var st = state.settings;
  function seg(key, opts, cur, extra){
    return '<div class="seg">' + opts.map(function(o){
      return '<button class="' + (String(cur) === String(o[0]) ? 'on' : '') + '" data-act="set" data-key="' + key +
        '" data-val="' + o[0] + '"' + (extra || '') + '>' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  var used = downloadedBytes();
  var pct = Math.min(100, (used / (st.capMB * 1048576)) * 100);
  var audioCount = state.downloads.filter(function(d){ return d.kind === 'audio'; }).length;

  var html = '<div class="viewfade">';
  html += installHintHTML();

  html += '<div class="setsec"><h3>Search backend</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Status</div>' +
    '<div class="sub">' + (state.net === 'online'
      ? 'Connected to <b style="color:#cfeedc">' + esc((Backend.working || '').replace(/^https?:\/\//,'')) + '</b>'
      : state.net === 'down' ? 'No instance reachable right now' : 'Checking…') + '</div></div>' +
    '<button class="chip" data-act="retry-net">Test</button></div>' +
    '<div class="inputrow"><label for="instInput">Custom instance (optional)</label>' +
    '<input id="instInput" type="url" inputmode="url" spellcheck="false" placeholder="https://invidious.example.com" value="' + esc(st.instance) + '">' +
    '<div class="hint">Sonora tries public Invidious instances in order. Paste your own if you have one — no account needed.</div></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Stream backend</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Provider</div>' +
    '<div class="sub">' + (state.audioSource
      ? '<b style="color:#cfeedc">' + PROVIDER_LABEL[state.audioSource.name] + '</b> · ' + esc(hostLabel(state.audioSource.host)) + '<br><span style="color:var(--muted2)">resolved ' + ago(state.audioSource.at) + ' · ' + (state.audioSource.bitrate || '—') + ' kbps</span>'
      : 'Not resolved yet — resolves on first play.') + '</div></div>' +
    '<button class="chip" data-act="audio-test">Test now</button></div>' +
    '<div class="inputrow"><div class="hint">Invidious → Cobalt — the first validated source wins. ' +
    'Instance lists refresh live from the providers’ own directories, so stale instances never stall a track. ' +
    'Search and audio resolution share the Invidious chain; Cobalt is the last resort. These public services see your track IDs and titles.</div></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Download behaviour</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">What “Download” does</div>' +
    '<div class="sub">“Download audio file” in the track menu saves the real bytes to your device — mp3 from Cobalt, whatever Invidious serves. “Download” stores an offline copy on this device and falls back to a library save if the stream is unavailable.</div></div>' +
    seg('downloadMode', [['audio','Offline audio'],['library','Library save']], st.downloadMode) + '</div>' +
    '<div class="setrow col"><div><div class="lbl">Audio bitrate</div>' +
    '<div class="sub">Applied exactly when a real audio stream is available.</div></div>' +
    seg('downloadQuality', [['saver','48k'],['normal','128k'],['high','256k']], st.downloadQuality) + '</div>' +
    '<div class="setrow col"><div><div class="lbl">Storage cap</div>' +
    '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
    '<div class="kv"><span>' + fmtMB(used) + ' · ' + state.downloads.length + ' item(s), ' + audioCount + ' offline</span><span>cap ' + st.capMB + ' MB</span></div></div>' +
    seg('capMB', [['256','256'],['512','512'],['1024','1 GB'],['2048','2 GB']], st.capMB) + '</div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Streaming quality</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">Stream over</div>' +
    '<div class="sub">Picks the best audio stream the instance offers at or below this bitrate.</div></div>' +
    seg('streamQuality', [['saver','Saver'],['normal','Normal'],['high','High'],['auto','Auto']], st.streamQuality) + '</div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Music videos</h3><div class="card-box">' +
    '<div class="setrow col"><div><div class="lbl">Filter level</div>' +
    '<div class="sub">Strict also drops lyric videos and visualizers.</div></div>' +
    seg('strictness', [['balanced','Balanced'],['strict','Strict']], st.strictness) + '</div>' +
    '<div class="setrow"><div><div class="lbl">Filtered in this session</div>' +
    '<div class="sub">Every suppressed title is listed with the reason.</div></div>' +
    '<button class="chip" data-act="hidden-info">' + state.hidden.length + ' hidden</button></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Backup & sync</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Export playlists</div>' +
    '<div class="sub">Save every playlist to a local sonora-playlists.json file.</div></div>' +
    '<button class="chip" data-act="export-playlists">' + ICONS.export + ' Export</button></div>' +
    '<div class="setrow"><div><div class="lbl">Import playlists</div>' +
    '<div class="sub">Upload a .json or .txt file — playlists are matched to songs by search.</div></div>' +
    '<label class="chip" style="cursor:pointer"><input type="file" id="importInput" accept=".json,.txt,application/json,text/plain" hidden>' +
    ICONS.cloudDown + ' Import</label></div>' +
    '</div></div>';

  html += '<div class="setsec"><h3>Google Drive sync</h3><div class="card-box">' +
    '<div class="inputrow"><label for="gdrvClientId">Google Client ID (optional)</label>' +
    '<input id="gdrvClientId" type="text" spellcheck="false" placeholder="…apps.googleusercontent.com" value="' + esc(gdrive.clientId) + '">' +
    '<div class="hint">Your personal, local-only identifier. Google Cloud Console → APIs &amp; Services → Credentials → OAuth client ID (Web application). ' +
    'Add your origin (this site) to Authorized JavaScript origins. The secret is never needed and nothing is stored except this ID in this device’s localStorage.</div></div>' +
    '<div class="setrow"><div><div class="lbl">Status</div>' +
    '<div class="sub">' + (gdrive.token ? 'Signed in with Google Drive' : gdriveConfigured() ? 'Client ID saved — not sign-in required yet' : 'Not configured — skip to use local-only sync') + '</div></div>' +
    '<button class="chip" data-act="gdrive-sign-in">' + ICONS.cloudUp + ' Sign in</button></div>' +
    '<div class="setrow"><div><div class="lbl">Push playlists</div>' +
    '<div class="sub">Upload sonora-playlists.json to your Drive.</div></div>' +
    '<button class="chip" data-act="gdrive-push">' + ICONS.cloudUp + ' Push</button></div>' +
    '<div class="setrow"><div><div class="lbl">Restore playlists</div>' +
    '<div class="sub">Replace local playlists with the file on Drive.</div></div>' +
    '<button class="chip" data-act="gdrive-pull">' + ICONS.cloudDown + ' Pull</button></div>' +
    (gdrive.token ? '<div class="setrow"><div><div class="lbl">Connected</div>' +
      '<div class="sub">Signed in · last sync ' + (gdrive.lastSync ? new Date(gdrive.lastSync).toLocaleString() : '—') + '</div></div>' +
      '<button class="chip danger" data-act="gdrive-sign-out">Sign out</button></div>' : '') +
    '</div></div>';

  html += '<div class="setsec"><h3>App</h3><div class="card-box">' +
    '<div class="setrow"><div><div class="lbl">Installed as app</div>' +
    '<div class="sub">' + (standalone ? 'Running standalone — no browser UI.' : 'Safari → Share → Add to Home Screen.') + '</div></div>' +
    '<span style="font-size:11px;font-weight:800;letter-spacing:.06em;color:' + (standalone ? 'var(--accent)' : 'var(--muted)') + '">' + (standalone ? 'YES' : 'NO') + '</span></div>' +
    '<div class="setrow"><div><div class="lbl">Storage</div>' +
    '<div class="sub">' + (db ? 'IndexedDB · persistent on this device' : 'In-memory fallback — this context blocks IndexedDB') + '</div></div></div>' +
    '<div class="setrow"><div><div class="lbl">Clear local data</div>' +
    '<div class="sub">Playlists, albums, likes and downloads on this device.</div></div>' +
    '<button class="chip danger" data-act="clear-data">Clear</button></div>' +
    '</div></div>';

  html += '<div class="note" style="margin-bottom:26px"><b>If you delete the Home Screen icon</b>, iOS also deletes everything Sonora stored on the device.</div>';
  html += '</div>';
  return html;
}

function renderView(){
  if (state.view === 'search'){ renderSearch(); return; }
  var html = '';
  if (state.view === 'home') html = viewHome();
  else if (state.view === 'library') html = viewLibrary();
  else if (state.view === 'settings') html = viewSettings();
  else if (state.view === 'playlist') html = viewPlaylist();
  else if (state.view === 'album') html = viewAlbum();
  var view = $('#view');
  view.innerHTML = html;
  view.dataset.view = state.view;
}

/* ------------------------------ sheets ------------------------------ */
function closeSheets(){ $('#asheet').classList.remove('open'); $('#scrim').classList.remove('on'); }
function openSheet(inner){ var s = $('#asheet'); s.innerHTML = inner; s.classList.add('open'); $('#scrim').classList.add('on'); }

function openTrackMenu(id){
  var t = TRACK_MAP[id]; if (!t) return;
  var dl = downloadOf(id);
  var inPl = !!state.activePlaylist;
  var html = '<div class="ahead"><b>' + esc(t.title) + '</b>' + esc(t.artist) + (t.source === 'demo' ? ' · demo track' : ' · audio') + '</div>';
  html += '<button class="aitem" data-act="do-like" data-id="' + id + '">' + (isLiked(id) ? ICONS.heartF : ICONS.heart) + (isLiked(id) ? 'Remove from Liked Songs' : 'Add to Liked Songs') + '</button>';
  html += '<button class="aitem" data-act="do-download" data-id="' + id + '">' + ICONS.download + (dl ? 'Delete download' : 'Download (offline)') + '</button>';
  html += '<button class="aitem" data-act="do-download-file" data-id="' + id + '">' + ICONS.download + 'Download audio file</button>';
  html += '<button class="aitem" data-act="play" data-id="' + id + '">' + ICONS.play + 'Play now</button>';
  if (t.source !== 'demo'){
    html += '<a class="aitem" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" ' +
      'href="https://music.youtube.com/watch?v=' + encodeURIComponent(t.id) + '">' + ICONS.share + 'Open in YouTube Music</a>';
  }
  if (inPl) html += '<button class="aitem" data-act="remove-from-playlist" data-id="' + id + '">' + ICONS.x + 'Remove from this playlist</button>';
  html += '<div class="ahead" style="border-bottom:0;border-top:1px solid var(--line);padding-top:10px">Add to playlist</div>';
  if (!state.playlists.length){
    html += '<button class="aitem" data-act="newplaylist-for" data-id="' + id + '">' + ICONS.plus + 'Create a playlist</button>';
  } else {
    state.playlists.forEach(function(pl){
      html += '<button class="aitem" data-act="add-to" data-id="' + id + '" data-pl="' + pl.id + '">' + ICONS.plus + esc(pl.name) + '</button>';
    });
    html += '<button class="aitem" data-act="newplaylist-for" data-id="' + id + '">' + ICONS.plus + 'New playlist…</button>';
  }
  openSheet(html);
}

function openHiddenInfo(){
  if (!state.hidden.length){
    openSheet('<div class="ahead"><b>Nothing filtered yet</b>Search for something and Sonora will list every music video it dropped.</div>' +
      '<button class="aitem" data-act="close-sheet" style="justify-content:center;color:var(--accent)">Close</button>');
    return;
  }
  var html = '<div class="ahead"><b>' + state.hidden.length + ' music videos suppressed</b>Each one was dropped instead of being substituted in.</div>';
  state.hidden.forEach(function(v){
    html += '<div class="aitem" style="display:block"><div style="font-size:13.5px;font-weight:700;line-height:1.35">' + esc(v.title) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px">' + esc(v.artist || '') + ' — ' + esc(v.reason) + '</div></div>';
  });
  html += '<button class="aitem" data-act="close-sheet" style="justify-content:center;color:var(--accent)">Close</button>';
  openSheet(html);
}

/* ------------------------------ events ------------------------------ */
document.addEventListener('click', function(e){
  if (e.target.closest && e.target.closest('#searchResults')) searchDirty = false;
  var el = e.target.closest('[data-act]');
  if (!el){ if (e.target.id === 'scrim') closeSheets(); return; }
  var act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case 'settings': state.view = 'settings'; render(); break;
    case 'back':
      if (state.view === 'playlist' || state.view === 'album'){
        state.activePlaylist = null; state.activeAlbumObj = null;
        state.view = 'library'; state.tab = 'library';
      } else { state.view = 'home'; state.tab = 'home'; }
      render(); break;
    case 'play': {
      var q = null;
      if (state.activePlaylist) q = state.activePlaylist.tracks.slice();
      else if (state.view === 'album' && state.activeAlbumObj && state.activeAlbumObj.items)
        q = state.activeAlbumObj.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
      playTrack(id, q);
      break;
    }
    case 'openplaylist': {
      state.activePlaylist = state.playlists.filter(function(p){ return p.id === id; })[0] || null;
      if (state.activePlaylist && state.activePlaylist.tracks.length){
        setGroup('playlist', state.activePlaylist.id, state.activePlaylist.name, '', state.activePlaylist.tracks);
      }
      state.view = 'playlist'; render(); break;
    }
    case 'openalbum': {
      var sAlb = state.albums.filter(function(a){ return a.id === id; })[0];
      var found = state.albumResults.filter(function(a){ return a.id === id; })[0];
      state.activeAlbumObj = found || (sAlb ? { id: sAlb.id, title: sAlb.title, artist: sAlb.artist, thumb: sAlb.thumb, items: sAlb.items || [] } : { id: id, title: 'Album', artist: '', items: [] });
      var albItems = (state.activeAlbumObj.items || []).map(function(x){ return typeof x === 'string' ? { id: x } : x; });
      if (albItems.length){
        setGroup('album', id, state.activeAlbumObj.title, state.activeAlbumObj.artist, albItems);
        rememberAlbum(state.activeAlbumObj, albItems);
      }
      state.view = 'album'; render();
      if (!(state.activeAlbumObj.items || []).length && state.net !== 'down') reloadAlbum(id);
      break;
    }
    case 'reload-album': reloadAlbum(id); break;
    case 'album-save': {
      var a = state.activeAlbumObj || { id: id, title:'Album', artist:'', items:[] };
      saveAlbum(a); break;
    }
    case 'album-play': {
      var alb = state.activeAlbumObj;
      if (alb && alb.items && alb.items.length){
        var ids = alb.items.map(function(x){ return typeof x === 'string' ? x : x.id; });
        setGroup('album', alb.id, alb.title, alb.artist, alb.items);
        rememberAlbum(alb, alb.items);
        playTrack(ids[0], ids);
      } else toast('No tracks available for this album');
      break;
    }
    case 'playlist-play': {
      var pl = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (pl && pl.tracks.length){
        setGroup('playlist', pl.id, pl.name, '', pl.tracks);
        playTrack(pl.tracks[0], pl.tracks.slice());
      } else toast('This playlist is empty');
      break;
    }
    case 'playlist-to-album': {
      var p2 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (!p2) break;
      saveAlbum({ id: 'album_' + p2.id, title: p2.name, artist: 'From your playlist', thumb: '', items: p2.tracks.slice(), c: ['#e0a63f','#6e3c14'] });
      break;
    }
    case 'playlist-rename': {
      var p3 = state.playlists.filter(function(p){ return p.id === id; })[0];
      var nm = prompt('Rename playlist', p3 ? p3.name : '');
      if (nm && p3){ p3.name = nm.trim() || p3.name; dbPut('playlists', p3); render(); }
      break;
    }
    case 'playlist-delete': {
      var p4 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (p4 && confirm('Delete playlist “' + p4.name + '”?')){
        state.playlists = state.playlists.filter(function(p){ return p.id !== id; });
        dbDel('playlists', id);
        state.activePlaylist = null; state.view = 'library';
        render(); toast('Playlist deleted');
      }
      break;
    }
    case 'newplaylist': {
      var name = prompt('New playlist name', 'My Playlist #' + (state.playlists.length + 1));
      if (name !== null){
        var np = newPlaylist(name.trim() || undefined);
        state.libTab = 'playlists'; state.view = 'library'; state.tab = 'library';
        render(); toast('Created “' + np.name + '”');
      }
      break;
    }
    case 'newplaylist-for': {
      var nm2 = prompt('New playlist name', 'My Playlist #' + (state.playlists.length + 1));
      if (nm2 !== null){ var np2 = newPlaylist(nm2.trim() || undefined); addToPlaylist(np2.id, id); closeSheets(); render(); }
      break;
    }
    case 'add-to': addToPlaylist(el.dataset.pl, id); closeSheets(); break;
    case 'remove-from-playlist':
      if (state.activePlaylist){
        state.activePlaylist.tracks = state.activePlaylist.tracks.filter(function(x){ return x !== id; });
        dbPut('playlists', state.activePlaylist);
        closeSheets(); render(); toast('Removed from playlist');
      }
      break;
    case 'menu': openTrackMenu(id); break;
    case 'do-like': toggleLike(id); closeSheets(); break;
    case 'do-download': if (isDownloaded(id)) removeDownload(id); else downloadTrack(id); closeSheets(); break;
    case 'do-download-file': downloadAudioFile(id); closeSheets(); break;
    case 'like-current': { var ct = currentTrack(); if (ct) toggleLike(ct.id); break; }
    case 'download-current': { var ct2 = currentTrack(); if (ct2){ if (isDownloaded(ct2.id)) removeDownload(ct2.id); else downloadTrack(ct2.id); } break; }
    case 'toggle': togglePlay(); break;
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'shuffle': state.shuffle = !state.shuffle; syncPlayer(); toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); break;
    case 'repeat': state.repeat = !state.repeat; syncPlayer(); toast(state.repeat ? 'Repeat on' : 'Repeat off'); break;
    case 'open-np': $('#np').classList.add('open'); syncPlayer(); break;
    case 'close-np': $('#np').classList.remove('open'); break;
    case 'np-menu': { var ct3 = currentTrack(); if (ct3) openTrackMenu(ct3.id); break; }
    case 'hidden-info': openHiddenInfo(); break;
    case 'close-sheet': closeSheets(); break;
    case 'libtab': state.libTab = id; render(); break;
    case 'mode': state.searchMode = id; state.results = []; state.albumResults = []; render(); if (state.query.trim()) runSearch(); break;
    case 'go-search': state.tab = 'search'; state.view = 'search'; render(); setTimeout(function(){ var i = $('#searchInput'); if (i) i.focus(); }, 150); break;
    case 'open-liked': state.libTab = 'liked'; state.view = 'library'; state.tab = 'library'; render(); break;
    case 'retry-net': case 'retry-search': probeAndRender(); break;
    case 'set': {
      var key = el.dataset.key, val = el.dataset.val;
      state.settings[key] = (key === 'capMB') ? parseInt(val, 10) : val;
      LS.set('sonora.settings', state.settings);
      if (key === 'strictness') toast(val === 'strict' ? 'Strict — lyric videos dropped too' : 'Balanced — lyric videos allowed');
      else if (key === 'downloadMode') toast(val === 'audio' ? 'Downloads try real offline audio first' : 'Downloads save to library only');
      else if (key === 'downloadQuality') toast('Audio bitrate: ' + KBPS[val] + ' kbps');
      else if (key === 'capMB') toast('Storage cap: ' + val + ' MB');
      else toast('Streaming preference: ' + (QUAL_LABEL[val] || val));
      render(); if (key === 'strictness' && state.query.trim()) runSearch();
      break;
    }
    case 'clear-data':
      if (confirm('Delete all Sonora data on this device?')){
        state.playlists.forEach(function(p){ dbDel('playlists', p.id); });
        state.albums.forEach(function(a){ dbDel('albums', a.id); });
        state.liked.forEach(function(l){ dbDel('liked', l.id); });
        state.downloads.forEach(function(d){ dbDel('downloads', d.id); dbDel('blobs', d.id); });
        state.playlists = []; state.albums = []; state.liked = []; state.downloads = []; state.recent = [];
        LS.set('sonora.recent', []);
        render(); toast('Local data cleared');
      }
      break;
    case 'dismiss-install': state.installDismissed = true; LS.set('sonora.installDismissed', true); render(); break;
    case 'audio-test': {
      var t3 = currentTrack();
      if (!t3){ toast('Play something first, then Test now'); break; }
      var kbps3 = AUDIO_QUAL_KBPS(state.settings.streamQuality === 'auto' ? 'normal' : state.settings.streamQuality);
      toast('Testing stream…');
      Backend.resolveAudio(t3.id, kbps3).then(function(got){
        state.audioSource = { name: got.provider, host: got.host, bitrate: got.bitrate, at: Date.now() };
        toast('Audio: ' + PROVIDER_LABEL[got.provider] + ' · ' + hostLabel(got.host) + ' · ' + got.bitrate + ' kbps');
        render();
      }).catch(function(e){
        state.audioSource = null;
        toast('No audio source — ' + fmtResolveError(e));
        render();
      });
      break;
    }
    case 'lyrics-toggle': {
      var curTrack = currentTrack();
      if (!curTrack){ toast('Play something first'); break; }
      if (lyricsState.open){ lyricsState.open = false; lyricsReset(false); syncPlayer(); break; }
      lyricsState.open = true; lyricsState.trackId = curTrack.id;
      lyricsState.synced = null; lyricsState.plain = null; lyricsState.curLine = -1;
      renderLyrics(curTrack);
      syncPlayer();
      break;
    }
    case 'export-playlists': exportPlaylists(); break;
    case 'import-playlists': {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,.txt,application/json,text/plain';
      inp.onchange = function(){ if (inp.files && inp.files[0]) importPlaylistsFromFile(inp.files[0]); };
      inp.click();
      break;
    }
    case 'gdrive-sign-in': gdriveSignIn(); break;
    case 'gdrive-push': gdrivePush(); break;
    case 'gdrive-pull': gdrivePull(); break;
    case 'gdrive-sign-out': gdriveSignOut(); break;
    case 'playlist-image': {
      var pl2 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (pl2) handlePlaylistImagePick(pl2);
      break;
    }
    case 'playlist-image-clear': {
      var pl3 = state.playlists.filter(function(p){ return p.id === id; })[0];
      if (pl3){ pl3.image = null; dbPut('playlists', pl3); render(); toast('Playlist image cleared'); }
      break;
    }
    case 'install-app': if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; state.canInstall = false; } break;
  }
});

/* ------------------------------ search + album loaders ------------------------------ */
/* A pasted YouTube link/ID always resolves to a playable result, even when
   every instance is unreachable — it can then be played or downloaded via
   whatever direct source resolves. */
function parseYouTubeLink(q){
  var m = String(q || '').trim();
  if (!m || m.length > 200) return '';
  var pats = [/[?&]v=([A-Za-z0-9_-]{11})/, /youtu\.be\/([A-Za-z0-9_-]{11})/,
              /\/shorts\/([A-Za-z0-9_-]{11})/, /\/embed\/([A-Za-z0-9_-]{11})/];
  for (var i = 0; i < pats.length; i++){
    var r = pats[i].exec(m);
    if (r) return r[1];
  }
  if (/^[A-Za-z0-9_-]{11}$/.test(m) && /[-_0-9]/.test(m)) return m;
  return '';
}

async function runSearch(){
  var q = state.query.trim();
  if (!q){ state.results = []; state.albumResults = []; state.searchError = null; state.searching = false; render(); return; }
  var seq = ++searchSeq;
  state.searching = true; state.searchError = null; state.hidden = [];
  render();

  var linkId = state.searchMode === 'songs' ? parseYouTubeLink(q) : '';
  if (linkId){
    var lt = { id: linkId, title: 'YouTube · ' + linkId, artist: 'Pasted link', album: '',
      dur: 0, thumb: 'https://i.ytimg.com/vi/' + linkId + '/mqdefault.jpg', source: 'link' };
    TRACK_MAP[linkId] = lt;
    state.results = [lt]; state.albumResults = []; state.hidden = [];
    state.searching = false; state.searchError = null;
    render();
    return;
  }
  try {
    if (state.searchMode === 'albums'){
      var a = await Backend.searchAlbums(q);
      if (seq !== searchSeq) return;
      state.albumResults = prioritizeItems(a.albums || [], q); state.hidden = a.hidden || [];
    } else {
      var r = await Backend.searchSongs(q);
      if (seq !== searchSeq) return;
      state.results = prioritizeItems(r.tracks || [], q); state.hidden = r.hidden;
    }
    state.net = 'online';
  } catch(err){
    if (seq !== searchSeq) return;
    state.searchError = err && err.message ? err.message : String(err);
    state.net = 'down';
    if (state.searchMode === 'songs'){
      var demo = demoSearch(q);
      if (demo.length){ state.results = demo; state.searchError += ' — showing offline demo results'; }
    }
  } finally {
    if (seq === searchSeq){
      state.searching = false;
      render();
      if (searchDirty){ restoreSearchFocus(); searchDirty = false; }
    }
  }
}
function restoreSearchFocus(){
  if (state.view !== 'search') return;
  var active = document.activeElement;
  if (active && active.id === 'searchInput') return;
  /* user interacted with result content — respect it */
  if (active && active.closest && active.closest('#searchResults')) return;
  if (active && active.closest && active.closest('#asheet')) return;
  if (active && active.closest && active.closest('#np')) return;
  var inp = document.getElementById('searchInput');
  if (inp && active !== inp){
    inp.focus();
    try { inp.setSelectionRange(state.query.length, state.query.length); } catch(e){}
  }
}
async function reloadAlbum(id){
  toast('Loading album…');
  try {
    var alb = await Backend.album(id);
    state.activeAlbumObj = alb;
    state.net = 'online';
    render();
    if (!alb.items || !alb.items.length) loadAlbumArtistSongs(id);
  } catch(e){
    state.net = 'down';
    toast('Album unavailable right now');
    render();
    loadAlbumArtistSongs(id);
  }
}
async function probeAndRender(){
  if (state.net !== 'online') toast('Checking instances…');
  await Backend.probe();
  render();
  if (state.net === 'online') toast('Connected to ' + (Backend.working || '').replace(/^https?:\/\//,''));
  else toast('No instance reachable — try again shortly');
}

/* =====================================================================
   Smart shuffle + infinite autoplay
   Enabled when shuffle is on and repeat is off:
     1. finish the album/playlist the song is in (front-to-back)
     2. next album from the same artist (discography, best-effort)
     3. other albums from the same artist (songs fallback)
     4. the last user-selected album's remainder
     5. any known album's unplayed remainder
     6. a random queue track
   The public Invidious API exposes no release dates, so “chronological
   release” is approximated by result order — this is a best-effort
   approximation, not a strict chronology.
   ===================================================================== */
var autoNow = false;
var autoAlbumSeen = {};     // albumId -> true (auto-visited this session)
var autoTrackSeen = {};     // trackId -> true (session-lifetime set)
var albumCache = {};        // albumId -> {id, title, artist, items:[{id,title,artist,thumb,dur}], at}
var albumContext = null;     // {id, title, artist, ids:[...] } — playback group in progress
var featuredAlbumId = null; // the album of the last user-selected song

function groupIds(){
  if (albumContext) return albumContext.ids;
  return state.queue.slice();
}
function markTrack(id){
  autoTrackSeen[id] = true;
}
function clearAutoDone(){
  autoTrackSeen = {};
  autoAlbumSeen = {};
}
function setGroup(kind, id, title, artist, items){
  var ids = (items || []).map(function(x){ return typeof x === 'string' ? x : x.id; }).filter(Boolean);
  albumContext = { kind: kind, id: id, title: title || '', artist: artist || '', ids: ids };
  ids.forEach(function(tid){ if (TRACK_MAP[tid]) TRACK_MAP[tid].albumId = (kind === 'album') ? id : null; });
}
function rememberAlbum(alb, items){
  if (!alb || !alb.id) return;
  var list = (items || []).map(function(x){ return typeof x === 'string' ? { id: x } : x; }).filter(function(x){ return x && x.id; });
  albumCache[alb.id] = { id: alb.id, title: alb.title || 'Album', artist: alb.artist || '', items: list, at: Date.now() };
  featuredAlbumId = alb.id;
}

/* --- artist discography (cached search) --- */
var artistAlbumCache = {};   // artist-lower -> { albums: [...], at }
var artistSongCache = {};     // artist-lower -> { songs: [...], at }
var ARTIST_CACHE_TTL = 10 * 60 * 1000;

function cachedArtistAlbums(artist){
  var key = String(artist || '').toLowerCase();
  if (!key) return Promise.resolve([]);
  var hit = artistAlbumCache[key];
  if (hit && Date.now() - hit.at < ARTIST_CACHE_TTL) return Promise.resolve(hit.albums);
  return (async function(){
    try {
      var res = await Backend.searchAlbums(artist);
      var seen = {}, out = [];
      (res.albums || []).forEach(function(a){
        if (!a || !a.id || seen[a.id]) return;
        seen[a.id] = true;
        out.push(a);
      });
      artistAlbumCache[key] = { albums: out, at: Date.now() };
      return out;
    } catch (e) { return []; }
  })();
}

function cachedArtistSongs(artist){
  var key = String(artist || '').toLowerCase();
  if (!key) return Promise.resolve([]);
  var hit = artistSongCache[key];
  if (hit && Date.now() - hit.at < ARTIST_CACHE_TTL) return Promise.resolve(hit.songs);
  return (async function(){
    try {
      var res = await Backend.searchSongs(artist);
      var tracks = (res.tracks || []).filter(function(t){
        return String(t.artist || '').toLowerCase().indexOf(key.split(' ')[0]) >= 0;
      });
      if (!tracks.length) tracks = res.tracks || [];
      artistSongCache[key] = { songs: tracks, at: Date.now() };
      return tracks;
    } catch (e) { return []; }
  })();
}

function playQueue(ids, startIdx){
  ids = ids.filter(function(id){ return id; });
  if (!ids.length) return false;
  state.queue = ids.slice();
  state.idx = (typeof startIdx === 'number' && startIdx >= 0 && startIdx < ids.length) ? startIdx : 0;
  state.progress = 0;
  state.playing = true;
  Player.stop();
  lyricsReset(false);
  var t = currentTrack();
  if (t){
    markTrack(t.id);
    loadAndPlay(t);
    setSessionMeta();
    pushRecent(t.id);
  }
  syncPlayer();
  return true;
}

async function smartNextTrack(){
  if (autoNow) return;
  var cur = currentTrack();
  if (!cur) return;
  autoNow = true;
  try {
    autoAlbumSeen[cur.albumId || (albumContext && albumContext.id)] = true;

    // 1. finish the album/playlist in playback
    var group = albumContext;
    if (group && group.ids.length){
      var ids = group.ids.slice();
      var icur = ids.indexOf(cur.id);
      var remaining = ids.slice(icur + 1).filter(function(id){ return !autoTrackSeen[id]; });
      if (!remaining.length && ids.length > 1){
        // all tracks of the group played — skip this album
        autoAlbumSeen[group.id] = true;
      }
      if (remaining.length){
        playQueue(ids, ids.indexOf(remaining[0]));
        return;
      }
    }

    // 2. next album from the same artist (discography)
    var artist = (cur.artist || '').trim();
    if (artist && cur.source !== 'demo'){
      var albums = await cachedArtistAlbums(artist);
      for (var i = 0; i < albums.length; i++){
        var alb = albums[i];
        if (!alb || !alb.id) continue;
        if (alb.id === (cur.albumId || (albumContext && albumContext.id))) continue;
        if (autoAlbumSeen[alb.id]) continue;
        if (!alb.items || !alb.items.length) continue;
        autoAlbumSeen[alb.id] = true;
        setGroup('album', alb.id, alb.title, alb.artist, alb.items);
        rememberAlbum(alb, alb.items);
        featuredAlbumId = alb.id;
        playQueue(albumContext.ids, 0);
        return;
      }

      // 3. remaining songs of the artist (discography over → same-artist songs)
      var songs = await cachedArtistSongs(artist);
      var remainingSongs = songs.filter(function(t){ return !autoTrackSeen[t.id]; });
      if (remainingSongs.length){
        var pick = remainingSongs[Math.floor(Math.random() * remainingSongs.length)];
        var q = songs.map(function(t){ return t.id; });
        state.queue = q;
        var start = q.indexOf(pick.id);
        playQueue(q, start < 0 ? 0 : start);
        return;
      }
    }

    // 4. last user-selected album's remainder
    if (featuredAlbumId && albumCache[featuredAlbumId]){
      var f = albumCache[featuredAlbumId];
      var rem = f.items.filter(function(x){ return !autoTrackSeen[x.id]; }).map(function(x){ return x.id; });
      if (rem.length){
        var ids2 = f.items.map(function(x){ return x.id; });
        setGroup('album', f.id, f.title, f.artist, f.items);
        playQueue(ids2, ids2.indexOf(rem[0]));
        return;
      }
    }

    // 5. any known album's remainder
    var known = Object.keys(albumCache);
    for (var j = 0; j < known.length; j++){
      var a2 = albumCache[known[j]];
      if (autoAlbumSeen[a2.id] && known[j] !== featuredAlbumId) continue;
      var rem4 = a2.items.filter(function(x){ return !autoTrackSeen[x.id]; }).map(function(x){ return x.id; });
      if (rem4.length){
        setGroup('album', a2.id, a2.title, a2.artist, a2.items);
        playQueue(rem4, 0);
        return;
      }
    }

    // 6. random queue track (legacy behavior)
    var pick2 = Math.floor(Math.random() * state.queue.length);
    if (pick2 === state.idx) pick2 = (pick2 + 1) % state.queue.length;
    state.idx = pick2;
    state.progress = 0;
    state.playing = true;
    Player.stop();
    var t2 = currentTrack();
    if (t2){ loadAndPlay(t2); setSessionMeta(); pushRecent(t2.id); }
    syncPlayer();
  } finally {
    autoNow = false;
  }
}

/* =====================================================================
   Language prioritization
   Detect the user's language from the browser, plus the query script.
   Results are sorted so same-language songs/albums float to the top.
   ===================================================================== */
var SCRIPTS = [
  ['devanagari', /[\u0900-\u097F]/],
  ['bengali-mathiluni', /[\u0980-\u09FF]/],
  ['gurmukhi', /[\u0A00-\u0A7F]/],
  ['gujarati', /[\u0A80-\u0AFF]/],
  ['oriya', /[\u0B00-\u0B7F]/],
  ['tamil', /[\u0B80-\u0BFF]/],
  ['kannada', /[\u0C80-\u0CFF]/],
  ['malayalam', /[\u0D00-\u0D7F]/],
  ['sinhala', /[\u0D80-\u0DFF]/],
  ['telugu', /[\u0C00-\u0C7F]/],
  ['arabic', /[\u0600-\u06FF]/],
  ['hebrew', /[\u0590-\u05FF]/],
  ['thai', /[\u0E00-\u0E7F]/],
  ['lao', /[\u0E80-\u0EFF]/],
  ['khmer', /[\u1780-\u17FF]/],
  ['georgian', /[\u10A0-\u10FF]/],
  ['armenian', /[\u0530-\u058F]/],
  ['ethiopic', /[\u1200-\u137F]/],
  ['cjk', /[\u4E00-\u9FFF\u3400-\u4DBF]/],
  ['hangul', /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/],
  ['cyrillic', /[\u0400-\u04FF]/],
  ['greek', /[\u0370-\u03FF]/]
];

function scriptOf(s){
  var t = String(s || '');
  for (var i = 0; i < SCRIPTS.length; i++){
    if (SCRIPTS[i][1].test(t)) return SCRIPTS[i][0];
  }
  return 'latin';
}

function browserScript(){
  var lang = String(navigator.language || 'en').toLowerCase().split('-')[0];
  var map = {
    ja:'cjk', zh:'cjk', ko:'hangul', ru:'cyrillic', uk:'cyrillic', be:'cyrillic',
    bg:'cyrillic', sr:'cyrillic', mk:'cyrillic', fa:'arabic', ar:'arabic', ur:'arabic', he:'hebrew',
    hi:'devanagari', mr:'devanagari', ne:'devanagari', sa:'devanagari',
    ta:'tamil', te:'telugu', kn:'kannada', ml:'malayalam', gu:'gujarati', pa:'gurmukhi', or:'oriya',
    si:'sinhala', th:'thai', km:'khmer', lo:'lao', ka:'georgian', am:'ethiopic', hy:'armenian',
    el:'greek', fi:'latin', vi:'latin'
  };
  return map[lang] || 'latin';
}

function scoreItem(t, q, script){
  var sc = 0;
  var title = String(t.title || '').toLowerCase();
  var artist = String(t.artist || '').toLowerCase();
  var qLower = String(q || '').toLowerCase().trim();
  if (!qLower) return 0;
  var nq = normTitle(q);
  if (title.indexOf(qLower) >= 0) sc += 40;
  if (nq && title.indexOf(nq) >= 0) sc += 15;
  if (artist.indexOf(qLower) >= 0) sc += 30;
  if (artist.indexOf(nq) >= 0 && nq.length > 3) sc += 10;
  var lang = script === 'latin' ? null : script;
  var itemScript = scriptOf(t.title + ' ' + t.artist);
  if (lang){
    if (itemScript === lang) sc += 50;
    else sc -= 20;
  }
  return sc;
}

function prioritizeItems(list, q){
  var qScript = scriptOf(q);
  var target = (qScript !== 'latin') ? qScript : browserScript();
  var out = list.slice();
  out.sort(function(a, b){ return scoreItem(b, q, target) - scoreItem(a, q, target); });
  return out;
}

/* =====================================================================
   Lyrics view (lrclib.net → lyrics.ovh → in-session cache)
   ===================================================================== */
var lyrCache = {};         // trackId -> { text, synced: [{time, line}], at }
var lyrLoading = {};       // trackId -> true
var lyricsState = { open:false, trackId:null, synced:null, plain:null, curLine:-1, err:false };

function lyricsUrlTypes(){}  // placeholder guard (kept tiny)

function parseSynced(lyrics){
  var lines = String(lyrics || '').split(/\r?\n/);
  var out = [];
  lines.forEach(function(l){
    var m = l.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
    if (!m) return;
    var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + (m[3] ? parseInt(m[3], 10) / (m[3].length === 3 ? 1000 : 10) : 0);
    var text = m[4].replace(/<[^>]+>/g, '').trim();
    if (text) out.push({ time: t, line: text });
  });
  return out;
}

function lyricsFor(trackId){
  var t = TRACK_MAP[trackId];
  if (!t) return Promise.resolve(null);
  var hit = lyrCache[trackId];
  if (hit && Date.now() - hit.at < 60 * 60 * 1000) return Promise.resolve(hit);
  var key = t.id;
  return (async function(){
    var text = null, synced = null;
    try {
      var url = 'https://lrclib.net/api/get?track_name=' + encodeURIComponent(t.title) + '&artist_name=' + encodeURIComponent(t.artist || '');
      var res = await fetch(url, { cache:'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined });
      if (res.ok){
        var d = await res.json();
        if (d && d.plainLyrics) text = d.plainLyrics;
        if (d && d.syncedLyrics) synced = parseSynced(d.syncedLyrics);
      }
    } catch (e) {}
    if (!text){
      try {
        var url2 = 'https://api.lyrics.ovh/v1/' + encodeURIComponent(t.artist || '') + '/' + encodeURIComponent(t.title);
        var res2 = await fetch(url2, { cache:'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined });
        if (res2.ok){
          var d2 = await res2.json();
          if (d2 && d2.lyrics) text = d2.lyrics;
        }
      } catch (e) {}
    }
    if (!text) return null;
    var entry = { text: text, synced: synced, at: Date.now() };
    lyrCache[key] = entry;
    return entry;
  })();
}

function renderLyrics(t){
  var wrap = $('#npLyricsWrap');
  var bodyEl = $('#npLyricsBody');
  if (!wrap || !bodyEl) return;
  if (lyricsState.open){ wrap.hidden = false; }
  if (!lyricsState.open){ wrap.hidden = true; return; }
  bodyEl.innerHTML = '<div class="lyrics-status">Fetching lyrics…</div>';
  lyricsFor(t.id).then(function(entry){
    if (!lyricsState.open) return;
    if (!entry){
      bodyEl.innerHTML = '<div class="lyrics-status">Lyrics unavailable for this track.</div>';
      return;
    }
    if (entry.synced && entry.synced.length){
      bodyEl.innerHTML = entry.synced.map(function(x, i){ return '<div class="lyrics-line" data-i="' + i + '">' + esc(x.line) + '</div>'; }).join('');
    } else {
      bodyEl.innerHTML = '<div class="lyrics-plain">' + esc(entry.text).replace(/\n/g, '<br>') + '</div>';
    }
    lyricsState.synced = entry.synced; lyricsState.plain = entry.text;
    lyricsTick();
  }).catch(function(){
    if (!lyricsState.open) return;
    bodyEl.innerHTML = '<div class="lyrics-status">Lyrics unavailable for this track.</div>';
  });
}

function lyricsTick(){
  var wrap = $('#npLyricsWrap');
  var bodyEl = $('#npLyricsBody');
  if (!wrap || wrap.hidden) return;
  if (!lyricsState.synced || !lyricsState.synced.length) return;
  var t = currentTrack();
  if (!t) return;
  var pos = state.progress || 0;
  var idx = -1;
  for (var i = 0; i < lyricsState.synced.length; i++){
    if (pos >= lyricsState.synced[i].time) idx = i;
  }
  if (idx === lyricsState.curLine) return;
  lyricsState.curLine = idx;
  var lines = bodyEl.querySelectorAll('.lyrics-line');
  lines.forEach(function(el){ el.classList.toggle('cur', Number(el.dataset.i) === idx); });
  var active = bodyEl.querySelector('.lyrics-line.cur');
  if (active){
    var target = active.offsetTop - (bodyEl.clientHeight / 2) + (active.clientHeight / 2);
    bodyEl.scrollTop = Math.max(0, target);
  }
}

/* =====================================================================
   Custom playlist images (drawn to canvas, stored as WebP data URIs)
   ===================================================================== */
function playlistImage(pl){
  return (pl && pl.image) || null;
}

function setPlaylistImage(pl, dataUrl){
  pl.image = dataUrl || null;
  dbPut('playlists', pl);
}

function handlePlaylistImagePick(pl){
  if (!pl) return;
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(){
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 8 * 1048576){ toast('Image too large — use under 8 MB'); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        try {
          var max = 512, w = img.width, h = img.height;
          if (w > max || h > max){
            if (w >= h){ h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var url = canvas.toDataURL('image/webp', 0.82);
          if (!url.indexOf('data:image/webp') === 0) url = canvas.toDataURL('image/jpeg', 0.85);
          setPlaylistImage(pl, url);
          toast('Playlist image updated');
          render();
        } catch (e) {
          toast('Could not process the image');
        }
      };
      img.onerror = function(){ toast('Could not read the image'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* =====================================================================
   Playlist export / import / Google Drive sync
   Export: one JSON file with playlists + tracks, downloaded locally.
   Import: reads a file (JSON array/object or title/artist list) and
   searches + adds tracks into a new playlist.
   Drive sync (optional, user-provided Client ID — stored locally only,
   never committed): upload or restore a sonora-playlists.json file.
   ===================================================================== */
function buildPlaylistExport(){
  var ids = state.playlists.map(function(pl){
    return {
      id: pl.id, name: pl.name, createdAt: pl.createdAt || null,
      tracks: (pl.tracks || []).map(function(tid){
        var t = TRACK_MAP[tid];
        return { id: tid, title: t ? t.title : null, artist: t ? t.artist : null };
      })
    };
  });
  return { version: 1, app: 'sonora', exportedAt: new Date().toISOString(), playlists: ids };
}

function exportPlaylists(){
  var payload = buildPlaylistExport();
  if (!payload.playlists.length){ toast('No playlists to export yet'); return; }
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sonora-playlists.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Exported ' + payload.playlists.length + ' playlist' + (payload.playlists.length === 1 ? '' : 's'));
}

function importPlaylists(file){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        resolve(normalizeImported(reader.result));
      } catch (e) {
        toast('Could not read that file — use sonora-playlists.json or a Title, Artist list');
        resolve(null);
      }
    };
    reader.onerror = function(){ toast('Could not read that file'); resolve(null); };
    reader.readAsText(file);
  });
}

function normalizeImported(raw){
  raw = String(raw || '').trim();
  var obj;
  try { obj = JSON.parse(raw); } catch (e) {
    var lines = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean).filter(function(l){ return l[0] !== '#'; });
    var items = lines.map(function(l){
      var m = l.match(/^([^——-]+?)\s*[-—–/]\s*(.+)$/);
      if (m) return { title: m[1].trim(), artist: m[2].trim() };
      var i = l.indexOf(' - ');
      if (i > 0) return { title: l.slice(0, i).trim(), artist: l.slice(i + 3).trim() };
      return { title: l, artist: '' };
    });
    return { playlists: [{ name: 'Imported', items: items }] };
  }
  if (Array.isArray(obj)) obj = { playlists: obj };
  if (obj && Array.isArray(obj.playlists)){
    return obj;  // sonora format — reuse as-is
  }
  if (obj && obj.items && Array.isArray(obj.items)){
    return { playlists: [{ name: obj.name || 'Imported', items: obj.items }] };
  }
  if (obj && Array.isArray(obj)){ /* handled above */ }
  if (obj && obj.name && Array.isArray(obj.tracks)){
    return { playlists: [{ name: obj.name, items: obj.tracks }] };
  }
  /* Spotify/YT export-ish shapes */
  var items = [];
  Object.keys(obj || {}).forEach(function(k){
    var v = obj[k];
    if (Array.isArray(v)) items = items.concat(v);
    else if (v && (v.title || v.name)) items.push({ title: v.title || v.name, artist: v.artist || v.artists || (Array.isArray(v.artists) ? v.artists.join(', ') : '') });
  });
  if (!items.length && obj && (obj.title || obj.name)) items = [{ title: obj.title || obj.name, artist: obj.artist || '' }];
  if (!items.length) return null;
  return { playlists: [{ name: obj.name || 'Imported', items: items }] };
}

var importing = false;

async function importPlaylist(file){
  if (importing) return;
  importing = true;
  try {
    var payload = await importPlaylists(file);
    if (!payload || !payload.playlists || !payload.playlists.length) return;
    var playlists = [];
    /* if a sonora-exported file, honor playlists directly */
    if (payload.playlists[0] && payload.playlists[0].tracks){
      payload.playlists.forEach(function(p){
        playlists.push({ name: p.name || 'Imported Playlist', tracks: p.tracks || [] });
      });
    } else {
      payload.playlists.forEach(function(p){
        playlists.push({ name: p.name || 'Imported Playlist', items: p.items || [] });
      });
    }
    var totalTracks = playlists.reduce(function(n, p){ return n + (p.tracks ? p.tracks.length : (p.items ? p.items.length : 0)); }, 0);
    if (!totalTracks){ toast('Nothing to import'); return; }
    var created = 0, added = 0, skipped = 0;
    toast('Importing ' + totalTracks + ' track' + (totalTracks === 1 ? '' : 's') + '…');
    for (var i = 0; i < playlists.length; i++){
      var p = playlists[i];
      var entries = p.tracks || p.items || [];
      var pl = newPlaylist(p.name || 'Imported Playlist');
      created++;
      var had = false;
      for (var j = 0; j < entries.length; j++){
        var entry = entries[j];
        var title = entry.title || entry.name || '';
        var artist = entry.artist || entry.artists || '';
        if (!title){ skipped++; continue; }
        try {
          /* re-register known tracks from sonora exports (no network needed) */
          if (typeof entry === 'object' && entry.id && TRACK_MAP[entry.id]){
            pl.tracks.push(entry.id); added++; had = true; continue;
          }
          var res = await Backend.searchSongs(artist ? (artist + ' ' + title).trim() : title);
          var best = res.tracks && res.tracks[0];
          if (best){ pl.tracks.push(best.id); added++; had = true; }
          else skipped++;
        } catch (e) { skipped++; }
        await new Promise(function(r){ setTimeout(r, 220); });
      }
      if (had) dbPut('playlists', pl);
      else {
        /* nothing matched — drop this playlist silently */
        state.playlists = state.playlists.filter(function(x){ return x.id !== pl.id; });
        dbDel('playlists', pl.id);
      }
    }
    toast('Imported ' + added + ' song' + (added === 1 ? '' : 's') + (skipped ? ' · ' + skipped + ' not found' : ''));
    state.tab = 'library'; state.view = 'library'; state.libTab = 'playlists';
    render();
  } finally {
    importing = false;
  }
}

function importPlaylistsFromFile(file){
  if (!file) return;
  importPlaylist(file);
}

/* ---------- Google Drive sync — credentials stay on this device ---------- */
var gdrive = {
  clientId: '', fileId: '', lastSync: 0, token: null, signIn: false
};

function gdriveConfigured(){ return !!gdrive.clientId; }

function gdriveLoadClientId(){
  var saved = null;
  try { saved = LS.get('sonora.gdrive.clientId', ''); } catch (e) {}
  if (saved) gdrive.clientId = saved;
}
function gdriveSaveClientId(v){
  gdrive.clientId = String(v || '').trim();
  try { LS.set('sonora.gdrive.clientId', gdrive.clientId); } catch (e) {}
}

function gdriveLoadFileId(){
  try { gdrive.fileId = LS.get('sonora.gdrive.fileId', ''); } catch (e) { gdrive.fileId = ''; }
}
function gdriveSaveFileId(v){
  gdrive.fileId = String(v || '').trim();
  try { LS.set('sonora.gdrive.fileId', gdrive.fileId); } catch (e) {}
}

function gdriveSignIn(){
  if (!gdriveConfigured()){ toast('Add your Google Client ID in Settings first'); return; }
  var finish = function(){ /* GIS callback */ };
  if (window.google && google.accounts && google.accounts.oauth2){ return gdrivePopupFlow(); }
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.defer = true;
  s.onload = function(){ gdrivePopupFlow(); };
  s.onerror = function(){ toast('Google sign-in unavailable — check your connection'); };
  document.head.appendChild(s);
}

function gdrivePopupFlow(){
  try {
    var client = google.accounts.oauth2.initTokenClient({
      client_id: gdrive.clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: function(resp){
        if (resp && resp.access_token){
          gdrive.token = resp.access_token;
          toast('Signed in to Google Drive');
          state.ready = true;
          render();
        } else {
          toast('Drive sign-in was cancelled');
        }
      }
    });
    client.requestAccessToken();
  } catch (e) {
    toast('Drive sign-in unavailable');
  }
}

function gdriveEnsureToken(){
  if (gdrive.token) return Promise.resolve(gdrive.token);
  return new Promise(function(resolve){
    if (window.google && google.accounts && google.accounts.oauth2){
      try {
        var client = google.accounts.oauth2.initTokenClient({
          client_id: gdrive.clientId,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: function(resp){ resolve(resp && resp.access_token ? resp.access_token : null); }
        });
        client.requestAccessToken();
        return;
      } catch (e) {}
    }
    toast('Drive sign-in unavailable');
    resolve(null);
  });
}

async function gdrivePull(){
  var token = await gdriveEnsureToken();
  if (!token) return;
  try {
    if (gdrive.fileId){
      var res = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(gdrive.fileId) + '?alt=media', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 200){
        var payload = await res.json();
        importFromPayload(payload);
        return;
      }
      if (res.status === 404) gdrive.fileId = '';
    }
    /* no local record of the file — search for it */
    var q = encodeURIComponent("name = 'sonora-playlists.json' and trashed = false");
    var list = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!list.ok) throw new Error('HTTP ' + list.status);
    var data = await list.json();
    if (!data.files || !data.files.length){ toast('No sonora-playlists.json on Google Drive yet'); return; }
    gdriveSaveFileId(data.files[0].id);
    var dl = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(data.files[0].id) + '?alt=media', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!dl.ok) throw new Error('HTTP ' + dl.status);
    var p2 = await dl.json();
    importFromPayload(p2);
  } catch (e) {
    toast('Could not download from Drive — try exporting locally instead');
  }
}

function importFromPayload(payload){
  if (!payload || !payload.playlists || !payload.playlists.length){ toast('The file has no playlists'); return; }
  if (!confirm('Replace ' + state.playlists.length + ' local playlist(s) with the ' + payload.playlists.length + ' from Google Drive?')) return;
  state.playlists = [];
  payload.playlists.forEach(function(p){
    var pl = { id: p.id || ('pl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
               name: p.name || 'Imported Playlist',
               tracks: (p.tracks || []).map(function(t){ return typeof t === 'string' ? t : t.id; }).filter(Boolean),
               createdAt: p.createdAt || Date.now(),
               image: p.image || null };
    /* re-register track objects if known */
    (p.tracks || []).forEach(function(t){
      if (typeof t === 'object' && t && t.id){
        if (!TRACK_MAP[t.id]) TRACK_MAP[t.id] = { id: t.id, title: t.title || 'Unknown track', artist: t.artist || '', thumb: t.thumb || '', dur: 0, source: 'saved' };
      }
    });
    state.playlists.push(pl);
    dbDel('playlists', pl.id);
    dbPut('playlists', pl);
  });
  state.activePlaylist = null; state.view = 'library'; state.libTab = 'playlists';
  render();
  toast('Restored ' + payload.playlists.length + ' playlist' + (payload.playlists.length === 1 ? '' : 's') + ' from Drive');
}

async function gdrivePush(){
  var token = await gdriveEnsureToken();
  if (!token) return;
  var payload = buildPlaylistExport();
  payload.updatedAt = new Date().toISOString();
  var body = JSON.stringify(payload);
  var metadata = { name: 'sonora-playlists.json', mimeType: 'application/json' };
  try {
    if (gdrive.fileId){
      var res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + encodeURIComponent(gdrive.fileId) + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: body
      });
      if (res.status === 200){ gdrive.lastSync = Date.now(); toast('Synced to Google Drive'); render(); return; }
      if (res.status !== 404) throw new Error('HTTP ' + res.status);
      gdriveSaveFileId('');
    }
    var metadataJson = JSON.stringify(metadata);
    var multipart = 'sonora';
    var boundary = 'sonora-boundary-' + Math.random().toString(36).slice(2);
    var multipartBody = [
      '--' + boundary,
      'Content-Type: application/json; charset=UTF-8',
      '',
      metadataJson,
      '--' + boundary,
      'Content-Type: application/json',
      '',
      body,
      '--' + boundary + '--'
    ].join('\r\n');
    var create = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: multipartBody
    });
    if (!create.ok) throw new Error('HTTP ' + create.status);
    var created = await create.json();
    if (created && created.id) gdriveSaveFileId(created.id);
    gdrive.lastSync = Date.now();
    toast('Synced to Google Drive');
    render();
  } catch (e) {
    toast('Could not sync to Drive — export locally instead');
  }
}

function gdriveSignOut(){
  gdrive.token = null;
  toast('Signed out of Google Drive');
  render();
}

/* ---------- album fallback: artist songs when the track list is empty ---------- */
function artistSongsFallback(album){
  if (!album || !album.artist || album.artist === 'Unknown artist') return '';
  var st = albumSongsState[album.id];
  if (!st || st === 'loading') return '';
  var songs = (st && st.songs) || [];
  if (!songs.length) return '';
  return '<div class="sec-head" style="padding:14px 16px 4px"><h3 style="font-size:15px">Songs by ' + esc(album.artist) + '</h3></div>' +
    '<div class="rows">' + songs.map(trackRow).join('') + '</div>';
}
var albumSongsState = {};   // albumId -> 'loading' | 'loaded' | {songs:[...]}

async function loadAlbumArtistSongs(albumId){
  var a = state.activeAlbumObj;
  if (!a || a.id !== albumId) return;
  if (albumSongsState[albumId] !== undefined) return;
  albumSongsState[albumId] = 'loading';
  try {
    var res = await Backend.searchSongs(a.artist);
    var songs = (res.tracks || []).filter(function(t){
      var art = String(t.artist || '').toLowerCase();
      return art.indexOf(String(a.artist || '').toLowerCase()) >= 0 || art.indexOf(String(a.artist || '').toLowerCase().split(' ')[0]) >= 0;
    });
    if (!songs.length) songs = res.tracks || [];
    albumSongsState[albumId] = { songs: songs.slice(0, 20) };
    if (state.view === 'album' && state.activeAlbumObj && state.activeAlbumObj.id === albumId) render();
  } catch (e) {
    albumSongsState[albumId] = { songs: [] };
  }
}

function isStandaloneMode(){
  try {
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.matchMedia('(display-mode: fullscreen)').matches ||
           navigator.standalone === true;
  } catch(e){ return false; }
}

function manifestObject(){
  return {
    id: location.pathname || '/',
    name: 'Sonora',
    short_name: 'Sonora',
    description: 'A YouTube Music client — clean audio, single file.',
    start_url: location.pathname + location.search,
    scope: location.pathname.replace(/[^/]*$/, ''),
    display: 'standalone',
    display_override: ['standalone', 'minimal-ui'],
    orientation: 'portrait',
    background_color: '#0b0906',
    theme_color: '#0b0906',
    lang: 'en',
    categories: ['music', 'entertainment'],
    icons: [
      { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: ICON_MASK, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
}

async function initPWA(){
  standalone = isStandaloneMode();
  if (standalone) document.body.classList.add('standalone');
  try {
    window.matchMedia('(display-mode: standalone)').addEventListener('change', function(ev){
      standalone = ev.matches;
      document.body.classList.toggle('standalone', standalone);
      render();
    });
  } catch(e){}

  /* The <link> already points at manifest.webmanifest. If that file isn't there
     (opened as a lone file, or hosted without it), build one at runtime instead. */
  var link = document.getElementById('manifest-link');
  var haveExternal = false;
  if (location.protocol === 'http:' || location.protocol === 'https:'){
    try {
      var ctrl = new AbortController();
      var tmo = setTimeout(function(){ ctrl.abort(); }, 4000);
      var mr = await fetch('manifest.webmanifest', { cache:'no-store', signal: ctrl.signal });
      clearTimeout(tmo);
      haveExternal = mr.ok;
    } catch(e){ haveExternal = false; }
  }
  if (!haveExternal){
    try {
      var blob = new Blob([JSON.stringify(manifestObject())], { type:'application/manifest+json' });
      link.href = URL.createObjectURL(blob);
    } catch(e){}
  }

  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')){
    try { await navigator.serviceWorker.register('sw.js', { scope:'./' }); } catch(e){}
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e; state.canInstall = true; render();
  });
  window.addEventListener('appinstalled', function(){ state.canInstall = false; toast('Installed — open Sonora from your home screen'); render(); });
}

/* ------------------------------ boot ------------------------------ */
function paintStaticIcons(){
  var set = function(sel, svg){ var el = document.querySelector(sel); if (el) el.innerHTML = svg; };
  set('#np [data-act="close-np"]', ICONS.down);
  set('#np [data-act="np-menu"]', ICONS.dots);
  set('#np [data-act="prev"]', ICONS.prev);
  set('#np [data-act="next"]', ICONS.next);
  set('#shufBtn', ICONS.shuffle);
  set('#repBtn', ICONS.repeat);
  set('#npToggleBtn', ICONS.play);
  set('#npLike', ICONS.heart);
  set('#npDl', ICONS.download);
  set('#miniToggle', ICONS.play);
  set('#npLyricsBtn', ICONS.lyrics);
}

async function boot(){
  gdriveLoadClientId();
  gdriveLoadFileId();
  state.settings = Object.assign({}, state.settings, LS.get('sonora.settings', {}));
  delete state.settings.apiKey;  /* YouTube Data API key no longer exists */
  state.recent = LS.get('sonora.recent', []);
  state.installDismissed = LS.get('sonora.installDismissed', false);

  db = await openDB();
  state.playlists = (await dbAll('playlists')).sort(function(a,b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  state.albums = await dbAll('albums');
  state.liked = await dbAll('liked');
  state.downloads = await dbAll('downloads');

  /* re-register tracks referenced by saved library so they resolve offline */
  state.downloads.forEach(function(d){
    if (!TRACK_MAP[d.id]) TRACK_MAP[d.id] = { id:d.id, title:d.title, artist:d.artist, thumb:d.thumb, dur:0, source:'saved' };
  });

  paintStaticIcons();
  state.ready = true;
  render();
  await initPWA();
  render();
  Backend.probe().then(function(){ render(); });

  if (navigator.onLine === false) state.net = 'down';
  window.addEventListener('online', function(){ Backend.working = null; probeAndRender(); });
  window.addEventListener('offline', function(){ state.net = 'down'; render(); });

}

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('gestureend', function(e){ e.preventDefault(); });

boot();
</script>
